                        label: "New Screen",
                        version: "v1",
                        x: pt.x,
                        y: pt.y,
                        w: 250,
                        h: 185,
                        childId: newId,
                    };
                    cv.nodes.push(newNode);
                    cv.children[newId] = {
                        id: newId,
                        title: "New Screen",
                        parent: cv.id,
                        nodes: [],
                        assets: [],
                        pins: [],
                        drawings: [],
                        frames: [],
                        children: {},
                    };
                    render();
                    setActiveTool("select");
                    openImagePicker(newNode);
                } else if (currentTool === "text") {
                    const cv = getCanvas(path);
                    cv.assets.push({
                        type: "text",
                        id: "t" + Date.now(),
                        x: pt.x,
                        y: pt.y,
                        w: 200,
                        text: "New note — double-click to edit",
                    });
                    render();
                    setTimeout(() => {
                        document.querySelector(".text-card:last-of-type");
                    }, 0);
                    setActiveTool("select");
                } else if (currentTool === "image") {
                    const cv = getCanvas(path);
                    const newAsset = {
                        type: "image",
                        id: "i" + Date.now(),
                        x: pt.x,
                        y: pt.y,
                        w: 200,
                        h: 150,
                        label: "Untitled asset",
                        thumb: null,
                    };
                    cv.assets.push(newAsset);
                    render();
                    setActiveTool("select");
                    openImagePicker(newAsset);
                } else if (currentTool === "link") {
                    const url = prompt(
                        "Link URL (e.g. a Figma file or live preview):",
                        "https://figma.com/file/...",
                    );
                    if (url) {
                        const label = prompt(
                            "Label for this link:",
                            "Figma file",
                        );
                        const cv = getCanvas(path);
                        cv.assets.push({
                            type: "link",
                            id: "l" + Date.now(),
                            x: pt.x,
                            y: pt.y,
                            url,
                            label: label || url,
                        });
                        render();
                    }
                    setActiveTool("select");
                }
            });

            viewportEl.addEventListener("dblclick", (e) => {
                if (currentTool !== "select") return;
                if (
                    e.target.closest(
                        ".node, .asset-card, .pin, .sprintchip, .sticky, #toolbar, #zoomctl",
                    )
                )
                    return;
                const pt = screenToCanvas(e.clientX, e.clientY);
                pendingPin = { x: pt.x, y: pt.y, mode: "new" };
                document.getElementById("pcType").value = "feature";
                populateSprintSelect("Sprint 16");
                document.getElementById("pcNoteLabel").textContent = "Note";
                document.getElementById("pcNote").placeholder =
                    "Describe what's wrong or proposed…";
                document.getElementById("pcNote").value = "";
                document.getElementById("pcThread").innerHTML = "";
                document.getElementById("pcAddCommentRow").style.display =
                    "none";
                document.getElementById("pcAdoBlock").style.display = "none";
                document.getElementById("pcAdoLinkBtn").style.display = "flex";
                document.getElementById("pcDeletePin").style.display = "none";
                openCardAt(e.clientX, e.clientY);
            });

            function setActiveTool(name) {
                selectToolByName(name);
            }

            /* ---- unified pointer system: drawing, touch-pan, pinch-zoom ---- */
            const pointers = new Map();
            let mode = null; // 'draw' | 'pan' | 'pinch'
            let drawTempEl = null,
                drawPoints = [];
            let panStart = null,
                pinchStart = null;
            let lastLassoAt = 0;
            let spaceHeld = false;

            function ptDist(a, b) {
                return Math.hypot(a.x - b.x, a.y - b.y);
            }
            function ptMid(a, b) {
                return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
            }

            viewportEl.addEventListener(
                "pointerdown",
                (e) => {
                    if (!spaceHeld) return;
                    e.stopImmediatePropagation();
                    e.preventDefault();
                    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
                    try {
                        viewportEl.setPointerCapture(e.pointerId);
                    } catch (err) {}
                    mode = "pan";
                    panStart = {
                        x: e.clientX,
                        y: e.clientY,
                        panX0: panX,
                        panY0: panY,
                    };
                    viewportEl.classList.add("panning");
                },
                true,
            );

            viewportEl.addEventListener("pointerdown", (e) => {
                const onInteractive = e.target.closest(
                    ".node, .asset-card, .pin",
                );
                if (onInteractive && currentTool === "select" && !e.shiftKey)
                    return; // select tool: let the item handle its own drag
                pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
                try {
                    viewportEl.setPointerCapture(e.pointerId);
                } catch (err) {}

                if (pointers.size === 2) {
                    if (drawTempEl) {
                        drawTempEl.remove();
                        drawTempEl = null;
                        drawPoints = [];
                    }
                    mode = "pinch";
                    const pts = [...pointers.values()];
                    pinchStart = {
                        d: ptDist(pts[0], pts[1]),
                        zoom0: zoom,
                        mid: ptMid(pts[0], pts[1]),
                        panX0: panX,
                        panY0: panY,
                    };
                    return;
                }
                if (pointers.size > 2) return;

                if (["pen", "highlight", "arrow"].includes(currentTool)) {
                    mode = "draw";
                    const pt = screenToCanvas(e.clientX, e.clientY);
                    if (currentTool === "arrow") {
                        drawTempEl = document.createElementNS(
                            "http://www.w3.org/2000/svg",
                            "line",
                        );
                        drawTempEl.setAttribute("class", "arrow-line");
                        if (currentArrowHead === "end")
                            drawTempEl.setAttribute(
                                "marker-end",
                                "url(#arrowhead-end)",
                            );
                        if (currentArrowHead === "both") {
                            drawTempEl.setAttribute(
                                "marker-end",
                                "url(#arrowhead-end)",
                            );
                            drawTempEl.setAttribute(
                                "marker-start",
                                "url(#arrowhead-start)",
                            );
                        }
                        if (currentArrowDash)
                            drawTempEl.setAttribute("stroke-dasharray", "7 6");
                        drawTempEl.setAttribute("x1", dm(pt.x));
                        drawTempEl.setAttribute("y1", dm(pt.y));
                        drawTempEl.setAttribute("x2", dm(pt.x));
                        drawTempEl.setAttribute("y2", dm(pt.y));
                        drawlayer.appendChild(drawTempEl);
                        drawPoints = [pt, pt];
                    } else {
                        drawPoints = [pt];
                        drawTempEl = document.createElementNS(
                            "http://www.w3.org/2000/svg",
                            "path",
                        );
                        drawTempEl.setAttribute(
                            "class",
                            currentTool === "pen" ? "pen-stroke" : "hl-stroke",
                        );
                        if (currentTool === "highlight")
                            drawTempEl.style.stroke = currentHighlightColor;
                        if (currentTool === "pen")
                            drawTempEl.style.stroke = currentPenColor;
                        drawTempEl.setAttribute(
                            "d",
                            `M${dm(pt.x)},${dm(pt.y)}`,
                        );
                        drawlayer.appendChild(drawTempEl);
                    }
                } else if (currentTool === "frame") {
                    mode = "frame";
                    const ptRaw = screenToCanvas(e.clientX, e.clientY);
                    const pt = { x: snapVal(ptRaw.x), y: snapVal(ptRaw.y) };
                    drawPoints = [pt, pt];
                    drawTempEl = document.createElement("div");
                    drawTempEl.className = "frame-box";
                    drawTempEl.style.left = pt.x + "px";
                    drawTempEl.style.top = pt.y + "px";
                    drawTempEl.style.width = "0px";
                    drawTempEl.style.height = "0px";
                    nodesLayer.appendChild(drawTempEl);
                } else if (
                    currentTool === "lasso" ||
                    (currentTool === "select" && e.shiftKey)
                ) {
                    mode = "lasso";
                    const pt = screenToCanvas(e.clientX, e.clientY);
                    drawPoints = [pt, pt];
                    drawTempEl = document.createElement("div");
                    drawTempEl.className = "lasso-box";
                    drawTempEl.style.left = pt.x + "px";
                    drawTempEl.style.top = pt.y + "px";
                    drawTempEl.style.width = "0px";
                    drawTempEl.style.height = "0px";
                    nodesLayer.appendChild(drawTempEl);
                } else if (currentTool === "select" && !onInteractive) {
                    mode = "pan";
                    panStart = {
                        x: e.clientX,
                        y: e.clientY,
                        panX0: panX,
                        panY0: panY,
                    };
                }
            });

            viewportEl.addEventListener("pointermove", (e) => {
                if (!pointers.has(e.pointerId)) return;
                pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

                if (mode === "pinch" && pointers.size >= 2 && pinchStart) {
                    const pts = [...pointers.values()];
                    const d = ptDist(pts[0], pts[1]);
                    const newZoom = Math.min(
                        8,
                        Math.max(0.4, pinchStart.zoom0 * Math.pow(d / pinchStart.d, 1.35)),
                    );
                    const rect = viewportEl.getBoundingClientRect();
                    const midCanvasX =
                        (pinchStart.mid.x - rect.left - pinchStart.panX0) /
                        pinchStart.zoom0;
                    const midCanvasY =
                        (pinchStart.mid.y - rect.top - pinchStart.panY0) /
                        pinchStart.zoom0;
                    zoom = newZoom;
                    panX = pinchStart.mid.x - rect.left - midCanvasX * zoom;
                    panY = pinchStart.mid.y - rect.top - midCanvasY * zoom;
                    applyTransform();
                } else if (mode === "pan" && panStart) {
                    panX = panStart.panX0 + (e.clientX - panStart.x);
                    panY = panStart.panY0 + (e.clientY - panStart.y);
                    applyTransform();
                } else if (mode === "draw" && drawTempEl) {
                    const pt = screenToCanvas(e.clientX, e.clientY);
                    if (currentTool === "arrow") {
                        drawTempEl.setAttribute("x2", dm(pt.x));
                        drawTempEl.setAttribute("y2", dm(pt.y));
                        drawPoints[1] = pt;
                    } else {
                        drawPoints.push(pt);
                        const d =
                            `M${dm(drawPoints[0].x)},${dm(drawPoints[0].y)} ` +
                            drawPoints
                                .slice(1)
                                .map((p) => `L${dm(p.x)},${dm(p.y)}`)
                                .join(" ");
                        drawTempEl.setAttribute("d", d);
                    }
                } else if (mode === "frame" && drawTempEl) {
                    const pt = screenToCanvas(e.clientX, e.clientY);
                    drawPoints[1] = { x: snapVal(pt.x), y: snapVal(pt.y) };
                    const x = Math.min(drawPoints[0].x, drawPoints[1].x),
                        y = Math.min(drawPoints[0].y, drawPoints[1].y);
                    const w = Math.abs(drawPoints[1].x - drawPoints[0].x),
                        h = Math.abs(drawPoints[1].y - drawPoints[0].y);
                    drawTempEl.style.left = x + "px";
                    drawTempEl.style.top = y + "px";
                    drawTempEl.style.width = w + "px";
                    drawTempEl.style.height = h + "px";
                } else if (mode === "lasso" && drawTempEl) {
                    const pt = screenToCanvas(e.clientX, e.clientY);
                    drawPoints[1] = pt;
                    const x = Math.min(drawPoints[0].x, pt.x),
                        y = Math.min(drawPoints[0].y, pt.y);
                    const w = Math.abs(pt.x - drawPoints[0].x),
                        h = Math.abs(pt.y - drawPoints[0].y);
                    drawTempEl.style.left = x + "px";
                    drawTempEl.style.top = y + "px";
                    drawTempEl.style.width = w + "px";
                    drawTempEl.style.height = h + "px";
                }
            });

            function endPointer(e) {
                pointers.delete(e.pointerId);
                try {
                    viewportEl.releasePointerCapture(e.pointerId);
                } catch (err) {}
                if (pointers.size === 0)
                    viewportEl.classList.remove("panning");

                if (mode === "draw" && pointers.size === 0) {
                    const cv = getCanvas(path);
                    if (currentTool === "arrow" && drawPoints[1]) {
                        pushUndo();
                        const startRef = findSnapTarget(cv, drawPoints[0]);
                        const endRef = findSnapTarget(cv, drawPoints[1]);
                        cv.drawings.push({
                            id: "dr" + Date.now(),
                            type: "arrow",
                            x1: drawPoints[0].x,
                            y1: drawPoints[0].y,
                            x2: drawPoints[1].x,
                            y2: drawPoints[1].y,
                            head: currentArrowHead,
                            dashed: currentArrowDash,
                            startRef,
                            endRef,
                        });
                    } else if (
                        currentTool !== "arrow" &&
                        drawPoints.length > 1
                    ) {
                        pushUndo();
                        const dr = {
                            id: "dr" + Date.now(),
                            type: currentTool === "pen" ? "pen" : "highlight",
                            points: drawPoints.slice(),
                        };
                        if (currentTool === "highlight")
                            dr.color = currentHighlightColor;
                        if (currentTool === "pen") dr.color = currentPenColor;
                        cv.drawings.push(dr);
                    }
                    drawTempEl = null;
                    drawPoints = [];
                    render();
                }

                if (mode === "frame" && pointers.size === 0) {
                    const cv = getCanvas(path);
                    const x = Math.min(drawPoints[0].x, drawPoints[1].x),
                        y = Math.min(drawPoints[0].y, drawPoints[1].y);
                    const w = Math.abs(drawPoints[1].x - drawPoints[0].x),
                        h = Math.abs(drawPoints[1].y - drawPoints[0].y);
                    if (drawTempEl) drawTempEl.remove();
                    drawTempEl = null;
                    drawPoints = [];
                    if (w > 20 && h > 20) {
                        pushUndo();
                        cv.frames.push({
                            x,
                            y,
                            w,
                            h,
                            label: "New Frame",
                            collapsed: false,
                        });
                        setActiveTool("select");
                    }
                    render();
                }

                if (mode === "lasso" && pointers.size === 0) {
                    const cv = getCanvas(path);
                    const lx = Math.min(drawPoints[0].x, drawPoints[1].x),
                        ly = Math.min(drawPoints[0].y, drawPoints[1].y);
                    const lw = Math.abs(drawPoints[1].x - drawPoints[0].x),
                        lh = Math.abs(drawPoints[1].y - drawPoints[0].y);
                    if (drawTempEl) drawTempEl.remove();
                    drawTempEl = null;
                    drawPoints = [];
                    multiSelected.clear();
                    if (lw > 8 && lh > 8) {
                        const lassoRect = { x: lx, y: ly, w: lw, h: lh };
                        const intersects = (r) =>
                            r &&
                            lassoRect.x < r.x + r.w &&
                            lassoRect.x + lassoRect.w > r.x &&
                            lassoRect.y < r.y + r.h &&
                            lassoRect.y + lassoRect.h > r.y;
                        cv.nodes.forEach((n) => {
                            if (intersects(getObjectRect(n, cv)))
                                multiSelected.add(n);
                        });
                        (cv.assets || []).forEach((a) => {
                            if (intersects(getObjectRect(a, cv)))
                                multiSelected.add(a);
                        });
                        (cv.pins || []).forEach((p) => {
                            if (intersects(getObjectRect(p, cv)))
                                multiSelected.add(p);
                        });
                    }
                    setActiveTool("select");
                    render();
                    lastLassoAt = Date.now();
                }

                if (pointers.size < 2) pinchStart = null;
                if (pointers.size === 1 && mode === "pinch") {
                    mode = "pan";
                    const remaining = [...pointers.values()][0];
                    panStart = {
                        x: remaining.x,
                        y: remaining.y,
                        panX0: panX,
                        panY0: panY,
                    };
                } else if (pointers.size === 0) {
                    mode = null;
                    panStart = null;
                }
            }
            viewportEl.addEventListener("pointerup", endPointer);
            viewportEl.addEventListener("pointercancel", endPointer);

            /* ============================================================ ZOOM / PAN ============================================================ */
            viewportEl.addEventListener(
                "wheel",
                (e) => {
                    e.preventDefault();
                    if (e.ctrlKey || e.metaKey) {
                        const delta = -e.deltaY * 0.0028;
                        const newZoom = Math.min(
                            8,
                            Math.max(0.4, zoom * (1 + delta)),
                        );
                        const rect = viewportEl.getBoundingClientRect();
                        const cx = e.clientX - rect.left,
                            cy = e.clientY - rect.top;
                        const canvasX = (cx - panX) / zoom,
                            canvasY = (cy - panY) / zoom;
                        zoom = newZoom;
                        panX = cx - canvasX * zoom;
                        panY = cy - canvasY * zoom;
                    } else {
                        panX -= e.deltaX;
                        panY -= e.deltaY;
                    }
                    applyTransform();
                },
                { passive: false },
            );

            document.getElementById("zoomIn").onclick = () => {
                zoomBy(1.2);
            };
            document.getElementById("zoomOut").onclick = () => {
                zoomBy(1 / 1.2);
            };
            document.getElementById("zoomReset").onclick = () => {
                zoom = 1;
                panX = 0;
                panY = 0;
                applyTransform();
            };
            function zoomBy(factor) {
                const rect = viewportEl.getBoundingClientRect();
                const cx = rect.width / 2,
                    cy = rect.height / 2;
                const canvasX = (cx - panX) / zoom,
                    canvasY = (cy - panY) / zoom;
                zoom = Math.min(8, Math.max(0.4, zoom * factor));
                panX = cx - canvasX * zoom;
                panY = cy - canvasY * zoom;
                applyTransform();
            }

            /* ============================================================ SITEMAP ============================================================ */
            function newCanvas() {
                if (
                    !window.confirm(
                        "Start a new blank board? This clears the current canvas (you can still Undo afterward).",
                    )
                )
                    return;
                pushUndo();
                tree = {
                    id: "root",
                    title: "Untitled board",
                    parent: null,
                    nodes: [],
                    assets: [],
                    pins: [],
                    drawings: [],
                    frames: [],
                    children: {},
                };
                path = ["root"];
                multiSelected.clear();
                selectedEl = null;
                selectedDrawing = null;
                selectedDrawingCv = null;
                render();
            }
            function setLegendOpen(open) {
                document.body.classList.toggle("legend-hidden", !open);
                const btn = document.getElementById("legendBtn");
                btn.classList.toggle("active", open);
                btn.title = open ? "Hide pin legend" : "Show pin legend";
                try {
                    localStorage.setItem("envision-legend-open", open ? "1" : "0");
                } catch (e) {}
            }
            document.getElementById("legendBtn").onclick = () =>
                setLegendOpen(document.body.classList.contains("legend-hidden"));
            try {
                if (localStorage.getItem("envision-legend-open") === "0")
                    setLegendOpen(false);
            } catch (e) {}
            try {
                if (localStorage.getItem("envision-pin-labels") === "0")
                    document.body.classList.add("hide-pin-labels");
            } catch (e) {}
            function setMapOpen(open) {
                document.body.classList.toggle("map-open", open);
                const btn = document.getElementById("mapBtn");
                btn.classList.toggle("active", open);
                btn.title = open ? "Hide sitemap" : "Show sitemap";
                if (open) buildSitemap();
                try {
                    localStorage.setItem("envision-map-open", open ? "1" : "0");
                } catch (e) {}
            }
            document.getElementById("mapBtn").onclick = () =>
                setMapOpen(!document.body.classList.contains("map-open"));
            try {
                if (localStorage.getItem("envision-map-open") === "1")
                    setMapOpen(true);
            } catch (e) {}
            function buildSitemap() {
                const container = document.getElementById("smapTree");
                container.innerHTML = "";
                function walk(node, depth, parentPath, parentEl) {
                    const fullPath = [...parentPath, node.id];
                    const row = document.createElement("div");
                    row.className =
                        "smap-node" +
                        (samePath(fullPath, path) ? " active" : "");
                    const childCount = Object.keys(node.children).length,
                        pinCount = node.pins.length;
                    row.innerHTML = `<span class="smap-dot"></span><span class="smap-title">${node.title}</span><span class="smap-meta" title="${childCount ? childCount + (childCount === 1 ? " screen" : " screens") + " · " : ""}${pinCount} pin${pinCount === 1 ? "" : "s"}">${pinCount} pin${pinCount === 1 ? "" : "s"}</span>`;
                    row.onclick = () => {
                        path = fullPath;
                        render();
                    };
                    if (fullPath.length > 1) {
                        row.draggable = true;
                        row.addEventListener("dragstart", (e) => {
                            smapDragPath = fullPath;
                            e.dataTransfer.effectAllowed = "move";
                            e.dataTransfer.setData("text/plain", node.title);
                            row.classList.add("dragging");
                        });
                        row.addEventListener("dragend", () => {
                            smapDragPath = null;
                            container
                                .querySelectorAll(".dragging,.drop-target")
                                .forEach((el) =>
                                    el.classList.remove(
                                        "dragging",
                                        "drop-target",
                                    ),
                                );
                        });
                    }
                    row.addEventListener("dragover", (e) => {
                        if (!canMoveCanvas(smapDragPath, fullPath)) return;
                        e.preventDefault();
                        e.dataTransfer.dropEffect = "move";
                        row.classList.add("drop-target");
                    });
                    row.addEventListener("dragleave", () =>
                        row.classList.remove("drop-target"),
                    );
                    row.addEventListener("drop", (e) => {
                        e.preventDefault();
                        row.classList.remove("drop-target");
                        const src = smapDragPath;
                        smapDragPath = null;
                        if (canMoveCanvas(src, fullPath))
                            moveCanvas(src, fullPath);
                    });
                    const item = document.createElement("div");
                    item.className = "smap-item";
                    item.appendChild(row);
                    parentEl.appendChild(item);
                    const kids = Object.values(node.children);
                    if (kids.length) {
                        const wrap = document.createElement("div");
                        wrap.className = "smap-children";
                        item.appendChild(wrap);
                        kids.forEach((c) => walk(c, depth + 1, fullPath, wrap));
                    }
                }
                walk(tree, 0, [], container);
            }
            function samePath(a, b) {
                return a.length === b.length && a.every((v, i) => v === b[i]);
            }
            let smapDragPath = null;
            function canMoveCanvas(src, dest) {
                if (!src || src.length < 2) return false;
                if (dest.length >= src.length && samePath(dest.slice(0, src.length), src))
                    return false;
                return !samePath(dest, src.slice(0, -1));
            }
            // Re-parent a canvas: its link node moves from the old parent's
            // canvas to the new parent's, carrying all of its descendants.
            function moveCanvas(srcPath, destPath) {
                const srcId = srcPath[srcPath.length - 1];
                const oldParent = getCanvas(srcPath.slice(0, -1));
                const newParent = getCanvas(destPath);
                const moved = oldParent.children[srcId];
                if (!moved) return;
                pushUndo();
                const link = oldParent.nodes.find((n) => n.childId === srcId);
                oldParent.nodes = oldParent.nodes.filter((n) => n !== link);
                delete oldParent.children[srcId];
                let newId = srcId;
                if (newParent.children[newId])
                    newId = srcId + "-" + Date.now().toString(36);
                moved.id = newId;
                moved.parent = newParent.id;
                Object.values(moved.children).forEach((c) => (c.parent = newId));
                newParent.children[newId] = moved;
                // No jump screen on the old parent: add a blank, titled one
                // (same as a new screen) so an image can be uploaded to it.
                const node = link || {
                    kind: "static",
                    label: moved.title,
                    version: "v1",
                    w: 250,
                    h: 185,
                };
                node.id = newId;
                node.childId = newId;
                let right = 0,
                    top = 90;
                const occupied = [...newParent.nodes, ...(newParent.assets || [])];
                if (occupied.length) {
                    right = Math.max(...occupied.map((o) => o.x + (o.w || 200))) + 60;
                    top = Math.min(...occupied.map((o) => o.y));
                } else right = 80;
                node.x = right;
                node.y = top;
                newParent.nodes.push(node);
                if (path.length >= srcPath.length && samePath(path.slice(0, srcPath.length), srcPath))
                    path = [...destPath, newId, ...path.slice(srcPath.length)];
                else if (!pathValid(path)) path = ["root"];
                render();
                actionToast(
                    `Moved “${moved.title}” into “${newParent.title}”`,
                );
            }

            /* ============================================================ STATUS/SPRINT OVERLAY ============================================================ */
            const OVERLAY_PALETTE = [
                "#0A7DFF",
                "#FE7E00",
                "#12B76A",
                "#8A3FFC",
                "#FF465F",
                "#231EDC",
                "#0A8A9C",
                "#CC334F",
            ];
            const overlayColorCache = {};
            function overlayColor(key) {
                key = key || "—";
                if (!overlayColorCache[key]) {
                    let h = 0;
                    for (let i = 0; i < key.length; i++)
                        h = (h * 31 + key.charCodeAt(i)) % 997;
                    overlayColorCache[key] =
                        OVERLAY_PALETTE[h % OVERLAY_PALETTE.length];
                }
                return overlayColorCache[key];
            }
            function collectOverlayKeys(node, mode, set) {
                node.pins.forEach((p) => set.add(pinOverlayKey(p, mode)));
                Object.values(node.children).forEach((c) =>
                    collectOverlayKeys(c, mode, set),
                );
            }
            const PIN_TYPES = [
                ["bug", "Bug"],
                ["feature", "Feature"],
                ["question", "Question"],
                ["observation", "Observation"],
                ["idea", "Idea"],
                ["risk", "Risk"],
                ["done", "Done"],
            ];
            const escHtml = (v) =>
                String(v).replace(
                    /[&<>"]/g,
                    (c) =>
                        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
                );
            function renderOverlayLegend(visiblePins) {
                const legend = document.getElementById("overlayLegend");
                const counts = {};
                visiblePins.forEach((p) =>
                    ["type", "sprint", "status"].forEach((m) => {
                        const id = m + "\u0000" + pinOverlayKey(p, m);
                        counts[id] = (counts[id] || 0) + 1;
                    }),
                );
                const row = (mode, key, swatch, label) =>
                    `<div class="legend-row${overlayFocus && overlayFocus.mode === mode && overlayFocus.key === key ? " focused" : ""}" data-key="${escHtml(key)}" title="Click to focus on ${escHtml(label)} only">${swatch}${escHtml(label)}<span class="legend-count">${counts[mode + "\u0000" + key] || 0}</span></div>`;
                const rows = {
                    type: PIN_TYPES.map(([t, label]) =>
                        row(
                            "type",
                            t,
                            `<span class="pin legend-pin ${t}">${PIN_GLYPHS[t] || "✓"}</span>`,
                            label,
                        ),
                    ).join(""),
                };
                const labelsOn = !document.body.classList.contains("hide-pin-labels");
                const toggle = `<div class="legend-toggle" id="pinLabelsToggle" role="switch" aria-checked="${labelsOn}" title="Show or hide the labels next to pins"><span>Pin labels</span><span class="legend-switch"></span></div>`;
                legend.innerHTML = toggle + [
                    ["type", "By type"],
                    ["sprint", "By sprint"],
                    ["status", "By ADO status"],
                ]
                    .map(([mode, title]) => {
                        if (!rows[mode]) {
                            const keys = new Set();
                            collectOverlayKeys(tree, mode, keys);
                            rows[mode] = [...keys]
                                .map((k) =>
                                    row(
                                        mode,
                                        k,
                                        `<span class="legend-swatch" style="background:${overlayColor(k)}"></span>`,
                                        k,
                                    ),
                                )
                                .join("");
                        }
                        return (
                            `<div class="legend-section${overlayMode === mode ? " active" : ""}${overlayFocus && overlayFocus.mode === mode ? " has-focus" : ""}" data-mode="${mode}">` +
                            `<div class="legend-title" title="Colour pins ${title.toLowerCase()}">${title}</div>` +
                            rows[mode] +
                            "</div>"
                        );
                    })
                    .join("");
            }
            // Title: choose how pins are coloured. Row: focus on that group
            // (click again to clear); other pins are dimmed.
            document
                .getElementById("overlayLegend")
                .addEventListener("click", (e) => {
                    if (e.target.closest("#pinLabelsToggle")) {
                        const hide = !document.body.classList.contains("hide-pin-labels");
                        document.body.classList.toggle("hide-pin-labels", hide);
                        try {
                            localStorage.setItem("envision-pin-labels", hide ? "0" : "1");
                        } catch (err) {}
                        document
                            .getElementById("pinLabelsToggle")
                            .setAttribute("aria-checked", String(!hide));
                        return;
                    }
                    const section = e.target.closest(".legend-section");
                    if (!section) return;
                    const mode = section.dataset.mode;
                    const rowEl = e.target.closest(".legend-row");
                    if (rowEl) {
                        const key = rowEl.dataset.key;
                        const same =
                            overlayFocus &&
                            overlayFocus.mode === mode &&
                            overlayFocus.key === key;
                        overlayFocus = same ? null : { mode, key };
                        overlayMode = mode;
                    } else if (e.target.closest(".legend-title")) {
                        overlayMode = mode;
                        overlayFocus = null;
                    } else return;
                    render();
                });

            /* ============================================================ SEARCH ============================================================ */
            function searchTree(query) {
                query = query.trim().toLowerCase();
                if (!query) return [];
                const results = [];
                function walk(node, p) {
                    if (node.title.toLowerCase().includes(query))
                        results.push({
                            path: p,
                            text: node.title,
                            kind: "Canvas",
                            ref: null,
                        });
                    node.nodes.forEach((n) => {
                        if (n.label.toLowerCase().includes(query))
                            results.push({
                                path: p,
                                text: n.label,
                                kind: "Screen",
                                ref: n,
                            });
                    });
                    node.pins.forEach((pin) => {
                        const adoMatch =
                            pin.ado && pin.ado.id.toLowerCase().includes(query);
                        if (pin.note.toLowerCase().includes(query) || adoMatch)
                            results.push({
                                path: p,
                                text:
                                    pin.note +
                                    (pin.ado ? ` (${pin.ado.id})` : ""),
                                kind:
                                    pin.type[0].toUpperCase() +
                                    pin.type.slice(1),
                                ref: pin,
                            });
                    });
                    Object.entries(node.children).forEach(([id, c]) =>
                        walk(c, [...p, id]),
                    );
                }
                walk(tree, ["root"]);
                return results.slice(0, 20);
            }
            // Centre the matched item and zoom so it fills the canvas area.
            function focusSearchResult(result) {
                lastZoomTarget = null; // otherwise zoomToFit would toggle back to 100%
                if (!result.ref) {
                    fitToContent();
                    return;
                }
                const el = domByObj.get(result.ref);
                if (!el) return;
                const pinEl = el.classList.contains("pin")
                    ? el
                    : el.querySelector(".pin");
                if (!pinEl) {
                    zoomToFit(el, null);
                    return;
                }
                // Pins are tiny: centre on the marker at a comfortable zoom instead of maxing out
                const vpRect = viewportEl.getBoundingClientRect();
                const r = pinEl.getBoundingClientRect();
                const cx = (r.left + r.width / 2 - vpRect.left - panX) / zoom;
                const cy = (r.top + r.height / 2 - vpRect.top - panY) / zoom;
                setZoomAnim(true);
                zoom = 3;
                panX = vpRect.width / 2 - cx * zoom;
                panY = vpRect.height / 2 - cy * zoom;
                applyTransform();
                setTimeout(() => setZoomAnim(false), 460);
            }
            const searchInput = document.getElementById("searchInput");
            const searchResultsEl = document.getElementById("searchResults");
            searchInput.addEventListener("input", () => {
                const results = searchTree(searchInput.value);
                if (!results.length) {
                    searchResultsEl.innerHTML = searchInput.value.trim()
                        ? '<div class="sr-empty">No matches</div>'
                        : "";
                    searchResultsEl.classList.toggle(
                        "open",
                        !!searchInput.value.trim(),
                    );
                    return;
                }
                searchResultsEl.innerHTML = results
                    .map(
                        (r, i) =>
                            `<div class="sr-item" data-i="${i}"><div class="sr-path">${r.kind} · ${escHtml(r.path.slice(1).join(" / ") || "Product Overview")}</div><div class="sr-text">${escHtml(r.text)}</div></div>`,
                    )
                    .join("");
                searchResultsEl.classList.add("open");
                searchResultsEl
                    .querySelectorAll(".sr-item")
                    .forEach((it, i) => {
                        it.addEventListener("click", () => {
                            path = results[i].path;
                            render();
                            searchResultsEl.classList.remove("open");
                            searchInput.value = "";
                            focusSearchResult(results[i]);
                        });
                    });
            });
            document.addEventListener("click", (e) => {
                if (!e.target.closest("#searchWrap"))
                    searchResultsEl.classList.remove("open");
            });

            /* ============================================================ TABLE VIEW ============================================================ */
            const tableView = document.getElementById("tableView");
            const tvState = { filter: "", cat: "all", sort: "canvas", desc: false };
            const TV_COLS = [
                ["type", "Type"],
                ["name", "Name"],
                ["canvas", "Canvas"],
                ["sprint", "Sprint"],
                ["status", "Status"],
                ["details", "Details"],
            ];
            const TV_CATS = [
                ["all", "All"],
                ["canvas", "Canvases"],
                ["screen", "Screens"],
                ["pin", "Pins"],
                ["image", "Images"],
                ["note", "Notes"],
                ["link", "Links"],
                ["frame", "Frames"],
                ["drawing", "Drawings"],
            ];
            function collectTableRows() {
                const rows = [];
                const cap = (t) => t.charAt(0).toUpperCase() + t.slice(1);
                function walk(node, p) {
                    const titles = p.map((_, i) => getCanvas(p.slice(0, i + 1)).title);
                    const base = { path: p, canvas: titles.join(" / "), sprint: "", status: "", details: "" };
                    if (p.length > 1)
                        rows.push({ ...base, cat: "canvas", type: "Canvas", icon: ICONS.sitemap, name: node.title, canvas: titles.slice(0, -1).join(" / "), ref: null });
                    node.nodes.forEach((n) =>
                        rows.push({ ...base, cat: "screen", type: "Screen", icon: ICONS.screenshot, name: n.label, status: n.kind === "live" ? "Live" : "Frozen", details: n.version || "", ref: n }),
                    );
                    node.pins.forEach((pin) =>
                        rows.push({
                            ...base,
                            cat: "pin",
                            type: cap(pin.type),
                            pinType: pin.type,
                            name: pin.note,
                            sprint: pin.sprint || "",
                            status: pin.ado ? pin.ado.status || "" : "",
                            details: pin.ado ? pin.ado.id : "",
                            adoUrl: pin.ado && pin.ado.url,
                            ref: pin,
                        }),
                    );
                    (node.assets || []).forEach((a) => {
                        if (a.type === "image")
                            rows.push({ ...base, cat: "image", type: "Image", icon: ICONS.image, name: a.label || "Untitled asset", ref: a });
                        else if (a.type === "link")
                            rows.push({ ...base, cat: "link", type: "Link", icon: ICONS.link, name: a.label || a.url, details: a.url || "", linkUrl: a.url, ref: a });
                        else
                            rows.push({ ...base, cat: "note", type: "Note", icon: ICONS.text, name: a.text || "", ref: a });
                    });
                    (node.frames || []).forEach((f) =>
                        rows.push({ ...base, cat: "frame", type: "Frame", icon: ICONS.frame, name: f.label || "Frame", status: f.collapsed ? "Collapsed" : "", ref: f }),
                    );
                    (node.drawings || []).forEach((d) =>
                        rows.push({ ...base, cat: "drawing", type: cap(d.type || "drawing"), icon: ICONS[d.type] || ICONS.pen, name: "", ref: d }),
                    );
                    Object.entries(node.children || {}).forEach(([id, c]) => walk(c, [...p, id]));
                }
                walk(tree, ["root"]);
                return rows;
            }
            function renderTableView() {
                const all = collectTableRows();
                const q = tvState.filter.trim().toLowerCase();
                let rows = all.filter(
                    (r) =>
                        (tvState.cat === "all" || r.cat === tvState.cat) &&
                        (!q || [r.type, r.name, r.canvas, r.sprint, r.status, r.details].join(" ").toLowerCase().includes(q)),
                );
                const dir = tvState.desc ? -1 : 1;
                const key = tvState.sort;
                if (key !== "canvas" || tvState.desc)
                    rows = rows
                        .map((r, i) => [r, i])
                        .sort((a, b) => dir * String(a[0][key] || "").localeCompare(String(b[0][key] || ""), undefined, { numeric: true, sensitivity: "base" }) || a[1] - b[1])
                        .map((x) => x[0]);
                document.getElementById("tvCount").textContent = `${rows.length} of ${all.length} items`;
                document.getElementById("tvChips").innerHTML = TV_CATS.map(([c, label]) => {
                    const n = c === "all" ? all.length : all.filter((r) => r.cat === c).length;
                    return `<button class="tv-chip${tvState.cat === c ? " on" : ""}" data-cat="${c}">${label} ${n}</button>`;
                }).join("");
                document.getElementById("tvHead").innerHTML =
                    "<tr>" + TV_COLS.map(([k, label]) => `<th data-sort="${k}" class="${tvState.sort === k ? "sorted" + (tvState.desc ? " desc" : "") : ""}">${label}</th>`).join("") + "</tr>";
                const body = document.getElementById("tvBody");
                body.innerHTML = rows
                    .map((r, i) => {
                        const glyph = r.pinType ? `<span class="pin legend-pin ${r.pinType}">${PIN_GLYPHS[r.pinType] || "✓"}</span>` : r.icon || "";
                        let details = escHtml(r.details);
                        if (r.adoUrl) details = `<a href="${escHtml(r.adoUrl)}" target="_blank" rel="noopener">${details}</a>`;
                        else if (r.linkUrl) details = `<a href="${escHtml(r.linkUrl)}" target="_blank" rel="noopener">${details}</a>`;
                        return `<tr data-i="${i}"><td><span class="tv-type">${glyph}${escHtml(r.type)}</span></td><td class="tv-name" title="${escHtml(r.name)}">${escHtml(r.name) || '<span class="tv-dim">—</span>'}</td><td class="tv-dim">${escHtml(r.canvas)}</td><td class="tv-dim">${escHtml(r.sprint)}</td><td class="tv-dim">${escHtml(r.status)}</td><td class="tv-dim">${details}</td></tr>`;
                    })
                    .join("");
                document.getElementById("tvEmpty").hidden = rows.length > 0;
                body.querySelectorAll("tr").forEach((tr) =>
                    tr.addEventListener("click", (e) => {
                        if (e.target.closest("a")) return;
                        const r = rows[+tr.dataset.i];
                        setTableOpen(false);
                        path = r.path;
                        render();
                        if (r.cat === "canvas") fitToContent();
                        else if (r.ref && domByObj.get(r.ref)) focusSearchResult({ ref: r.ref });
                        else fitToContent();
                    }),
                );
            }
            function setTableOpen(open) {
                tableView.hidden = !open;
                document.body.classList.toggle("table-open", open);
                const btn = document.getElementById("tableBtn");
                btn.classList.toggle("active", open);
                btn.title = open ? "Hide table view" : "Show table view";
                if (open) renderTableView();
            }
            document.getElementById("tableBtn").addEventListener("click", () => setTableOpen(tableView.hidden));
            document.getElementById("tvFilter").addEventListener("input", (e) => {
                tvState.filter = e.target.value;
                renderTableView();
            });
            document.getElementById("tvChips").addEventListener("click", (e) => {
                const c = e.target.closest("[data-cat]");
                if (!c) return;
                tvState.cat = c.dataset.cat;
                renderTableView();
            });
            document.getElementById("tvHead").addEventListener("click", (e) => {
                const th = e.target.closest("[data-sort]");
                if (!th) return;
                const k = th.dataset.sort;
                tvState.desc = tvState.sort === k ? !tvState.desc : false;
                tvState.sort = k;
                renderTableView();
            });
            document.addEventListener("keydown", (e) => {
                if (e.key === "Escape" && !tableView.hidden && moreMenu.hidden) setTableOpen(false);
            });

            /* ============================================================ PRESENTATION MODE ============================================================ */
            let presentSeq = [],
                presentIdx = 0;
            function buildPresentSeq() {
                const seq = [];
                function walk(node, p) {
                    node.nodes.forEach((n) => seq.push({ path: p, node: n }));
                    Object.entries(node.children).forEach(([id, c]) =>
                        walk(c, [...p, id]),
                    );
                }
                walk(tree, ["root"]);
                return seq;
            }
            function goToPresentStep() {
                if (!presentSeq.length) return;
                const step = presentSeq[presentIdx];
                path = step.path;
                render();
                document.getElementById("presLabel").textContent =
                    `${presentIdx + 1} / ${presentSeq.length} — ${step.node.label}`;
                setTimeout(() => {
                    const els = [...nodesLayer.querySelectorAll(".node")];
                    const idx = getCanvas(path).nodes.indexOf(step.node);
                    if (els[idx]) zoomToFit(els[idx], null);
                }, 30);
            }
            document
                .getElementById("presentBtn")
                .addEventListener("click", () => {
                    presentSeq = buildPresentSeq();
                    if (!presentSeq.length) return;
                    presentIdx = 0;
                    document.getElementById("presentBar").classList.add("open");
                    goToPresentStep();
                });
            document
                .getElementById("presNext")
                .addEventListener("click", () => {
                    presentIdx = (presentIdx + 1) % presentSeq.length;
                    goToPresentStep();
                });
            document
                .getElementById("presPrev")
                .addEventListener("click", () => {
                    presentIdx =
                        (presentIdx - 1 + presentSeq.length) %
                        presentSeq.length;
                    goToPresentStep();
                });
            document
                .getElementById("presExit")
                .addEventListener("click", () => {
                    document
                        .getElementById("presentBar")
                        .classList.remove("open");
                    zoom = 1;
                    panX = 0;
                    panY = 0;
                    applyTransform();
                });

            /* ============================================================ EXPORT SNAPSHOT (Markdown) ============================================================ */
            function buildExportMarkdown() {
                let md = `# Envision — Sitemap export\n\n`;
                function walk(node, depth) {
                    md += `${"  ".repeat(depth)}- **${node.title}**`;
                    if (node.nodes.length)
                        md += ` _(${node.nodes.length} screen${node.nodes.length === 1 ? "" : "s"})_`;
                    md += `\n`;
                    node.nodes.forEach(
                        (n) =>
                            (md += `${"  ".repeat(depth + 1)}- Screen: ${n.label} (${n.kind === "live" ? "Live · " + n.version : "Frozen · " + n.version})\n`),
                    );
                    node.pins.forEach(
                        (p) =>
                            (md += `${"  ".repeat(depth + 1)}- ${p.type[0].toUpperCase() + p.type.slice(1)} [${p.sprint}]${p.ado ? ` (${p.ado.id} · ${p.ado.status})` : ""}: ${p.note}\n`),
                    );
                    Object.values(node.children).forEach((c) =>
                        walk(c, depth + 1),
                    );
                }
                walk(tree, 0);
                return md;
            }
            function downloadBlob(content, type, name) {
                const url = URL.createObjectURL(new Blob([content], { type }));
                const a = document.createElement("a");
                a.href = url;
                a.download = name;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }
            let actionToastTimer = 0;
            function actionToast(msg) {
                const t = document.getElementById("actionToast");
                t.textContent = msg;
                t.classList.add("show");
                clearTimeout(actionToastTimer);
                actionToastTimer = setTimeout(
                    () => t.classList.remove("show"),
                    2200,
                );
            }
            function importCanvasFile(file) {
                const reader = new FileReader();
                reader.onload = () => {
                    let data;
                    try {
                        data = JSON.parse(reader.result);
                    } catch (e) {
                        actionToast("Import failed: not valid JSON");
                        return;
                    }
                    if (!data || typeof data !== "object" || !Array.isArray(data.nodes)) {
                        actionToast("Import failed: not an Envision export");
                        return;
                    }
                    if (
                        !window.confirm(
                            "Replace the current canvas with this file? You can still Undo afterward.",
                        )
                    )
                        return;
                    pushUndo();
                    tree = data;
                    path = ["root"];
                    multiSelected.clear();
                    selectedEl = null;
                    selectedDrawing = null;
                    selectedDrawingCv = null;
                    render();
                    fitToContent();
                    actionToast("Canvas imported");
                };
                reader.readAsText(file);
            }
            async function copyCanvasLink() {
                const url = location.href.split("#")[0];
                try {
                    await navigator.clipboard.writeText(url);
                } catch (e) {
                    const ta = document.createElement("textarea");
                    ta.value = url;
                    document.body.appendChild(ta);
                    ta.select();
                    try {
                        document.execCommand("copy");
                    } catch (e2) {}
                    document.body.removeChild(ta);
                }
                actionToast("Canvas link copied");
            }
            const moreBtn = document.getElementById("moreBtn");
            const moreMenu = document.getElementById("moreMenu");
            moreMenu.querySelectorAll("[data-mi]").forEach((el) => {
                el.innerHTML = ACTION_ICONS[el.dataset.mi] || "";
            });
            function setMoreMenu(open) {
                moreMenu.hidden = !open;
                moreBtn.classList.toggle("active", open);
                moreBtn.setAttribute("aria-expanded", String(open));
                if (open) {
                    const r = moreBtn.getBoundingClientRect();
                    moreMenu.style.top = r.bottom + 6 + "px";
                    moreMenu.style.right =
                        Math.max(8, window.innerWidth - r.right) + "px";
                }
            }
            moreBtn.addEventListener("click", (e) => {
                e.stopPropagation();
                setMoreMenu(moreMenu.hidden);
            });
            document.addEventListener("pointerdown", (e) => {
                if (!moreMenu.hidden && !e.target.closest("#moreMenu, #moreBtn"))
                    setMoreMenu(false);
            });
            document.addEventListener("keydown", (e) => {
                if (e.key === "Escape" && !moreMenu.hidden) setMoreMenu(false);
            });
            moreMenu.addEventListener("click", (e) => {
                const item = e.target.closest("[data-action]");
                if (!item) return;
                setMoreMenu(false);
                switch (item.dataset.action) {
                    case "export-md":
                        downloadBlob(
                            buildExportMarkdown(),
                            "text/markdown",
                            "sitemap-export.md",
                        );
                        break;
                    case "export-json":
                        downloadBlob(
                            JSON.stringify(tree, null, 2),
                            "application/json",
                            "envision-canvas.json",
                        );
                        break;
                    case "import":
                        document.getElementById("importFile").click();
                        break;
                    case "share":
                        copyCanvasLink();
                        break;
                }
            });
            document.getElementById("importFile").addEventListener("change", (e) => {
                const f = e.target.files[0];
                e.target.value = "";
                if (f) importCanvasFile(f);
            });

            /* ============================================================ SIMULATED PRESENCE (illustrative only — not real multiplayer) ============================================================ */
            (function () {
                const people = [
                    { n: "RD", c: "#3D6FA8" },
                    { n: "JK", c: "#B5822E" },
                ];
                const presence = document.getElementById("presence");
                people.forEach((p) => {
                    const av = document.createElement("div");
                    av.className = "avatar";
                    av.style.background = p.c;
                    av.textContent = p.n;
                    av.title = p.n + " (simulated)";
                    av.innerHTML += '<span class="dot"></span>';
                    presence.appendChild(av);
                });
            })();

            initCloudSync();
        </script>
    </body>
</html>
