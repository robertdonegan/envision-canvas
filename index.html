            /* ---- screenshot upload ---- */
            const imgFileInput = document.getElementById("imgFileInput");
            let imageUploadTarget = null;
            function openImagePicker(node) {
                imageUploadTarget = node;
                imgFileInput.value = "";
                imgFileInput.click();
            }
            imgFileInput.addEventListener("change", (e) => {
                const file = e.target.files[0];
                if (!file || !imageUploadTarget) return;
                const reader = new FileReader();
                reader.onload = () => {
                    const dataUrl = reader.result;
                    const img = new Image();
                    img.onload = () => {
                        pushUndo();
                        const target = imageUploadTarget;
                        const isScreen = "childId" in target;
                        target.thumb = dataUrl;
                        if (isScreen) {
                            const w = target.w || 220;
                            const ratio = img.naturalHeight / img.naturalWidth;
                            target.w = w;
                            target.h = Math.max(
                                70,
                                Math.min(560, Math.round(w * ratio) + 26),
                            );
                            target.versions = target.versions || [];
                            target.versions.push({
                                label: target.version || "v1",
                                thumb: dataUrl,
                            });
                        } else {
                            const ratio = img.naturalHeight / img.naturalWidth;
                            const longSide = 220,
                                pad = 0.86;
                            let dispW, dispH;
                            if (ratio <= 1) {
                                dispW = longSide;
                                dispH = longSide * ratio;
                            } else {
                                dispH = longSide;
                                dispW = longSide / ratio;
                            }
                            target.w = Math.max(
                                120,
                                Math.min(420, Math.round(dispW / pad)),
                            );
                            target.h =
                                Math.max(
                                    110,
                                    Math.min(420, Math.round(dispH / pad)),
                                ) + 20;
                        }
                        render();
                    };
                    img.src = dataUrl;
                };
                reader.readAsDataURL(file);
            });

            /* ============================================================ SELECT + DRAG ============================================================ */
            function attachDragSelect(el, dataObj) {
                el.addEventListener("click", (e) => {
                    if (e.metaKey || e.ctrlKey) {
                        e.stopPropagation();
                        zoomToFit(el, dataObj);
                    }
                });
                el.addEventListener("pointerdown", (e) => {
                    if (e.metaKey || e.ctrlKey) return; // handled by the click listener above
                    if (["pen", "highlight", "arrow"].includes(currentTool))
                        return; // those tools draw on top instead
                    e.stopPropagation();
                    el.setPointerCapture && el.setPointerCapture(e.pointerId);
                    const startClientX = e.clientX,
                        startClientY = e.clientY,
                        origX = dataObj.x,
                        origY = dataObj.y;
                    const preSnap = JSON.stringify(tree);
                    const isGroupDrag =
                        multiSelected.has(dataObj) && multiSelected.size > 1;
                    const groupOrigins = isGroupDrag
                        ? [...multiSelected].map((o) => ({
                              obj: o,
                              x: o.x,
                              y: o.y,
                          }))
                        : null;
                    let moved = false;
                    const onMove = (ev) => {
                        const dx = (ev.clientX - startClientX) / zoom,
                            dy = (ev.clientY - startClientY) / zoom;
                        if (Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
                        if (moved) {
                            if (groupOrigins) {
                                groupOrigins.forEach((go) => {
                                    go.obj.x = snapVal(go.x + dx);
                                    go.obj.y = snapVal(go.y + dy);
                                    const memberEl = domByObj.get(go.obj);
                                    if (memberEl) {
                                        memberEl.style.left = go.obj.x + "px";
                                        memberEl.style.top = go.obj.y + "px";
                                        if (
                                            memberEl.classList.contains(
                                                "pin",
                                            ) &&
                                            memberEl.nextElementSibling &&
                                            memberEl.nextElementSibling.classList.contains(
                                                "sprintchip",
                                            )
                                        ) {
                                            memberEl.nextElementSibling.style.left =
                                                go.obj.x + 30 + "px";
                                            memberEl.nextElementSibling.style.top =
                                                go.obj.y + 4 + "px";
                                        }
                                    }
                                });
                            } else {
                                dataObj.x = snapVal(origX + dx);
                                dataObj.y = snapVal(origY + dy);
                                el.style.left = dataObj.x + "px";
                                el.style.top = dataObj.y + "px";
                            }
                        }
                    };
                    const onUp = (ev) => {
                        el.removeEventListener("pointermove", onMove);
                        el.removeEventListener("pointerup", onUp);
                        el.removeEventListener("pointercancel", onUp);
                        if (!moved) {
                            if (!isGroupDrag) selectNode(el);
                        } else {
                            commitUndo(preSnap);
                            render();
                        }
                    };
                    el.addEventListener("pointermove", onMove);
                    el.addEventListener("pointerup", onUp);
                    el.addEventListener("pointercancel", onUp);
                });
            }
            function selectNode(el) {
                if (selectedEl) selectedEl.classList.remove("selected");
                selectedEl = el;
                el.classList.add("selected");
            }
            function attachArrowHandleDrag(h, dr, which) {
                h.addEventListener("pointerdown", (e) => {
                    e.stopPropagation();
                    h.setPointerCapture && h.setPointerCapture(e.pointerId);
                    const preSnap = JSON.stringify(tree);
                    const related = drawlayer.querySelectorAll(
                        `[data-drid="${dr.id}"]`,
                    );
                    const onMove = (ev) => {
                        const pt = screenToCanvas(ev.clientX, ev.clientY);
                        h.style.left = pt.x - 7 + "px";
                        h.style.top = pt.y - 7 + "px";
                        related.forEach((el) => {
                            if (which === "start") {
                                el.setAttribute("x1", dm(pt.x));
                                el.setAttribute("y1", dm(pt.y));
                            } else {
                                el.setAttribute("x2", dm(pt.x));
                                el.setAttribute("y2", dm(pt.y));
                            }
                        });
                    };
                    const onUp = (ev) => {
                        h.removeEventListener("pointermove", onMove);
                        h.removeEventListener("pointerup", onUp);
                        h.removeEventListener("pointercancel", onUp);
                        const pt = screenToCanvas(ev.clientX, ev.clientY);
                        const snap = findSnapTarget(selectedDrawingCv, pt);
                        if (which === "start") {
                            dr.x1 = pt.x;
                            dr.y1 = pt.y;
                            dr.startRef = snap;
                        } else {
                            dr.x2 = pt.x;
                            dr.y2 = pt.y;
                            dr.endRef = snap;
                        }
                        commitUndo(preSnap);
                        render();
                    };
                    h.addEventListener("pointermove", onMove);
                    h.addEventListener("pointerup", onUp);
                    h.addEventListener("pointercancel", onUp);
                });
            }

            function attachPinDrag(el, p) {
                el.addEventListener("click", (e) => {
                    if (e.metaKey || e.ctrlKey) {
                        e.stopPropagation();
                        zoomToFit(el, p);
                    }
                });
                el.addEventListener("pointerdown", (e) => {
                    if (e.metaKey || e.ctrlKey) return; // handled by the click listener above
                    if (["pen", "highlight", "arrow"].includes(currentTool))
                        return; // those tools draw on top instead
                    e.stopPropagation();
                    el.setPointerCapture && el.setPointerCapture(e.pointerId);
                    const startClientX = e.clientX,
                        startClientY = e.clientY,
                        origX = p.x,
                        origY = p.y;
                    const preSnap = JSON.stringify(tree);
                    const isGroupDrag =
                        multiSelected.has(p) && multiSelected.size > 1;
                    const groupOrigins = isGroupDrag
                        ? [...multiSelected].map((o) => ({
                              obj: o,
                              x: o.x,
                              y: o.y,
                          }))
                        : null;
                    let moved = false;
                    const chip = el.nextElementSibling; // sprint chip rendered immediately after the pin
                    const onMove = (ev) => {
                        const dx = (ev.clientX - startClientX) / zoom,
                            dy = (ev.clientY - startClientY) / zoom;
                        if (Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
                        if (moved) {
                            if (groupOrigins) {
                                groupOrigins.forEach((go) => {
                                    go.obj.x = snapVal(go.x + dx);
                                    go.obj.y = snapVal(go.y + dy);
                                    const memberEl = domByObj.get(go.obj);
                                    if (memberEl) {
                                        memberEl.style.left = go.obj.x + "px";
                                        memberEl.style.top = go.obj.y + "px";
                                        if (
                                            memberEl.classList.contains(
                                                "pin",
                                            ) &&
                                            memberEl.nextElementSibling &&
                                            memberEl.nextElementSibling.classList.contains(
                                                "sprintchip",
                                            )
                                        ) {
                                            memberEl.nextElementSibling.style.left =
                                                go.obj.x + 30 + "px";
                                            memberEl.nextElementSibling.style.top =
                                                go.obj.y + 4 + "px";
                                        }
                                    }
                                });
                            } else {
                                p.x = snapVal(origX + dx);
                                p.y = snapVal(origY + dy);
                                el.style.left = p.x + "px";
                                el.style.top = p.y + "px";
                                if (
                                    chip &&
                                    chip.classList.contains("sprintchip")
                                ) {
                                    chip.style.left = p.x + 30 + "px";
                                    chip.style.top = p.y + 4 + "px";
                                }
                            }
                        }
                    };
                    const onUp = (ev) => {
                        el.removeEventListener("pointermove", onMove);
                        el.removeEventListener("pointerup", onUp);
                        el.removeEventListener("pointercancel", onUp);
                        if (!moved) {
                            if (!isGroupDrag)
                                openPinCard(ev.clientX, ev.clientY, p);
                        } else {
                            commitUndo(preSnap);
                            render();
                        }
                    };
                    el.addEventListener("pointermove", onMove);
                    el.addEventListener("pointerup", onUp);
                    el.addEventListener("pointercancel", onUp);
                });
            }

            /* ============================================================ DIVE TRANSITION ============================================================ */
            function diveInto(nodeEl, n) {
                const cv = getCanvas(path);
                const child = cv.children[n.childId];
                if (!child) return;
                const rect = nodeEl.getBoundingClientRect();
                const clone = document.getElementById("diveClone");
                const flash = document.getElementById("diveFlash");
                clone.innerHTML = nodeEl.innerHTML;
                clone.style.transition = "none";
                clone.style.left = rect.left + "px";
                clone.style.top = rect.top + "px";
                clone.style.width = rect.width + "px";
                clone.style.height = rect.height + "px";
                clone.style.opacity = "1";
                clone.style.boxShadow = "0 0 0 0 rgba(24,23,18,0)";
                requestAnimationFrame(() => {

                            window.innerHeight / rect.height,

                    const cx = rect.left + rect.width / 2,
                        cy = rect.top + rect.height / 2;
                    const tx = window.innerWidth / 2 - cx,
                        ty = window.innerHeight / 2 - cy;
                    clone.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;

            function setActiveTool(name) {

            /* ---- unified pointer system: drawing, touch-pan, pinch-zoom ---- */
            const pointers = new Map();
            let mode = null; // 'draw' | 'pan' | 'pinch'
            let drawTempEl = null,
                drawPoints = [];
            let panStart = null,
                pinchStart = null;

            function ptDist(a, b) {
                return Math.hypot(a.x - b.x, a.y - b.y);
            }
            function ptMid(a, b) {
                return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
            }

            viewportEl.addEventListener("pointerdown", (e) => {
                const onInteractive = e.target.closest(
                    ".node, .asset-card, .pin",
                );
                if (onInteractive && currentTool === "select") return; // select tool: let the item handle its own drag
                pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
                try {
                    viewportEl.setPointerCapture(e.pointerId);
                } catch (err) {}

                if (pointers.size === 2) {
                    if (drawTempEl) {
                        drawTempEl.remove();
                        drawTempEl = null;
                        drawPoints = [];
                    }
                    mode = "pinch";
                    const pts = [...pointers.values()];
                    pinchStart = {
                        d: ptDist(pts[0], pts[1]),
                        zoom0: zoom,
                        mid: ptMid(pts[0], pts[1]),
                        panX0: panX,
                        panY0: panY,
                    };
                    return;
                }
                if (pointers.size > 2) return;

                if (["pen", "highlight", "arrow"].includes(currentTool)) {
                    mode = "draw";
                    const pt = screenToCanvas(e.clientX, e.clientY);
                    if (currentTool === "arrow") {
                        drawTempEl = document.createElementNS(
                            "http://www.w3.org/2000/svg",
                            "line",
                        );
                        drawTempEl.setAttribute("class", "arrow-line");
                        if (currentArrowHead === "end")
                            drawTempEl.setAttribute(
                                "marker-end",
                                "url(#arrowhead-end)",
                            );
                        if (currentArrowHead === "both") {
                            drawTempEl.setAttribute(
                                "marker-end",
                                "url(#arrowhead-end)",
                            );
                            drawTempEl.setAttribute(
                                "marker-start",
                                "url(#arrowhead-start)",
                            );
                        }
                        if (currentArrowDash)
                            drawTempEl.setAttribute("stroke-dasharray", "7 6");
                        drawTempEl.setAttribute("x1", dm(pt.x));
                        drawTempEl.setAttribute("y1", dm(pt.y));
                        drawTempEl.setAttribute("x2", dm(pt.x));
                        drawTempEl.setAttribute("y2", dm(pt.y));
                        drawlayer.appendChild(drawTempEl);
                        drawPoints = [pt, pt];
                    } else {
                        drawPoints = [pt];
                        drawTempEl = document.createElementNS(
                            "http://www.w3.org/2000/svg",
                            "path",
                        );
                        drawTempEl.setAttribute(
                            "class",
                            currentTool === "pen" ? "pen-stroke" : "hl-stroke",
                        );
                        if (currentTool === "highlight")
                            drawTempEl.style.stroke = currentHighlightColor;
                        if (currentTool === "pen")
                            drawTempEl.style.stroke = currentPenColor;
                        drawTempEl.setAttribute(
                            "d",
                            `M${dm(pt.x)},${dm(pt.y)}`,
                        );
                        drawlayer.appendChild(drawTempEl);
                    }
                } else if (currentTool === "frame") {
                    mode = "frame";
                    const ptRaw = screenToCanvas(e.clientX, e.clientY);
                    const pt = { x: snapVal(ptRaw.x), y: snapVal(ptRaw.y) };
                    drawPoints = [pt, pt];
                    drawTempEl = document.createElement("div");
                    drawTempEl.className = "frame-box";
                    drawTempEl.style.left = pt.x + "px";
                    drawTempEl.style.top = pt.y + "px";
                    drawTempEl.style.width = "0px";
                    drawTempEl.style.height = "0px";
                    nodesLayer.appendChild(drawTempEl);
                } else if (currentTool === "lasso") {
                    mode = "lasso";
                    const pt = screenToCanvas(e.clientX, e.clientY);
                    drawPoints = [pt, pt];
                    drawTempEl = document.createElement("div");
                    drawTempEl.className = "lasso-box";
                    drawTempEl.style.left = pt.x + "px";
                    drawTempEl.style.top = pt.y + "px";
                    drawTempEl.style.width = "0px";
                    drawTempEl.style.height = "0px";
                    nodesLayer.appendChild(drawTempEl);
                } else if (currentTool === "select" && !onInteractive) {
                    mode = "pan";
                    panStart = {
                        x: e.clientX,
                        y: e.clientY,
                        panX0: panX,
                        panY0: panY,
                    };
                }
            });

            viewportEl.addEventListener("pointermove", (e) => {
                if (!pointers.has(e.pointerId)) return;
                pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

                if (mode === "pinch" && pointers.size >= 2 && pinchStart) {
                    const pts = [...pointers.values()];
                    const d = ptDist(pts[0], pts[1]);
                    const newZoom = Math.min(
                        8,
                        Math.max(0.4, pinchStart.zoom0 * (d / pinchStart.d)),
                    );
                    const rect = viewportEl.getBoundingClientRect();
                    const midCanvasX =
                        (pinchStart.mid.x - rect.left - pinchStart.panX0) /
                        pinchStart.zoom0;
                    const midCanvasY =
                        (pinchStart.mid.y - rect.top - pinchStart.panY0) /
                        pinchStart.zoom0;
                    zoom = newZoom;
                    panX = pinchStart.mid.x - rect.left - midCanvasX * zoom;
                    panY = pinchStart.mid.y - rect.top - midCanvasY * zoom;
                    applyTransform();
                } else if (mode === "pan" && panStart) {
                    panX = panStart.panX0 + (e.clientX - panStart.x);
                    panY = panStart.panY0 + (e.clientY - panStart.y);
                    applyTransform();
                } else if (mode === "draw" && drawTempEl) {
                    const pt = screenToCanvas(e.clientX, e.clientY);
                    if (currentTool === "arrow") {
                        drawTempEl.setAttribute("x2", dm(pt.x));
                        drawTempEl.setAttribute("y2", dm(pt.y));
                        drawPoints[1] = pt;
                    } else {
                        drawPoints.push(pt);
                        const d =
                            `M${dm(drawPoints[0].x)},${dm(drawPoints[0].y)} ` +
                            drawPoints
                                .slice(1)
                                .map((p) => `L${dm(p.x)},${dm(p.y)}`)
                                .join(" ");
                        drawTempEl.setAttribute("d", d);
                    }
                } else if (mode === "frame" && drawTempEl) {
                    const pt = screenToCanvas(e.clientX, e.clientY);
                    drawPoints[1] = { x: snapVal(pt.x), y: snapVal(pt.y) };
                    const x = Math.min(drawPoints[0].x, drawPoints[1].x),
                        y = Math.min(drawPoints[0].y, drawPoints[1].y);
                    const w = Math.abs(drawPoints[1].x - drawPoints[0].x),
                        h = Math.abs(drawPoints[1].y - drawPoints[0].y);
                    drawTempEl.style.left = x + "px";
                    drawTempEl.style.top = y + "px";
                    drawTempEl.style.width = w + "px";
                    drawTempEl.style.height = h + "px";
                } else if (mode === "lasso" && drawTempEl) {
                    const pt = screenToCanvas(e.clientX, e.clientY);
                    drawPoints[1] = pt;
                    const x = Math.min(drawPoints[0].x, pt.x),
                        y = Math.min(drawPoints[0].y, pt.y);
                    const w = Math.abs(pt.x - drawPoints[0].x),
                        h = Math.abs(pt.y - drawPoints[0].y);
                    drawTempEl.style.left = x + "px";
                    drawTempEl.style.top = y + "px";
                    drawTempEl.style.width = w + "px";
                    drawTempEl.style.height = h + "px";
                }
            });

            function endPointer(e) {
                pointers.delete(e.pointerId);
                try {
                    viewportEl.releasePointerCapture(e.pointerId);
                } catch (err) {}

                if (mode === "draw" && pointers.size === 0) {
                    const cv = getCanvas(path);
                    if (currentTool === "arrow" && drawPoints[1]) {
                        pushUndo();
                        const startRef = findSnapTarget(cv, drawPoints[0]);
                        const endRef = findSnapTarget(cv, drawPoints[1]);
                        cv.drawings.push({
                            id: "dr" + Date.now(),
                            type: "arrow",
                            x1: drawPoints[0].x,
                            y1: drawPoints[0].y,
                            x2: drawPoints[1].x,
                            y2: drawPoints[1].y,
                            head: currentArrowHead,
                            dashed: currentArrowDash,
                            startRef,
                            endRef,
                        });
                    } else if (
                        currentTool !== "arrow" &&
                        drawPoints.length > 1
                    ) {
                        pushUndo();
                        const dr = {
                            id: "dr" + Date.now(),
                            type: currentTool === "pen" ? "pen" : "highlight",
                            points: drawPoints.slice(),
                        };
                        if (currentTool === "highlight")
                            dr.color = currentHighlightColor;
                        if (currentTool === "pen") dr.color = currentPenColor;
                        cv.drawings.push(dr);
                    }
                    drawTempEl = null;
                    drawPoints = [];
                    render();
                }

                if (mode === "frame" && pointers.size === 0) {
                    const cv = getCanvas(path);
                    const x = Math.min(drawPoints[0].x, drawPoints[1].x),
                        y = Math.min(drawPoints[0].y, drawPoints[1].y);
                    const w = Math.abs(drawPoints[1].x - drawPoints[0].x),
                        h = Math.abs(drawPoints[1].y - drawPoints[0].y);
                    if (drawTempEl) drawTempEl.remove();
                    drawTempEl = null;
                    drawPoints = [];
                    if (w > 20 && h > 20) {
                        pushUndo();
                        cv.frames.push({
                            x,
                            y,
                            w,
                            h,
                            label: "New Frame",
                            collapsed: false,
                        });
                        setActiveTool("select");
                    }
                    render();
                }

                if (mode === "lasso" && pointers.size === 0) {
                    const cv = getCanvas(path);
                    const lx = Math.min(drawPoints[0].x, drawPoints[1].x),
                        ly = Math.min(drawPoints[0].y, drawPoints[1].y);
                    const lw = Math.abs(drawPoints[1].x - drawPoints[0].x),
                        lh = Math.abs(drawPoints[1].y - drawPoints[0].y);
                    if (drawTempEl) drawTempEl.remove();
                    drawTempEl = null;
                    drawPoints = [];
                    multiSelected.clear();
                    if (lw > 8 && lh > 8) {
                        const lassoRect = { x: lx, y: ly, w: lw, h: lh };
                        const intersects = (r) =>
                            r &&
                            lassoRect.x < r.x + r.w &&
                            lassoRect.x + lassoRect.w > r.x &&
                            lassoRect.y < r.y + r.h &&
                            lassoRect.y + lassoRect.h > r.y;
                        cv.nodes.forEach((n) => {
                            if (intersects(getObjectRect(n, cv)))
                                multiSelected.add(n);
                        });
                        (cv.assets || []).forEach((a) => {
                            if (intersects(getObjectRect(a, cv)))
                                multiSelected.add(a);
                        });
                        (cv.pins || []).forEach((p) => {
                            if (intersects(getObjectRect(p, cv)))
                                multiSelected.add(p);
                        });
                    }
                    setActiveTool("select");
                    render();
                }

                if (pointers.size < 2) pinchStart = null;
                if (pointers.size === 1 && mode === "pinch") {
                    mode = "pan";
                    const remaining = [...pointers.values()][0];
                    panStart = {
                        x: remaining.x,
                        y: remaining.y,
                        panX0: panX,
                        panY0: panY,
                    };
                } else if (pointers.size === 0) {
                    mode = null;
                    panStart = null;
                }
            }
            viewportEl.addEventListener("pointerup", endPointer);
            viewportEl.addEventListener("pointercancel", endPointer);

            /* ============================================================ ZOOM / PAN ============================================================ */
            viewportEl.addEventListener(
                "wheel",
                (e) => {
                    e.preventDefault();
                    if (e.ctrlKey || e.metaKey) {
                        const delta = -e.deltaY * 0.0015;
                        const newZoom = Math.min(
                            8,
                            Math.max(0.4, zoom * (1 + delta)),
                        );
                        const rect = viewportEl.getBoundingClientRect();
                        const cx = e.clientX - rect.left,
                            cy = e.clientY - rect.top;
                        const canvasX = (cx - panX) / zoom,
                            canvasY = (cy - panY) / zoom;
                        zoom = newZoom;
                        panX = cx - canvasX * zoom;
                        panY = cy - canvasY * zoom;
                    } else {
                        panX -= e.deltaX;
                        panY -= e.deltaY;
                    }
                    applyTransform();
                },
                { passive: false },
            );

            document.getElementById("zoomIn").onclick = () => {
                zoomBy(1.2);
            };
            document.getElementById("zoomOut").onclick = () => {
                zoomBy(1 / 1.2);
            };
            document.getElementById("zoomReset").onclick = () => {
                zoom = 1;
                panX = 0;
                panY = 0;
                applyTransform();
            };
            function zoomBy(factor) {
                const rect = viewportEl.getBoundingClientRect();
                const cx = rect.width / 2,
                    cy = rect.height / 2;
                const canvasX = (cx - panX) / zoom,
                    canvasY = (cy - panY) / zoom;
                zoom = Math.min(8, Math.max(0.4, zoom * factor));
                panX = cx - canvasX * zoom;
                panY = cy - canvasY * zoom;
                applyTransform();
            }

            /* ============================================================ SITEMAP ============================================================ */
            const sitemap = document.getElementById("sitemap");
            const sitemapBackdrop = document.getElementById("sitemapBackdrop");
            document.getElementById("newBoardBtn").onclick = () => {
                if (
                    !window.confirm(
                        "Start a new blank board? This clears the current canvas (you can still Undo afterward).",
                    )
                )
                    return;
                pushUndo();
                tree = {
                    id: "root",
                    title: "Untitled board",
                    parent: null,
                    nodes: [],
                    assets: [],
                    pins: [],
                    drawings: [],
                    frames: [],
                    children: {},
                };
                path = ["root"];
                multiSelected.clear();
                selectedEl = null;
                selectedDrawing = null;
                selectedDrawingCv = null;
                render();
            };
            document.getElementById("mapBtn").onclick = () => {
                buildSitemap();
                sitemap.classList.add("open");
                sitemapBackdrop.classList.add("open");
            };
            document.getElementById("closeMap").onclick = () => {
                sitemap.classList.remove("open");
                sitemapBackdrop.classList.remove("open");
            };
            sitemapBackdrop.addEventListener("click", () => {
                sitemap.classList.remove("open");
                sitemapBackdrop.classList.remove("open");
            });
            function buildSitemap() {
                const container = document.getElementById("smapTree");
                container.innerHTML = "";
                function walk(node, depth, parentPath) {
                    const fullPath = [...parentPath, node.id];
                    const row = document.createElement("div");
                    row.className =
                        "smap-node" +
                        (samePath(fullPath, path) ? " active" : "");
                    row.style.paddingLeft = 12 + depth * 22 + "px";
                    const childCount = Object.keys(node.children).length,
                        pinCount = node.pins.length;
                    row.innerHTML = `<span class="smap-dot"></span>${node.title}<span class="smap-meta">${childCount ? childCount + " screens · " : ""}${pinCount} pin${pinCount === 1 ? "" : "s"}</span>`;
                    row.onclick = () => {
                        path = fullPath;
                        render();
                        sitemap.classList.remove("open");
                        sitemapBackdrop.classList.remove("open");
                    };
                    container.appendChild(row);
                    Object.values(node.children).forEach((c) =>
                        walk(c, depth + 1, fullPath),
                    );
                }
                walk(tree, 0, []);
            }
            function samePath(a, b) {
                return a.length === b.length && a.every((v, i) => v === b[i]);
            }

            /* ============================================================ STATUS/SPRINT OVERLAY ============================================================ */
            const OVERLAY_PALETTE = [
                "#3D6FA8",
                "#B5822E",
                "#2E7D8C",
                "#7A4FA0",
                "#C2622E",
                "#5A8F5A",
                "#B5483A",
                "#6B6BAE",
            ];
            const overlayColorCache = {};
            function overlayColor(key) {
                key = key || "—";
                if (!overlayColorCache[key]) {
                    let h = 0;
                    for (let i = 0; i < key.length; i++)
                        h = (h * 31 + key.charCodeAt(i)) % 997;
                    overlayColorCache[key] =
                        OVERLAY_PALETTE[h % OVERLAY_PALETTE.length];
                }
                return overlayColorCache[key];
            }
            function collectOverlayKeys(node, mode, set) {
                node.pins.forEach((p) =>
                    set.add(
                        mode === "sprint"
                            ? p.sprint
                            : p.ado
                              ? p.ado.status
                              : p.status === "done"
                                ? "Done"
                                : "No ADO link",
                    ),
                );
                Object.values(node.children).forEach((c) =>
                    collectOverlayKeys(c, mode, set),
                );
            }
            function renderOverlayLegend() {
                const legend = document.getElementById("overlayLegend");
                if (overlayMode === "off") {
                    legend.classList.remove("open");
                    return;
                }
                const keys = new Set();
                collectOverlayKeys(tree, overlayMode, keys);
                legend.innerHTML =
                    `<div style="margin-bottom:6px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em;">${overlayMode === "sprint" ? "By sprint" : "By ADO status"}</div>` +
                    [...keys]
                        .map(
                            (k) =>
                                `<div class="legend-row"><span class="legend-swatch" style="background:${overlayColor(k)}"></span>${k}</div>`,
                        )
                        .join("");
                legend.classList.add("open");
            }
            document
                .getElementById("overlayBtn")
                .addEventListener("click", () => {
                    overlayMode =
                        overlayMode === "off"
                            ? "sprint"
                            : overlayMode === "sprint"
                              ? "status"
                              : "off";
                    document.getElementById("overlayBtn").title =
                        "Overlay: " +
                        (overlayMode === "off"
                            ? "Off"
                            : overlayMode === "sprint"
                              ? "Sprint"
                              : "ADO Status");
                    document
                        .getElementById("overlayBtn")
                        .classList.toggle("active", overlayMode !== "off");
                    renderOverlayLegend();
                    render();
                });

            /* ============================================================ SEARCH ============================================================ */
            function searchTree(query) {
                query = query.trim().toLowerCase();
                if (!query) return [];
                const results = [];
                function walk(node, p) {
                    if (node.title.toLowerCase().includes(query))
                        results.push({
                            path: p,
                            text: node.title,
                            kind: "Canvas",
                        });
                    node.nodes.forEach((n) => {
                        if (n.label.toLowerCase().includes(query))
                            results.push({
                                path: p,
                                text: n.label,
                                kind: "Screen",
                            });
                    });
                    node.pins.forEach((pin) => {
                        const adoMatch =
                            pin.ado && pin.ado.id.toLowerCase().includes(query);
                        if (pin.note.toLowerCase().includes(query) || adoMatch)
                            results.push({
                                path: p,
                                text:
                                    pin.note +
                                    (pin.ado ? ` (${pin.ado.id})` : ""),
                                kind:
                                    pin.type[0].toUpperCase() +
                                    pin.type.slice(1),
                            });
                    });
                    Object.entries(node.children).forEach(([id, c]) =>
                        walk(c, [...p, id]),
                    );
                }
                walk(tree, ["root"]);
                return results.slice(0, 20);
            }
            const searchInput = document.getElementById("searchInput");
            const searchResultsEl = document.getElementById("searchResults");
            searchInput.addEventListener("input", () => {
                const results = searchTree(searchInput.value);
                if (!results.length) {
                    searchResultsEl.innerHTML = searchInput.value.trim()
                        ? '<div class="sr-empty">No matches</div>'
                        : "";
                    searchResultsEl.classList.toggle(
                        "open",
                        !!searchInput.value.trim(),
                    );
                    return;
                }
                searchResultsEl.innerHTML = results
                    .map(
                        (r, i) =>
                            `<div class="sr-item" data-i="${i}"><div class="sr-path">${r.kind} · ${r.path.slice(1).join(" / ") || "Product Overview"}</div><div class="sr-text">${r.text}</div></div>`,
                    )
                    .join("");
                searchResultsEl.classList.add("open");
                searchResultsEl
                    .querySelectorAll(".sr-item")
                    .forEach((it, i) => {
                        it.addEventListener("click", () => {
                            path = results[i].path;
                            render();
                            searchResultsEl.classList.remove("open");
                            searchInput.value = "";
                        });
                    });
            });
            document.addEventListener("click", (e) => {
                if (!e.target.closest("#searchWrap"))
                    searchResultsEl.classList.remove("open");
            });

            /* ============================================================ PRESENTATION MODE ============================================================ */
            let presentSeq = [],
                presentIdx = 0;
            function buildPresentSeq() {
                const seq = [];
                function walk(node, p) {
                    node.nodes.forEach((n) => seq.push({ path: p, node: n }));
                    Object.entries(node.children).forEach(([id, c]) =>
                        walk(c, [...p, id]),
                    );
                }
                walk(tree, ["root"]);
                return seq;
            }
            function goToPresentStep() {
                if (!presentSeq.length) return;
                const step = presentSeq[presentIdx];
                path = step.path;
                render();
                document.getElementById("presLabel").textContent =
                    `${presentIdx + 1} / ${presentSeq.length} — ${step.node.label}`;
                setTimeout(() => {
                    const els = [...nodesLayer.querySelectorAll(".node")];
                    const idx = getCanvas(path).nodes.indexOf(step.node);
                    if (els[idx]) zoomToFit(els[idx], null);
                }, 30);
            }
            document
                .getElementById("presentBtn")
                .addEventListener("click", () => {
                    presentSeq = buildPresentSeq();
                    if (!presentSeq.length) return;
                    presentIdx = 0;
                    document.getElementById("presentBar").classList.add("open");
                    goToPresentStep();
                });
            document
                .getElementById("presNext")
                .addEventListener("click", () => {
                    presentIdx = (presentIdx + 1) % presentSeq.length;
                    goToPresentStep();
                });
            document
                .getElementById("presPrev")
                .addEventListener("click", () => {
                    presentIdx =
                        (presentIdx - 1 + presentSeq.length) %
                        presentSeq.length;
                    goToPresentStep();
                });
            document
                .getElementById("presExit")
                .addEventListener("click", () => {
                    document
                        .getElementById("presentBar")
                        .classList.remove("open");
                    zoom = 1;
                    panX = 0;
                    panY = 0;
                    applyTransform();
                });

            /* ============================================================ EXPORT SNAPSHOT (Markdown) ============================================================ */
            function buildExportMarkdown() {
                let md = `# Envision — Sitemap export\n\n`;
                function walk(node, depth) {
                    md += `${"  ".repeat(depth)}- **${node.title}**`;
                    if (node.nodes.length)
                        md += ` _(${node.nodes.length} screen${node.nodes.length === 1 ? "" : "s"})_`;
                    md += `\n`;
                    node.nodes.forEach(
                        (n) =>
                            (md += `${"  ".repeat(depth + 1)}- Screen: ${n.label} (${n.kind === "live" ? "Live · " + n.version : "Frozen · " + n.version})\n`),
                    );
                    node.pins.forEach(
                        (p) =>
                            (md += `${"  ".repeat(depth + 1)}- ${p.type[0].toUpperCase() + p.type.slice(1)} [${p.sprint}]${p.ado ? ` (${p.ado.id} · ${p.ado.status})` : ""}: ${p.note}\n`),
                    );
                    Object.values(node.children).forEach((c) =>
                        walk(c, depth + 1),
                    );
                }
                walk(tree, 0);
                return md;
            }
            document
                .getElementById("exportBtn")
                .addEventListener("click", () => {
                    const md = buildExportMarkdown();
                    const blob = new Blob([md], { type: "text/markdown" });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url;
                    a.download = "sitemap-export.md";
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                });

            /* ============================================================ SIMULATED PRESENCE (illustrative only — not real multiplayer) ============================================================ */
            (function () {
                const people = [
                    { n: "RD", c: "#3D6FA8" },
                    { n: "JK", c: "#B5822E" },
                ];
                const presence = document.getElementById("presence");
                people.forEach((p) => {
                    const av = document.createElement("div");
                    av.className = "avatar";
                    av.style.background = p.c;
                    av.textContent = p.n;
                    av.title = p.n + " (simulated)";
                    av.innerHTML += '<span class="dot"></span>';
                    presence.appendChild(av);
                });
            })();

            initCloudSync();
        </script>
    </body>
</html>
