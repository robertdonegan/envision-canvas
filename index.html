<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no"
        />
        <title>Envision — Nested Canvas Prototype</title>
        <style>
            :root {
                --bg: #fafaf7;
                --bg-canvas: #f1efe8;
                --dot: #e2dfd3;
                --surface: #ffffff;
                --border: #e4e1d7;
                --border-strong: #d2cec0;
                --ink: #1b1a17;
                --ink-dim: #6e6b61;
                --ink-faint: #a6a296;
                --terminal: #181712;
                --green: #2f6d4f;
                --green-soft: #e7f0ea;
                --red: #b5483a;
                --red-soft: #f6e7e3;
                --amber: #b5822e;
                --amber-soft: #f4ecdc;
                --blue: #3d6fa8;
                --blue-soft: #e3ebf3;
                --purple: #7a4fa0;
                --purple-soft: #efe6f3;
                --teal: #2e7d8c;
                --teal-soft: #e2eef0;
                --risk: #c2622e;
                --risk-soft: #f5e4d9;
                --mono: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
                --sans: "Inter", -apple-system, "Segoe UI", sans-serif;
                --radius: 12px;
            }
            * {
                box-sizing: border-box;
                -webkit-font-smoothing: antialiased;
            }
            html,
            body {
                margin: 0;
                padding: 0;
                height: 100%;
                background: var(--bg);
                overflow: hidden;
                font-family: var(--sans);
                color: var(--ink);
            }
            #app {
                position: relative;
                width: 100%;
                height: 100vh;
            }

            /* ---------- TOP BAR ---------- */
            #topbar {
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                height: 56px;
                display: flex;
                align-items: center;
                gap: 16px;
                padding: 0 18px;
                z-index: 50;
                background: var(--bg);
                border-bottom: 1px solid var(--border);
            }
            #breadcrumb {
                display: flex;
                align-items: center;
                gap: 4px;
                font-family: var(--mono);
                font-size: 12.5px;
                color: var(--ink-dim);
                flex-wrap: wrap;
            }
            #logoSlot {
                width: 30px;
                height: 30px;
                border-radius: 7px;
                border: 1.5px dashed var(--border-strong);
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: var(--mono);
                font-size: 7px;
                letter-spacing: 0.04em;
                color: var(--ink-faint);
                flex-shrink: 0;
            }
            #breadcrumb .crumb {
                cursor: pointer;
                padding: 4px 9px;
                border-radius: 7px;
                color: var(--ink-dim);
                transition:
                    background 0.15s,
                    color 0.15s;
                white-space: nowrap;
            }
            #breadcrumb .crumb:hover {
                background: var(--bg-canvas);
                color: var(--ink);
            }
            #breadcrumb .crumb.current {
                color: var(--ink);
                font-weight: 600;
                cursor: text;
            }
            #breadcrumb .crumb.current[contenteditable="true"] {
                background: #fff;
                outline: 1px solid var(--terminal);
                border-radius: 6px;
            }
            #breadcrumb .crumb.current:hover {
                background: none;
            }
            #breadcrumb .sep {
                color: var(--ink-faint);
                font-size: 11px;
            }

            .topbtn {
                font-family: var(--mono);
                font-size: 11.5px;
                letter-spacing: 0.02em;
                background: var(--surface);
                border: 1px solid var(--border-strong);
                color: var(--ink);
                padding: 8px 13px;
                border-radius: 20px;
                cursor: pointer;
                display: flex;
                align-items: center;
                gap: 6px;
                transition:
                    background 0.15s,
                    border-color 0.15s;
            }
            .topbtn:hover {
                background: var(--terminal);
                color: #fff;
                border-color: var(--terminal);
            }
            .topbtn.icon-only {
                width: 36px;
                height: 36px;
                padding: 0;
                align-items: center;
                justify-content: center;
                font-size: 18px;
                line-height: 1;
                border-radius: 50%;
            }
            .topbtn.icon-only svg {
                display: block;
            }
            .topbtn.icon-only.active {
                background: var(--terminal);
                color: #fff;
                border-color: var(--terminal);
            }
            #topright {
                display: flex;
                gap: 8px;
            }

            #presence {
                display: flex;
            }
            .avatar {
                width: 26px;
                height: 26px;
                border-radius: 50%;
                border: 2px solid var(--bg);
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: var(--mono);
                font-size: 10px;
                font-weight: 700;
                color: #fff;
                margin-left: -8px;
                position: relative;
            }
            .avatar:first-child {
                margin-left: 0;
            }
            .avatar .dot {
                position: absolute;
                bottom: -1px;
                right: -1px;
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: #52d69a;
                border: 1.5px solid var(--bg);
            }

            #searchWrap {
                position: relative;
                width: 260px;
                margin-left: auto;
            }
            #searchInput {
                width: 100%;
                font-family: var(--mono);
                font-size: 11.5px;
                background: var(--bg-canvas);
                border: 1px solid var(--border-strong);
                border-radius: 20px;
                padding: 7px 13px;
                color: var(--ink);
            }
            #searchInput::placeholder {
                color: var(--ink-faint);
            }
            #searchResults {
                position: absolute;
                top: 36px;
                left: 0;
                width: 320px;
                background: var(--surface);
                border: 1px solid var(--border-strong);
                border-radius: 10px;
                box-shadow: 0 14px 30px -10px rgba(20, 18, 12, 0.25);
                display: none;
                max-height: 340px;
                overflow: auto;
                z-index: 80;
            }
            #searchResults.open {
                display: block;
            }
            .sr-item {
                padding: 9px 12px;
                cursor: pointer;
                border-bottom: 1px solid var(--border);
                font-size: 12px;
            }
            .sr-item:last-child {
                border-bottom: none;
            }
            .sr-item:hover {
                background: var(--bg-canvas);
            }
            .sr-item .sr-path {
                font-family: var(--mono);
                font-size: 9.5px;
                color: var(--ink-faint);
                margin-bottom: 2px;
            }
            .sr-item .sr-text {
                color: var(--ink);
            }
            .sr-empty {
                padding: 14px;
                font-family: var(--mono);
                font-size: 11px;
                color: var(--ink-faint);
                text-align: center;
            }

            #overlayLegend {
                position: absolute;
                top: 64px;
                right: 18px;
                z-index: 55;
                background: var(--surface);
                border: 1px solid var(--border-strong);
                border-radius: 10px;
                padding: 10px 12px;
                box-shadow: 0 10px 24px -10px rgba(20, 18, 12, 0.18);
                display: none;
                font-family: var(--mono);
                font-size: 10.5px;
            }
            #overlayLegend.open {
                display: block;
            }
            .legend-row {
                display: flex;
                align-items: center;
                gap: 7px;
                margin-top: 5px;
            }
            .legend-row:first-child {
                margin-top: 0;
            }
            .legend-swatch {
                width: 10px;
                height: 10px;
                border-radius: 50%;
                flex-shrink: 0;
            }

            /* ---------- CANVAS ---------- */
            #viewport {
                position: absolute;
                inset: 0;
                top: 56px;
                background: var(--bg-canvas);
                overflow: hidden;
                touch-action: none;
            }
            #dotgrid {
                position: absolute;
                inset: 0;
                background-image: radial-gradient(
                    var(--dot) 1.4px,
                    transparent 1.4px
                );
                background-size: 26px 26px;
                pointer-events: none;
            }
            #canvasLayer {
                position: absolute;
                inset: 0;
                transform-origin: 0 0;
            }
            #canvasLayer.zoom-anim {
                transition: transform 0.45s cubic-bezier(0.65, 0, 0.35, 1);
            }

            /* ---------- TOOLBAR ---------- */
            #toolbar {
                position: absolute;
                top: 50%;
                left: 18px;
                transform: translateY(-50%);
                z-index: 60;
                background: var(--surface);
                border: 1px solid var(--border-strong);
                border-radius: 14px;
                padding: 6px;
                display: flex;
                flex-direction: column;
                gap: 3px;
                box-shadow: 0 10px 24px -10px rgba(20, 18, 12, 0.18);
            }
            #toolOptions {
                position: absolute;
                top: 50%;
                left: 86px;
                transform: translateY(-50%);
                z-index: 60;
            }
            .opt-panel {
                display: none;
                background: var(--surface);
                border: 1px solid var(--border-strong);
                border-radius: 12px;
                padding: 12px;
                box-shadow: 0 10px 24px -10px rgba(20, 18, 12, 0.18);
                width: 172px;
            }
            .opt-panel.flush {
                width: auto;
                padding: 8px 7px;
            }
            .opt-panel.active {
                display: block;
            }
            #toolOptions label {
                font-family: var(--mono);
                font-size: 9.5px;
                color: var(--ink-faint);
                text-transform: uppercase;
                letter-spacing: 0.05em;
                display: block;
                margin: 0 0 6px;
            }
            #toolOptions label:not(:first-of-type) {
                margin-top: 12px;
            }
            .swatches {
                display: flex;
                flex-direction: column;
                gap: 7px;
            }
            .swatch {
                width: 24px;
                height: 24px;
                border-radius: 50%;
                border: 2px solid transparent;
                cursor: pointer;
                padding: 0;
            }
            .swatch.active {
                border-color: var(--terminal);
                box-shadow: 0 0 0 2px var(--bg);
            }
            .tool {
                width: 42px;
                height: 40px;
                border-radius: 9px;
                border: none;
                background: transparent;
                color: var(--ink-dim);
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                transition:
                    background 0.12s,
                    color 0.12s;
                touch-action: manipulation;
                position: relative;
            }
            .tool svg {
                width: 24px;
                height: 24px;
                display: block;
            }
            .tool[data-tool="text"] {
                font-family: var(--mono);
                font-weight: 700;
                font-size: 18px;
            }
            .tool .kbd {
                position: absolute;
                bottom: 2px;
                right: 3px;
                font-family: var(--mono);
                font-size: 8px;
                line-height: 1;
                color: var(--ink-faint);
                opacity: 0.8;
            }
            .tool.active .kbd {
                color: rgba(255, 255, 255, 0.6);
            }
            .tool:hover {
                background: var(--bg-canvas);
                color: var(--ink);
            }
            .tool.active {
                background: var(--terminal);
                color: #fff;
            }
            .tool-divider {
                height: 1px;
                background: var(--border);
                margin: 3px 4px;
            }

            /* ---------- ZOOM CONTROL ---------- */
            #zoomctl {
                position: absolute;
                bottom: 18px;
                left: 18px;
                z-index: 60;
                background: var(--surface);
                border: 1px solid var(--border-strong);
                border-radius: 20px;
                display: flex;
                align-items: center;
                gap: 2px;
                padding: 4px;
                box-shadow: 0 10px 24px -10px rgba(20, 18, 12, 0.18);
            }
            #zoomctl button {
                width: 28px;
                height: 28px;
                border-radius: 50%;
                border: none;
                background: transparent;
                color: var(--ink-dim);
                font-size: 15px;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                touch-action: manipulation;
            }
            #zoomctl button:hover {
                background: var(--bg-canvas);
                color: var(--ink);
            }
            #zoomlabel {
                font-family: var(--mono);
                font-size: 11px;
                color: var(--ink-dim);
                width: 46px;
                text-align: center;
            }
            #zoomReset {
                font-family: var(--mono);
                font-size: 10px;
                color: var(--ink-dim);
                padding: 0 10px;
                cursor: pointer;
            }
            #zoomReset:hover {
                color: var(--ink);
            }

            /* ---------- NODES ---------- */
            .node {
                position: absolute;
                background: var(--surface);
                border: none;
                border-radius: var(--radius);
                overflow: hidden;
                cursor: pointer;
                box-shadow:
                    0 0 0 1.5px rgba(27, 26, 23, 1),
                    0 0 0 4px var(--bg-canvas),
                    0 0 0 5.5px rgba(27, 26, 23, 0.5),
                    0 0 0 8px var(--bg-canvas),
                    0 0 0 9.5px rgba(27, 26, 23, 0.14),
                    0 6px 18px -8px rgba(20, 18, 12, 0.16);
                transition: box-shadow 0.15s;
                user-select: none;
                touch-action: none;
            }
            .node.selected {
                outline: 2px solid var(--terminal);
                outline-offset: 11px;
            }
            .node-head {
                height: 26px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 8px;
                background: #fbfaf7;
                border-bottom: 1px solid var(--border);
            }
            .badge-live {
                display: flex;
                align-items: center;
                gap: 5px;
                background: var(--terminal);
                color: #fff;
                font-family: var(--mono);
                font-size: 9px;
                letter-spacing: 0.03em;
                padding: 2px 7px;
                border-radius: 8px;
            }
            .badge-live .dot {
                width: 5px;
                height: 5px;
                border-radius: 50%;
                background: #52d69a;
                box-shadow: 0 0 0 0 rgba(82, 214, 154, 0.7);
                animation: pulse 1.8s infinite;
            }
            @keyframes pulse {
                0% {
                    box-shadow: 0 0 0 0 rgba(82, 214, 154, 0.55);
                }
                70% {
                    box-shadow: 0 0 0 5px rgba(82, 214, 154, 0);
                }
                100% {
                    box-shadow: 0 0 0 0 rgba(82, 214, 154, 0);
                }
            }
            .badge-static {
                font-family: var(--mono);
                font-size: 9px;
                letter-spacing: 0.03em;
                color: var(--ink-faint);
                background: var(--bg-canvas);
                padding: 2px 7px;
                border-radius: 8px;
                border: 1px solid var(--border);
            }
            .node-thumb {
                position: relative;
                width: 100%;
                height: calc(100% - 26px);
                background: #fcfcfa;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
            }
            .badge-live,
            .badge-static {
                cursor: pointer;
            }
            .node-foot {
                position: absolute;
                bottom: 0;
                left: 0;
                right: 0;
                height: 22px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 8px;
                background: rgba(255, 255, 255, 0.88);
                border-top: 1px solid var(--border);
                font-family: var(--mono);
                font-size: 9.5px;
                color: var(--ink-dim);
            }
            .node-label {
                cursor: text;
                border-radius: 3px;
                padding: 1px 3px;
                margin: -1px -3px;
            }
            .node-label[contenteditable="true"] {
                background: #fff;
                outline: 1px solid var(--terminal);
                color: var(--ink);
            }
            .dive-hint {
                opacity: 0;
                transition: opacity 0.15s;
                color: var(--green);
            }
            .node:hover .dive-hint {
                opacity: 1;
            }
            .node-upload {
                width: 18px;
                height: 18px;
                border-radius: 5px;
                border: none;
                background: var(--bg-canvas);
                color: var(--ink-faint);
                font-size: 11px;
                line-height: 1;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                flex-shrink: 0;
            }
            .node-upload:hover {
                background: var(--terminal);
                color: #fff;
            }
            .node-diff {
                width: 18px;
                height: 18px;
                border-radius: 5px;
                border: none;
                background: var(--bg-canvas);
                color: var(--ink-faint);
                font-size: 11px;
                line-height: 1;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                flex-shrink: 0;
                margin-left: 4px;
            }
            .node-diff:hover {
                background: var(--terminal);
                color: #fff;
            }

            #diffModal {
                position: fixed;
                inset: 0;
                z-index: 300;
                background: rgba(20, 18, 12, 0.55);
                display: none;
                align-items: center;
                justify-content: center;
            }
            #diffModal.open {
                display: flex;
            }
            #diffInner {
                width: min(720px, 90vw);
                background: var(--surface);
                border-radius: 14px;
                padding: 18px;
                box-shadow: 0 30px 60px -10px rgba(0, 0, 0, 0.4);
            }
            #diffStage {
                position: relative;
                width: 100%;
                aspect-ratio: 16/10;
                background: #fcfcfa;
                border: 1px solid var(--border);
                border-radius: 10px;
                overflow: hidden;
                margin-bottom: 14px;
            }
            #diffStage img {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                object-fit: contain;
            }
            #diffOld {
                opacity: 1;
            }
            #diffNew {
                opacity: 0;
            }
            #diffSlider {
                width: 100%;
            }
            .diff-labels {
                display: flex;
                justify-content: space-between;
                font-family: var(--mono);
                font-size: 10.5px;
                color: var(--ink-faint);
                margin-top: 6px;
            }
            .diff-close {
                margin-top: 14px;
                text-align: right;
            }
            .node-thumb img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }

            .thumb-ui {
                position: absolute;
                inset: 8px;
                border-radius: 4px;
                background: #fcfcfa;
                border: 1px solid var(--border);
            }
            .thumb-bar {
                height: 9px;
                background: #edeae0;
                border-radius: 2px;
                margin: 7px 7px 0;
            }
            .thumb-row {
                display: flex;
                gap: 5px;
                margin: 6px 7px 0;
            }
            .thumb-block {
                background: #f1eee4;
                border-radius: 2px;
                flex: 1;
            }
            .thumb-block.accent {
                background: var(--green-soft);
                border: 1px solid #bbd8c9;
            }

            /* generic asset card (image / link / text) */
            .asset-card {
                position: absolute;
                background: var(--surface);
                border: 1px solid var(--border-strong);
                border-radius: var(--radius);
                overflow: hidden;
                box-shadow: 0 6px 18px -8px rgba(20, 18, 12, 0.16);
                cursor: pointer;
                user-select: none;
                touch-action: none;
            }
            .asset-card.selected {
                outline: 2px solid var(--terminal);
                outline-offset: 2px;
            }
            .image-card {
                display: flex;
                flex-direction: column;
            }
            .image-card .img-body {
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                color: var(--ink-faint);
                font-family: var(--mono);
                font-size: 10px;
                background: repeating-linear-gradient(
                    45deg,
                    #f7f5ef 0 8px,
                    #fcfcfa 8px 16px
                );
                overflow: hidden;
            }
            .image-card .img-body img {
                max-width: 88%;
                max-height: 88%;
                width: auto;
                height: auto;
                object-fit: contain;
                display: block;
                border-radius: 4px;
                box-shadow: 0 2px 10px -4px rgba(20, 18, 12, 0.3);
            }
            .image-card .img-foot {
                height: 20px;
                font-family: var(--mono);
                font-size: 9px;
                color: var(--ink-faint);
                display: flex;
                align-items: center;
                padding: 0 8px;
                border-top: 1px solid var(--border);
            }
            .link-card {
                width: 200px;
                padding: 10px 12px;
            }
            .link-card .lk-row {
                display: flex;
                align-items: center;
                gap: 7px;
                font-family: var(--mono);
                font-size: 9px;
                color: var(--green);
                text-transform: uppercase;
                letter-spacing: 0.04em;
                margin-bottom: 4px;
            }
            .link-card .lk-title {
                font-size: 12.5px;
                color: var(--ink);
                font-weight: 600;
                margin-bottom: 2px;
            }
            .link-card .lk-url {
                font-size: 10.5px;
                color: var(--ink-faint);
                word-break: break-all;
                cursor: pointer;
            }
            .asset-label {
                cursor: text;
                border-radius: 3px;
                padding: 1px 3px;
                margin: -1px -3px;
            }
            .asset-label[contenteditable="true"] {
                background: #fff;
                outline: 1px solid var(--terminal);
                color: var(--ink);
            }
            .text-card {
                min-width: 90px;
                max-width: 280px;
                padding: 6px 8px;
                background: transparent;
                border: 1px dashed transparent;
                border-radius: 6px;
                font-size: 13.5px;
                line-height: 1.45;
                color: var(--ink);
            }
            .text-card:hover,
            .text-card.selected {
                border-color: var(--border-strong);
                background: rgba(255, 255, 255, 0.6);
            }
            .text-card[contenteditable="true"]:focus {
                outline: none;
                border-color: var(--terminal);
                background: #fff;
            }

            /* pins */
            .pin {
                position: absolute;
                width: 25px;
                height: 25px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: var(--mono);
                font-size: 12px;
                font-weight: 700;
                color: #fff;
                cursor: pointer;
                z-index: 5;
                box-shadow: 0 2px 6px rgba(20, 18, 12, 0.3);
                transition: transform 0.12s;
                touch-action: none;
                user-select: none;
            }
            .pin:hover {
                transform: scale(1.25);
            }
            .pin.bug {
                background: var(--red);
            }
            .pin.feature {
                background: var(--amber);
            }
            .pin.observation {
                background: var(--blue);
            }

   2. In that project: Project Settings (gear icon) → API.

      constants below.
   3. Open the SQL Editor (left sidebar) → New query → paste and run:

        create table boards (
          id text primary key,
          data jsonb,
          updated_at timestamptz default now()
        );
        alter table boards enable row level security;
        create policy "Public read"   on boards for select using (true);
        create policy "Public insert" on boards for insert with check (true);
        create policy "Public update" on boards for update using (true);
        alter publication supabase_realtime add table boards;

      The three policies are what make "anyone with the URL can
      edit" work with no login — same tradeoff as before: this
      table is wide open to anyone who has your anon key (which is
      visible in this file's source), but it's scoped to ONLY this
      one table, not your whole database. Fine for sharing with
      testers; add real auth before this goes further than that.
   4. Re-upload this file wherever you're hosting it.

   If you leave the values below empty, the app runs exactly as
   before: local-only, resets to the sample board on refresh.
   ============================================================ */

            let cloudSaveTimer = null;

            function scheduleCloudSave() {
                if (!sb) return;
                clearTimeout(cloudSaveTimer);
                cloudSaveTimer = setTimeout(async () => {
                    try {
                        await sb
                            .from("boards")
                            .upsert({
                                id: "envision-board",
                                data: tree,
                                updated_at: new Date().toISOString(),
                            });
                    } catch (e) {
                        console.warn("Cloud save failed:", e);
                    }
                }, 800);
            }

            function subscribeRealtime() {
                if (!sb) return;
                sb.channel("board-sync")
                    .on(
                        "postgres_changes",
                        {
                            event: "*",
                            schema: "public",
                            table: "boards",
                            filter: "id=eq.envision-board",
                        },
                        (payload) => {
                            const remote = payload.new && payload.new.data;
                            if (
                                remote &&
                                JSON.stringify(remote) !== JSON.stringify(tree)
                            ) {
                                tree = remote;
                                if (!pathValid(path)) path = ["root"];
                                render();
                            }
                        },
                    )
                    .subscribe();
            }

            async function initCloudSync() {
                if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
                    console.info(
                        "Cloud sync not configured — running local-only. See the CLOUD SYNC comment at the top of this file.",
                    );
                    applyIcons();
                    render();
                    return;
                }
                try {
                    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                    const { data, error } = await sb
                        .from("boards")
                        .select("data")
                        .eq("id", "envision-board")
                        .maybeSingle();
                    if (error) throw error;
                    if (data && data.data) {
                        tree = data.data;
                        if (!pathValid(path)) path = ["root"];
                    } else {
                        await sb
                            .from("boards")
                            .upsert({
                                id: "envision-board",
                                data: tree,
                                updated_at: new Date().toISOString(),
                            });
                    }
                } catch (e) {
                    console.warn(
                        "Cloud sync failed to connect, falling back to local-only:",
                        e,
                    );
                    sb = null;
                }
                applyIcons();
                render();
                subscribeRealtime();
            }

                assets: [],
                pins: [
                    {
                        x: 260,

            tree.children.dash.children.export.children = {};
            tree.children.dash.children.export.nodes[0]; // toast has no further children defined

            function ensureIds(node) {
                node.frames = node.frames || [];
                node.pins.forEach((p, i) => {
                    if (!p.id) p.id = node.id + "-pin-" + i;
                    if (!p.comments)
                        p.comments = [
                            { text: p.note, author: "You", time: "Earlier" },
                        ];
                });
                Object.values(node.children).forEach(ensureIds);
            }
            ensureIds(tree);

            let path = ["root"];
            let undoStack = [],
                redoStack = [];
            function pushUndo() {
                undoStack.push(JSON.parse(JSON.stringify(tree)));
                if (undoStack.length > 40) undoStack.shift();
                redoStack.length = 0;
            }
            function commitUndo(preSnapshotString) {
                undoStack.push(JSON.parse(preSnapshotString));
                if (undoStack.length > 40) undoStack.shift();
                redoStack.length = 0;
            }
            function pathValid(p) {
                let node = tree;
                for (let i = 1; i < p.length; i++) {
                    node = node.children[p[i]];
                    if (!node) return false;
                }
                return true;
            }
            function doUndo() {
                if (!undoStack.length) return;
                redoStack.push(JSON.parse(JSON.stringify(tree)));
                tree = undoStack.pop();
                if (!pathValid(path)) path = ["root"];
                render();
            }
            function doRedo() {
                if (!redoStack.length) return;
                undoStack.push(JSON.parse(JSON.stringify(tree)));
                tree = redoStack.pop();
                if (!pathValid(path)) path = ["root"];
                render();
            }
            let zoom = 1,
                panX = 0,
                panY = 0;
            const DRAW_MARGIN = 4000; // must match the negative left/top offset on svg.connectors/drawlayer
            function dm(v) {
                return v + DRAW_MARGIN;
            }
            let currentTool = "select";
            let overlayMode = "off"; // 'off' | 'sprint' | 'status'
            let currentHighlightColor = "#FCE181";
            let currentPenColor = "#1B1A17";
            let snapEnabled = false;
            const GRID_SIZE = 26; // matches the dot-grid spacing
            function snapVal(v) {
                return snapEnabled ? Math.round(v / GRID_SIZE) * GRID_SIZE : v;
            }
            let currentArrowHead = "end"; // 'end' | 'both' | 'none'
            let currentArrowDash = false;
            let selectedEl = null,
                selectedData = null;
            let multiSelected = new Set();
            let domByObj = new WeakMap();
            let selectedDrawing = null,
                selectedDrawingCv = null;
            function deleteSelectedDrawing() {
                if (!selectedDrawing || !selectedDrawingCv) return;
                pushUndo();
                const idx = selectedDrawingCv.drawings.indexOf(selectedDrawing);
                if (idx > -1) selectedDrawingCv.drawings.splice(idx, 1);
                selectedDrawing = null;
                selectedDrawingCv = null;
                render();
            }

            function getCanvas(p) {
                let node = tree;
                for (let i = 1; i < p.length; i++) {
                    node = node.children[p[i]];
                }
                return node;
            }
            function applyTransform() {
                document.getElementById("canvasLayer").style.transform =
                    `translate(${panX}px,${panY}px) scale(${zoom})`;
                document.getElementById("zoomlabel").textContent =
                    Math.round(zoom * 100) + "%";
            }
            function screenToCanvas(clientX, clientY) {
                const rect = document
                    .getElementById("viewport")
                    .getBoundingClientRect();
                return {
                    x: (clientX - rect.left - panX) / zoom,
                    y: (clientY - rect.top - panY) / zoom,
                };
            }

            let lastZoomTarget = null;
            function zoomToFit(el, dataObj) {
                const canvasLayerEl = document.getElementById("canvasLayer");
                if (dataObj && lastZoomTarget === dataObj) {
                    lastZoomTarget = null;
                    canvasLayerEl.classList.add("zoom-anim");
                    zoom = 1;
                    panX = 0;
                    panY = 0;
                    applyTransform();
                    setTimeout(
                        () => canvasLayerEl.classList.remove("zoom-anim"),
                        460,
                    );
                    return;
                }
                lastZoomTarget = dataObj || null;
                const vpRect = viewportEl.getBoundingClientRect();
                const elRect = el.getBoundingClientRect();
                const canvasW = elRect.width / zoom,
                    canvasH = elRect.height / zoom;
                const canvasX = (elRect.left - vpRect.left - panX) / zoom;
                const canvasY = (elRect.top - vpRect.top - panY) / zoom;
                const padX = vpRect.width * 0.1,
                    padY = vpRect.height * 0.1;
                const scaleW = (vpRect.width - padX * 2) / canvasW;
                const scaleH = (vpRect.height - padY * 2) / canvasH;
                const newZoom = Math.max(
                    0.4,
                    Math.min(8, Math.min(scaleW, scaleH)),
                );
                const centerCanvasX = canvasX + canvasW / 2,
                    centerCanvasY = canvasY + canvasH / 2;
                canvasLayerEl.classList.add("zoom-anim");
                zoom = newZoom;
                panX = vpRect.width / 2 - centerCanvasX * zoom;
                panY = vpRect.height / 2 - centerCanvasY * zoom;
                applyTransform();
                setTimeout(
                    () => canvasLayerEl.classList.remove("zoom-anim"),
                    460,
                );
            }

            /* ============================================================ RENDER ============================================================ */
            const nodesLayer = document.getElementById("nodesLayer");
            const breadcrumbEl = document.getElementById("breadcrumb");
            const drawlayer = document.getElementById("drawlayer");

            function pinColor(type, status) {
                return status === "done" ? "done" : type;
            }
            const PIN_GLYPHS = {
                bug: "!",
                feature: "+",
                observation: "○",
                idea: "✦",
                question: "?",
                risk: "▲",
            };
            function pinGlyph(p) {
                return p.status === "done" ? "✓" : PIN_GLYPHS[p.type] || "•";
            }

            function getRectForRef(cv, ref) {
                if (!ref) return null;
                if (ref.kind === "node") {
                    const n = cv.nodes.find((n) => n.id === ref.id);
                    return n ? { x: n.x, y: n.y, w: n.w, h: n.h } : null;
                }
                if (ref.kind === "asset") {
                    const a = (cv.assets || []).find((a) => a.id === ref.id);
                    if (!a) return null;
                    if (a.type === "text")
                        return {
                            x: a.x,
                            y: a.y,
                            w: a.w || 200,
                            h: a._measuredH || 30,
                        };
                    if (a.type === "image")
                        return { x: a.x, y: a.y, w: a.w || 200, h: a.h || 150 };
                    return { x: a.x, y: a.y, w: 200, h: 70 }; // link card
                }
                if (ref.kind === "pin") {
                    const p = (cv.pins || []).find((p) => p.id === ref.id);
                    return p
                        ? { x: p.x - 12.5, y: p.y - 12.5, w: 25, h: 25 }
                        : null;
                }
                return null;
            }
            function rectCenter(r) {
                return { x: r.x + r.w / 2, y: r.y + r.h / 2 };
            }
            function rectEdgePoint(r, towardX, towardY) {
                const cx = r.x + r.w / 2,
                    cy = r.y + r.h / 2,
                    dx = towardX - cx,
                    dy = towardY - cy;
                if (dx === 0 && dy === 0) return { x: cx, y: cy };
                const sx = r.w / 2 / Math.max(Math.abs(dx), 1e-6),
                    sy = r.h / 2 / Math.max(Math.abs(dy), 1e-6);
                const s = Math.min(sx, sy);
                return { x: cx + dx * s, y: cy + dy * s };
            }
            function findSnapTarget(cv, pt) {
                const pad = 16;
                for (const n of cv.nodes) {
                    if (
                        pt.x >= n.x - pad &&
                        pt.x <= n.x + n.w + pad &&
                        pt.y >= n.y - pad &&
                        pt.y <= n.y + n.h + pad
                    )
                        return { kind: "node", id: n.id };
                }
                for (const a of cv.assets || []) {
                    const r =
                        a.type === "text"
                            ? {
                                  x: a.x,
                                  y: a.y,
                                  w: a.w || 200,
                                  h: a._measuredH || 30,
                              }
                            : a.type === "image"
                              ? { x: a.x, y: a.y, w: a.w || 200, h: a.h || 150 }
                              : { x: a.x, y: a.y, w: 200, h: 70 };
                    if (
                        pt.x >= r.x - pad &&
                        pt.x <= r.x + r.w + pad &&
                        pt.y >= r.y - pad &&
                        pt.y <= r.y + r.h + pad
                    )
                        return { kind: "asset", id: a.id };
                }
                for (const p of cv.pins || []) {
                    if (
                        pt.x >= p.x - 12.5 - pad &&
                        pt.x <= p.x + 12.5 + pad &&
                        pt.y >= p.y - 12.5 - pad &&
                        pt.y <= p.y + 12.5 + pad
                    )
                        return { kind: "pin", id: p.id };
                }
                return null;
            }
            function resolveArrowEndpoints(dr, cv) {
                let p1 = { x: dr.x1, y: dr.y1 },
                    p2 = { x: dr.x2, y: dr.y2 };
                const r1 = getRectForRef(cv, dr.startRef),
                    r2 = getRectForRef(cv, dr.endRef);
                const target1 = r1 ? rectCenter(r1) : p1,
                    target2 = r2 ? rectCenter(r2) : p2;
                if (r1) p1 = rectEdgePoint(r1, target2.x, target2.y);
                if (r2) p2 = rectEdgePoint(r2, target1.x, target1.y);
                return { p1, p2 };
            }
            function getObjectRect(obj, cv) {
                if (cv.nodes.includes(obj))
                    return { x: obj.x, y: obj.y, w: obj.w, h: obj.h };
                if ((cv.assets || []).includes(obj)) {
                    if (obj.type === "text")
                        return {
                            x: obj.x,
                            y: obj.y,
                            w: obj.w || 200,
                            h: obj._measuredH || 30,
                        };
                    if (obj.type === "image")
                        return {
                            x: obj.x,
                            y: obj.y,
                            w: obj.w || 200,
                            h: obj.h || 150,
                        };
                    return { x: obj.x, y: obj.y, w: 200, h: 70 };
                }
                if ((cv.pins || []).includes(obj))
                    return { x: obj.x - 12.5, y: obj.y - 12.5, w: 25, h: 25 };
                return null;
            }
            function refOf(obj, cv) {
                if (cv.nodes.includes(obj)) return { kind: "node", id: obj.id };
                if ((cv.assets || []).includes(obj))
                    return { kind: "asset", id: obj.id };
                if ((cv.pins || []).includes(obj))
                    return { kind: "pin", id: obj.id };
                return null;
            }
            let connectorDragActive = false;
            function attachConnectorAnchors(el, obj) {
                let anchorEls = [];
                function removeAnchors() {
                    anchorEls.forEach((d) => d.remove());
                    anchorEls = [];
                }
                function showAnchors() {
                    if (connectorDragActive) return;
                    removeAnchors();
                    const cv = getCanvas(path);
                    const rect = getObjectRect(obj, cv);
                    if (!rect) return;
                    const pts = {
                        top: { x: rect.x + rect.w / 2, y: rect.y },
                        right: { x: rect.x + rect.w, y: rect.y + rect.h / 2 },
                        bottom: { x: rect.x + rect.w / 2, y: rect.y + rect.h },
                        left: { x: rect.x, y: rect.y + rect.h / 2 },
                    };
                    Object.values(pts).forEach((pt) => {
                        const dot = document.createElement("div");
                        dot.className = "connector-anchor";
                        dot.style.left = pt.x - 6 + "px";
                        dot.style.top = pt.y - 6 + "px";
                        attachConnectorDrag(dot, obj, pt);
                        dot.addEventListener("pointerleave", (e) => {
                            if (
                                !connectorDragActive &&
                                !(
                                    e.relatedTarget &&
                                    (e.relatedTarget === el ||
                                        anchorEls.includes(e.relatedTarget))
                                )
                            )
                                removeAnchors();
                        });
                        nodesLayer.appendChild(dot);
                        anchorEls.push(dot);
                    });
                }
                el.addEventListener("pointerenter", showAnchors);
                el.addEventListener("pointerleave", (e) => {
                    if (connectorDragActive) return;
                    if (e.relatedTarget && anchorEls.includes(e.relatedTarget))
                        return;
                    removeAnchors();
                });
            }
            function attachConnectorDrag(dot, obj, originPt) {
                dot.addEventListener("pointerdown", (e) => {
                    e.stopPropagation();
                    connectorDragActive = true;
                    dot.setPointerCapture && dot.setPointerCapture(e.pointerId);
                    const cv = getCanvas(path);
                    const startRef = refOf(obj, cv);
                    const tempLine = document.createElementNS(
                        "http://www.w3.org/2000/svg",
                        "line",
                    );
                    tempLine.setAttribute("class", "arrow-line");
                    tempLine.setAttribute("marker-end", "url(#arrowhead-end)");
                    tempLine.setAttribute("x1", dm(originPt.x));
                    tempLine.setAttribute("y1", dm(originPt.y));
                    tempLine.setAttribute("x2", dm(originPt.x));
                    tempLine.setAttribute("y2", dm(originPt.y));
                    drawlayer.appendChild(tempLine);
                    const onMove = (ev) => {
                        const pt = screenToCanvas(ev.clientX, ev.clientY);
                        tempLine.setAttribute("x2", dm(pt.x));
                        tempLine.setAttribute("y2", dm(pt.y));
                    };
                    const onUp = (ev) => {
                        dot.removeEventListener("pointermove", onMove);
                        dot.removeEventListener("pointerup", onUp);
                        dot.removeEventListener("pointercancel", onUp);
                        tempLine.remove();
                        connectorDragActive = false;
                        const endPt = screenToCanvas(ev.clientX, ev.clientY);
                        const endRef = findSnapTarget(cv, endPt);
                        pushUndo();
                        cv.drawings.push({
                            id: "dr" + Date.now(),
                            type: "arrow",
                            x1: originPt.x,
                            y1: originPt.y,
                            x2: endPt.x,
                            y2: endPt.y,
                            head: "end",
                            dashed: false,
                            startRef,
                            endRef,
                        });
                        render();
                    };
                    dot.addEventListener("pointermove", onMove);
                    dot.addEventListener("pointerup", onUp);
                    dot.addEventListener("pointercancel", onUp);
                });
            }

            let lastRenderedPathKey = null;
            function render() {
                const pathKey = path.join("/");
                if (pathKey !== lastRenderedPathKey) {
                    selectedDrawing = null;
                    selectedDrawingCv = null;
                    multiSelected.clear();
                }
                lastRenderedPathKey = pathKey;
                const cv = getCanvas(path);
                nodesLayer.innerHTML = "";
                drawlayer.innerHTML =
                    "<defs>" +
                    '<marker id="arrowhead-end" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1B1A17"/></marker>' +
                    '<marker id="arrowhead-start" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto-start-reverse"><path d="M0,0 L6,3 L0,6 Z" fill="#1B1A17"/></marker>' +
                    "</defs>";
                selectedEl = null;
                selectedData = null;

                breadcrumbEl.innerHTML = "";
                path.forEach((id, idx) => {
                    const c = getCanvas(path.slice(0, idx + 1));
                    const isCurrent = idx === path.length - 1;
                    const span = document.createElement("span");
                    span.className = "crumb" + (isCurrent ? " current" : "");
                    span.textContent = c.title;
                    span.title = isCurrent ? "Double-click to rename" : "";
                    span.onclick = () => {
                        if (!isCurrent) {
                            path = path.slice(0, idx + 1);
                            render();
                        }
                    };
                    if (isCurrent) {
                        span.addEventListener("dblclick", (e) => {
                            e.stopPropagation();
                            span.contentEditable = "true";
                            span.focus();
                            document.execCommand("selectAll", false, null);
                        });
                        span.addEventListener("keydown", (e) => {
                            if (e.key === "Enter") {
                                e.preventDefault();
                                span.blur();
                            }
                        });
                        span.addEventListener("blur", () => {
                            span.contentEditable = "false";
                            const nv = span.textContent.trim();
                            if (nv && nv !== c.title) {
                                pushUndo();
                                c.title = nv;
                                if (idx > 0) {
                                    const parentCv = getCanvas(
                                        path.slice(0, idx),
                                    );
                                    const linkNode = parentCv.nodes.find(
                                        (n) => n.childId === c.id,
                                    );
                                    if (linkNode) linkNode.label = nv;
                                }
                                render();
                            }
                        });
                    }
                    breadcrumbEl.appendChild(span);
                    if (idx < path.length - 1) {
                        const sep = document.createElement("span");
                        sep.className = "sep";
                        sep.textContent = "/";
                        breadcrumbEl.appendChild(sep);
                    }
                });

                const hiddenRefs = new Set();
                const collapsedFrameRects = [];
                function inFrame(f, item) {
                    return (
                        item.x >= f.x &&
                        item.x <= f.x + f.w &&
                        item.y >= f.y &&
                        item.y <= f.y + f.h
                    );
                }
                (cv.frames || []).forEach((f, fi) => {
                    if (f.collapsed) {
                        collapsedFrameRects.push(f);
                        cv.nodes.forEach((n) => {
                            if (inFrame(f, n)) hiddenRefs.add(n);
                        });
                        (cv.assets || []).forEach((a) => {
                            if (inFrame(f, a)) hiddenRefs.add(a);
                        });
                        cv.pins.forEach((p) => {
                            if (inFrame(f, p)) hiddenRefs.add(p);
                        });
                    }
                    const fb = document.createElement("div");
                    fb.style.left = f.x + "px";
                    fb.style.top = f.y + "px";
                    if (f.collapsed) {
                        fb.className = "frame-box collapsed";
                        fb.innerHTML = `<div class="frame-collapsed-card"><span class="ft" contenteditable="false" title="Double-click to rename">${f.label}</span><span class="fc" title="Expand">▸</span></div>`;
                    } else {
                        fb.className = "frame-box";
                        fb.style.width = f.w + "px";
                        fb.style.height = f.h + "px";
                        fb.innerHTML = `<div class="frame-label"><span class="ft" contenteditable="false" title="Double-click to rename">${f.label}</span><span class="fc" title="Collapse">▾</span></div>`;
                    }
                    const ft = fb.querySelector(".ft");
                    ft.addEventListener("pointerdown", (ev) =>
                        ev.stopPropagation(),
                    );
                    ft.addEventListener("dblclick", (ev) => {
                        ev.stopPropagation();
                        ft.contentEditable = "true";
                        ft.focus();
                        document.execCommand("selectAll", false, null);
                    });
                    ft.addEventListener("keydown", (ev) => {
                        if (ev.key === "Enter") {
                            ev.preventDefault();
                            ft.blur();
                        }
                    });
                    ft.addEventListener("blur", () => {
                        ft.contentEditable = "false";
                        const nv = ft.textContent.trim();
                        if (nv && nv !== f.label) {
                            pushUndo();
                            f.label = nv;
                        }
                    });
                    const fc = fb.querySelector(".fc");
                    fc.addEventListener("pointerdown", (ev) =>
                        ev.stopPropagation(),
                    );
                    fc.addEventListener("click", (ev) => {
                        ev.stopPropagation();
                        pushUndo();
                        f.collapsed = !f.collapsed;
                        render();
                    });
                    nodesLayer.appendChild(fb);
                });

                cv.nodes.forEach((n) => {
                    if (hiddenRefs.has(n)) return;
                    const el = document.createElement("div");
                    el.className =
                        "node" + (multiSelected.has(n) ? " selected" : "");
                    el.style.left = n.x + "px";
                    el.style.top = n.y + "px";
                    el.style.width = n.w + "px";
                    el.style.height = n.h + "px";
                    el.innerHTML = `
      <div class="node-head">${
          n.kind === "live"
              ? `<span class="badge-live badge-edit"><span class="dot"></span>LIVE · ${n.version}</span>`
              : `<span class="badge-static badge-edit">FROZEN · ${n.version}</span>`
      }
        <button class="node-upload" title="Set jump screen image">⤓</button>
        ${n.versions && n.versions.length > 1 ? `<button class="node-diff" title="Compare versions">⇄</button>` : ""}
      </div>
      <div class="node-thumb">${n.thumb ? `<img src="${n.thumb}" alt="${n.label}">` : fakeThumb()}</div>
      <div class="node-foot"><span class="node-label" title="Double-click to rename">${n.label}</span><span class="dive-hint">dive in ⤵</span></div>`;
                    attachDragSelect(el, n);
                    attachConnectorAnchors(el, n);
                    domByObj.set(n, el);
                    el.addEventListener("dblclick", (e) => {
                        e.stopPropagation();
                        diveInto(el, n);
                    });
                    el.querySelector(".node-upload").addEventListener(
                        "pointerdown",
                        (e) => e.stopPropagation(),
                    );
                    el.querySelector(".node-upload").addEventListener(
                        "click",
                        (e) => {
                            e.stopPropagation();
                            openImagePicker(n);
                        },
                    );
                    const diffBtn = el.querySelector(".node-diff");
                    if (diffBtn) {
                        diffBtn.addEventListener("pointerdown", (e) =>
                            e.stopPropagation(),
                        );
                        diffBtn.addEventListener("click", (e) => {
                            e.stopPropagation();
                            openDiffModal(n);
                        });
                    }
                    const badgeEl = el.querySelector(".badge-edit");
                    badgeEl.addEventListener("pointerdown", (e) =>
                        e.stopPropagation(),
                    );
                    badgeEl.addEventListener("click", (e) => {
                        e.stopPropagation();
                        openBadgeCard(n, e.clientX, e.clientY);
                    });
                    const labelEl = el.querySelector(".node-label");
                    labelEl.addEventListener("pointerdown", (e) =>
                        e.stopPropagation(),
                    );
                    labelEl.addEventListener("dblclick", (e) => {
                        e.stopPropagation();
                        labelEl.contentEditable = "true";
                        labelEl.focus();
                        document.execCommand("selectAll", false, null);
                    });
                    labelEl.addEventListener("keydown", (e) => {
                        if (e.key === "Enter") {
                            e.preventDefault();
                            labelEl.blur();
                        }
                    });
                    labelEl.addEventListener("blur", () => {
                        labelEl.contentEditable = "false";
                        const nv = labelEl.textContent.trim();
                        if (nv && nv !== n.label) {
                            pushUndo();
                            n.label = nv;
                            if (n.childId && cv.children[n.childId])
                                cv.children[n.childId].title = nv;
                            render();
                        }
                    });
                    nodesLayer.appendChild(el);
                });

                (cv.assets || []).forEach((a) => {
                    if (hiddenRefs.has(a)) return;
                    let el;
                    if (a.type === "text") {
                        el = document.createElement("div");
                        el.className = "text-card asset-card";
                        el.style.left = a.x + "px";
                        el.style.top = a.y + "px";
                        el.style.width = a.w + "px";
                        el.contentEditable = "false";
                        el.textContent = a.text;
                        el.addEventListener("dblclick", (e) => {
                            e.stopPropagation();
                            el.contentEditable = "true";
                            el.focus();
                        });
                        el.addEventListener("blur", () => {
                            el.contentEditable = "false";
                            a.text = el.textContent;
                            render();
                        });
                    } else if (a.type === "image") {
                        el = document.createElement("div");
                        el.className = "asset-card image-card";
                        el.style.left = a.x + "px";
                        el.style.top = a.y + "px";
                        el.style.width = (a.w || 200) + "px";

                    const chip = document.createElement("div");
                    chip.className = "sprintchip";
                    chip.style.left = p.x + 30 + "px";
                    chip.style.top = p.y + 4 + "px";
                    const typeLabel =
                        p.type.charAt(0).toUpperCase() + p.type.slice(1);
                    const adoHtml = p.ado
                        ? ` · <a href="${p.ado.url || "#"}" target="_blank" rel="noopener" class="chip-ado-link">#${p.ado.id.replace("#", "")}</a>`
                        : "";
                    chip.innerHTML = `${typeLabel} · ${p.sprint}${adoHtml}`;
                    nodesLayer.appendChild(chip);
                });

                function ptInCollapsedFrame(pt) {
                    return collapsedFrameRects.some(
                        (f) =>
                            pt.x >= f.x &&
                            pt.x <= f.x + f.w &&
                            pt.y >= f.y &&
                            pt.y <= f.y + f.h,
                    );
                }
                (cv.drawings || []).forEach((dr) => {
                    if (dr.type === "pen" || dr.type === "highlight") {
                        if (dr.points.some(ptInCollapsedFrame)) return;
                    } else if (dr.type === "arrow") {
                        const { p1, p2 } = resolveArrowEndpoints(dr, cv);
                        if (ptInCollapsedFrame(p1) || ptInCollapsedFrame(p2))
                            return;
                    }
                    const isSelected = dr === selectedDrawing;
                    if (dr.type === "pen" || dr.type === "highlight") {
                        const d =
                            `M${dm(dr.points[0].x)},${dm(dr.points[0].y)} ` +
                            dr.points
                                .slice(1)
                                .map((p) => `L${dm(p.x)},${dm(p.y)}`)
                                .join(" ");
                        if (isSelected) {
                            const glow = document.createElementNS(
                                "http://www.w3.org/2000/svg",
                                "path",
                            );
                            glow.setAttribute("data-drid", dr.id || "");
                            glow.setAttribute("d", d);
                            glow.setAttribute("fill", "none");
                            glow.setAttribute("stroke", "var(--terminal)");
                            glow.setAttribute(
                                "stroke-width",
                                dr.type === "pen" ? "7" : "18",
                            );
                            glow.setAttribute("stroke-linecap", "round");
                            glow.setAttribute("stroke-linejoin", "round");
                            glow.setAttribute("opacity", "0.18");
                            drawlayer.appendChild(glow);
                        }
                        const visible = document.createElementNS(
                            "http://www.w3.org/2000/svg",
                            "path",
                        );
                        visible.setAttribute("data-drid", dr.id || "");
                        visible.setAttribute(
                            "class",
                            dr.type === "pen" ? "pen-stroke" : "hl-stroke",
                        );
                        visible.setAttribute("d", d);
                        if (dr.type === "highlight")
                            visible.style.stroke = dr.color || "#FCE181";
                        if (dr.type === "pen" && dr.color)
                            visible.style.stroke = dr.color;
                        drawlayer.appendChild(visible);
                        const hit = document.createElementNS(
                            "http://www.w3.org/2000/svg",
                            "path",
                        );
                        hit.setAttribute("data-drid", dr.id || "");
                        hit.setAttribute("d", d);
                        hit.setAttribute("fill", "none");
                        hit.setAttribute("stroke", "transparent");
                        hit.setAttribute("stroke-width", "16");
                        hit.style.cursor = "pointer";
                        hit.addEventListener("pointerdown", (e) =>
                            e.stopPropagation(),
                        );
                        hit.addEventListener("click", (e) => {
                            e.stopPropagation();
                            selectedDrawing = dr;
                            selectedDrawingCv = cv;
                            render();
                        });
                        drawlayer.appendChild(hit);
                    } else if (dr.type === "arrow") {
                        const { p1, p2 } = resolveArrowEndpoints(dr, cv);
                        if (isSelected) {
                            const glow = document.createElementNS(
                                "http://www.w3.org/2000/svg",
                                "line",
                            );
                            glow.setAttribute("data-drid", dr.id || "");
                            glow.setAttribute("x1", dm(p1.x));
                            glow.setAttribute("y1", dm(p1.y));
                            glow.setAttribute("x2", dm(p2.x));
                            glow.setAttribute("y2", dm(p2.y));
                            glow.setAttribute("stroke", "var(--terminal)");
                            glow.setAttribute("stroke-width", "9");
                            glow.setAttribute("opacity", "0.18");
                            drawlayer.appendChild(glow);
                        }
                        const visibleLine = document.createElementNS(
                            "http://www.w3.org/2000/svg",
                            "line",
                        );
                        visibleLine.setAttribute("data-drid", dr.id || "");
                        visibleLine.setAttribute("class", "arrow-line");
                        visibleLine.setAttribute("x1", dm(p1.x));
                        visibleLine.setAttribute("y1", dm(p1.y));
                        visibleLine.setAttribute("x2", dm(p2.x));
                        visibleLine.setAttribute("y2", dm(p2.y));
                        if (dr.head === "end")
                            visibleLine.setAttribute(
                                "marker-end",
                                "url(#arrowhead-end)",
                            );
                        if (dr.head === "both") {
                            visibleLine.setAttribute(
                                "marker-end",
                                "url(#arrowhead-end)",
                            );
                            visibleLine.setAttribute(
                                "marker-start",
                                "url(#arrowhead-start)",
                            );
                        }
                        if (dr.dashed)
                            visibleLine.setAttribute("stroke-dasharray", "7 6");
                        drawlayer.appendChild(visibleLine);
                        const hit = document.createElementNS(
                            "http://www.w3.org/2000/svg",
                            "line",
                        );
                        hit.setAttribute("data-drid", dr.id || "");
                        hit.setAttribute("x1", dm(p1.x));
                        hit.setAttribute("y1", dm(p1.y));
                        hit.setAttribute("x2", dm(p2.x));
                        hit.setAttribute("y2", dm(p2.y));
                        hit.setAttribute("stroke", "transparent");
                        hit.setAttribute("stroke-width", "14");
                        hit.style.cursor = "pointer";
                        hit.addEventListener("pointerdown", (e) =>
                            e.stopPropagation(),
                        );
                        hit.addEventListener("click", (e) => {
                            e.stopPropagation();
                            selectedDrawing = dr;
                            selectedDrawingCv = cv;
                            render();
                        });
                        drawlayer.appendChild(hit);
                        if (isSelected) {
                            [
                                ["start", p1],
                                ["end", p2],
                            ].forEach(([which, pt]) => {
                                const h = document.createElement("div");
                                h.className = "arrow-handle";
                                h.dataset.drid = dr.id || "";
                                h.dataset.which = which;
                                h.style.left = pt.x - 7 + "px";
                                h.style.top = pt.y - 7 + "px";
                                attachArrowHandleDrag(h, dr, which);
                                nodesLayer.appendChild(h);
                            });
                        }
                    }
                });

                applyTransform();
                scheduleCloudSave();
            }

    <div class="thumb-row" style="margin-top:9px"><div class="thumb-block"></div><div class="thumb-block"></div><div class="thumb-block"></div></div>

            /* ---- badge editor (Live/Frozen + version, with Figma-link auto-detect) ---- */
            const badgeCard = document.getElementById("badgeCard");
            const bcSeg = document.getElementById("bcSeg");
            const bcVersion = document.getElementById("bcVersion");
            const bcUrl = document.getElementById("bcUrl");
            let badgeTarget = null;

            function setSeg(kind) {
                bcSeg
                    .querySelectorAll("button")
                    .forEach((b) =>
                        b.classList.toggle("active", b.dataset.v === kind),
                    );
            }
            bcSeg
                .querySelectorAll("button")
                .forEach((b) =>
                    b.addEventListener("click", () => setSeg(b.dataset.v)),
                );

            bcUrl.addEventListener("input", () => {
                // intelligent detection: a pasted Figma link implies this node is now live-synced
                if (/figma\.com/i.test(bcUrl.value)) {
                    setSeg("live");
                    if (!bcVersion.value || bcVersion.value === "—")
                        bcVersion.value = "Figma";
                }
            });

            function openBadgeCard(node, clientX, clientY) {
                badgeTarget = node;
                setSeg(node.kind);
                bcVersion.value = node.version || "";
                bcUrl.value = node.figmaUrl || "";
                badgeCard.style.left =
                    Math.min(clientX + 10, window.innerWidth - 280) + "px";
                badgeCard.style.top =
                    Math.min(clientY + 10, window.innerHeight - 260) + "px";
                badgeCard.classList.add("open");
            }

                    bcSeg.querySelector("button.active").dataset.v;
                badgeTarget.version =
                    bcVersion.value ||
                    (badgeTarget.kind === "live" ? "Figma" : "v1");

            /* ---- version diff modal ---- */
            const diffModal = document.getElementById("diffModal");

            function openDiffModal(node) {
                const versions = node.versions;
                const oldV = versions[0],
                    newV = versions[versions.length - 1];
                document.getElementById("diffOld").src = oldV.thumb;
                document.getElementById("diffNew").src = newV.thumb;
                document.getElementById("diffOldLabel").textContent =
                    oldV.label;
                document.getElementById("diffNewLabel").textContent =
