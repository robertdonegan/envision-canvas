            function updateDotGrid() {
                let s = DOT_SPACING * zoom;
                while (s < 16) s *= 2;
                while (s > 32) s /= 2;
                const r = Math.min(2, Math.max(1, 1.4 * Math.pow(zoom, 0.3)));
                dotGridEl.style.backgroundSize = `${s}px ${s}px`;
                dotGridEl.style.backgroundPosition =
                    `${panX - s / 2}px ${panY - s / 2}px`;
                dotGridEl.style.setProperty("--dot-r", r + "px");
            }
            function setZoomAnim(on) {
                document
                    .getElementById("canvasLayer")
                    .classList.toggle("zoom-anim", on);
                dotGridEl.classList.toggle("zoom-anim", on);
            }
            function screenToCanvas(clientX, clientY) {
                const rect = document
                    .getElementById("viewport")
                    .getBoundingClientRect();
                return {
                    x: (clientX - rect.left - panX) / zoom,
                    y: (clientY - rect.top - panY) / zoom,
                };
            }

            let lastZoomTarget = null;
            function zoomToFit(el, dataObj, anchor) {
                if (dataObj && lastZoomTarget === dataObj) {
                    lastZoomTarget = null;
                    setZoomAnim(true);
                    // Return to 100% keeping the clicked point under the cursor
                    const vr = viewportEl.getBoundingClientRect();
                    const ax = anchor ? anchor.x - vr.left : vr.width / 2,
                        ay = anchor ? anchor.y - vr.top : vr.height / 2;
                    const cx = (ax - panX) / zoom,
                        cy = (ay - panY) / zoom;
                    zoom = 1;
                    panX = ax - cx;
                    panY = ay - cy;
                    applyTransform();
                    setTimeout(
                        () => setZoomAnim(false),
                        460,
                    );
                    return;
                }
                lastZoomTarget = dataObj || null;
                const vpRect = viewportEl.getBoundingClientRect();
                const elRect = el.getBoundingClientRect();
                const canvasW = elRect.width / zoom,
                    canvasH = elRect.height / zoom;
                const canvasX = (elRect.left - vpRect.left - panX) / zoom;
                const canvasY = (elRect.top - vpRect.top - panY) / zoom;
                const padX = vpRect.width * 0.1,
                    padY = vpRect.height * 0.1;
                const scaleW = (vpRect.width - padX * 2) / canvasW;
                const scaleH = (vpRect.height - padY * 2) / canvasH;
                const newZoom = Math.max(
                    0.4,
                    Math.min(8, Math.min(scaleW, scaleH)),
                );
                const centerCanvasX = canvasX + canvasW / 2,
                    centerCanvasY = canvasY + canvasH / 2;
                setZoomAnim(true);
                zoom = newZoom;
                panX = vpRect.width / 2 - centerCanvasX * zoom;
                panY = vpRect.height / 2 - centerCanvasY * zoom;
                applyTransform();
                setTimeout(
                    () => setZoomAnim(false),
                    460,
                );
            }

            function fitToContent() {
                const cv = getCanvas(path);
                let minX = Infinity,
                    minY = Infinity,
                    maxX = -Infinity,
                    maxY = -Infinity;
                const addRect = (x, y, w, h) => {
                    if (x < minX) minX = x;
                    if (y < minY) minY = y;
                    if (x + w > maxX) maxX = x + w;
                    if (y + h > maxY) maxY = y + h;
                };
                (cv.nodes || []).forEach((n) =>
                    addRect(n.x, n.y, n.w || 180, n.h || 185),
                );
                (cv.assets || []).forEach((a) => {
                    if (a.type === "text")
                        addRect(a.x, a.y, a.w || 200, a._measuredH || 30);
                    else if (a.type === "image")
                        addRect(a.x, a.y, a.w || 200, a.h || 150);
                    else addRect(a.x, a.y, 200, 70);
                });
                (cv.pins || []).forEach((p) =>
                    addRect(p.x - 12.5, p.y - 12.5, 25, 25),
                );
                (cv.drawings || []).forEach((d) => {
                    if (!d.points || !d.points.length) return;
                    let lx = Infinity,
                        ly = Infinity,
                        hx = -Infinity,
                        hy = -Infinity;
                    d.points.forEach((p) => {
                        if (p.x < lx) lx = p.x;
                        if (p.y < ly) ly = p.y;
                        if (p.x > hx) hx = p.x;
                        if (p.y > hy) hy = p.y;
                    });
                    addRect(lx, ly, hx - lx, hy - ly);
                });
                (cv.frames || []).forEach((f) =>
                    addRect(
                        f.x,
                        f.y,
                        f.collapsed ? 200 : f.w || 260,
                        f.collapsed ? 50 : f.h || 160,
                    ),
                );
                if (!isFinite(minX) || !isFinite(minY)) {
                    zoom = 1;
                    panX = 0;
                    panY = 0;
                    applyTransform();
                    return;
                }
                const cw = Math.max(maxX - minX, 1),
                    ch = Math.max(maxY - minY, 1);
                const vp = viewportEl.getBoundingClientRect();
                const padX = vp.width * 0.08,
                    padY = vp.height * 0.1;
                const newZoom = Math.max(
                    0.4,
                    Math.min(
                        8,
                        Math.min(
                            (vp.width - padX * 2) / cw,
                            (vp.height - padY * 2) / ch,
                        ),
                    ),
                );
                zoom = newZoom;
                panX = vp.width / 2 - (minX + cw / 2) * newZoom;

            };
            function pinGlyph(p) {
                return p.status === "done" ? PIN_GLYPHS.done : PIN_GLYPHS[p.type] || "•";

            function getRectForRef(cv, ref) {
                if (!ref) return null;
                if (ref.kind === "node") {
                    const n = cv.nodes.find((n) => n.id === ref.id);
                    return n ? { x: n.x, y: n.y, w: n.w, h: n.h } : null;
                }
                if (ref.kind === "asset") {
                    const a = (cv.assets || []).find((a) => a.id === ref.id);
                    if (!a) return null;
                    if (a.type === "text")
                        return {
                            x: a.x,
                            y: a.y,
                            w: a.w || 200,
                            h: a._measuredH || 30,
                        };
                    if (a.type === "image")
                        return { x: a.x, y: a.y, w: a.w || 200, h: a.h || 150 };
                    return { x: a.x, y: a.y, w: 200, h: 70 }; // link card
                }
                if (ref.kind === "pin") {
                    const p = (cv.pins || []).find((p) => p.id === ref.id);
                    return p
                        ? { x: p.x - 12.5, y: p.y - 12.5, w: 25, h: 25 }
                        : null;
                }

            }
            function rectCenter(r) {
                return { x: r.x + r.w / 2, y: r.y + r.h / 2 };

            function rectEdgePoint(r, towardX, towardY) {
                const cx = r.x + r.w / 2,
                    cy = r.y + r.h / 2,
                    dx = towardX - cx,
                    dy = towardY - cy;
                if (dx === 0 && dy === 0) return { x: cx, y: cy };
                const sx = r.w / 2 / Math.max(Math.abs(dx), 1e-6),
                    sy = r.h / 2 / Math.max(Math.abs(dy), 1e-6);
                const s = Math.min(sx, sy);
                return { x: cx + dx * s, y: cy + dy * s };
            }
            function findSnapTarget(cv, pt) {
                const pad = 16;
                for (const n of cv.nodes) {

                        pt.y <= n.y + n.h + pad

                    const r =
                        a.type === "text"
                            ? {
                                  x: a.x,
                                  y: a.y,
                                  w: a.w || 200,
                                  h: a._measuredH || 30,
                              }
                            : a.type === "image"
                              ? { x: a.x, y: a.y, w: a.w || 200, h: a.h || 150 }
                              : { x: a.x, y: a.y, w: 200, h: 70 };

                        pt.x >= r.x - pad &&

                    confirmLabel || "Delete";
                confirmModal.classList.add("open");
                return new Promise((resolve) => {
                    confirmResolve = resolve;
                });
            }
            function dismissConfirm(result) {
                confirmModal.classList.remove("open");
                if (confirmResolve) {
                    confirmResolve(result);
                    confirmResolve = null;
                }
            }
            document.getElementById("confirmCancel").onclick = () =>
                dismissConfirm(false);
            document.getElementById("confirmDone").onclick = () =>
                dismissConfirm(true);
            confirmModal.addEventListener("click", (e) => {
                if (e.target === confirmModal) dismissConfirm(false);
            });
            function countNestedScreens(canvas) {
                let count = 0;
                Object.values(canvas.children || {}).forEach((c) => {
                    count += 1 + countNestedScreens(c);
                });
                return count;
            }
            function screenWarningHtml(screens, cv) {
                const names = screens
                    .map((s) => `<strong>"${s.label}"</strong>`)
                    .join(", ");
                if (
                    screens.length === 1 &&
                    screens[0].childId &&
                    cv.children &&
                    cv.children[screens[0].childId]
                ) {
                    const child = cv.children[screens[0].childId];
                    const nested = 1 + countNestedScreens(child);
                    return `Deleting ${names} permanently removes it and the <strong>${nested}</strong> screen${nested === 1 ? "" : "s"} nested inside it (the "${child.title}" canvas and everything on it).`;
                }
                const plural = screens.length > 1 ? "s" : "";
                return `Deleting ${names} permanently removes the screen${plural} and everything nested inside ${screens.length > 1 ? "them" : "it"}.`;
            }
            function removeScreen(n) {
                const cv = getCanvas(path);
                pushUndo();
                removeItemFromCanvas(cv, n);
                multiSelected.delete(n);
                if (selectedData === n) {
                    selectedData = null;
                    selectedEl = null;
                }
                if (!pathValid(path)) path = ["root"];
                render();
            }
            async function openDeleteScreenDialog(n) {
                const ok = await showConfirm({
                    title: "Delete this jump screen?",
                    bodyHtml:
                        screenWarningHtml([n], getCanvas(path)) +
                        " You can Undo afterwards.",
                    confirmLabel: "Delete screen",
                });
                if (ok) removeScreen(n);
            }

            /* ---- screenshot upload ---- */
            const imgFileInput = document.getElementById("imgFileInput");
            let imageUploadTarget = null;
            document.addEventListener("dragstart", (e) => {
                if (e.target && e.target.tagName === "IMG") e.preventDefault();
            });
            const NODE_CHROME_H = 28; // top bar only
            function openImagePicker(node) {
                imageUploadTarget = node;
                imgFileInput.value = "";
                imgFileInput.click();
            }
            imgFileInput.addEventListener("change", (e) => {
                const file = e.target.files[0];
                if (!file || !imageUploadTarget) return;
                const reader = new FileReader();
                reader.onload = () => {
                    const dataUrl = reader.result;
                    const img = new Image();
                    img.onload = () => {
                        pushUndo();
                        const target = imageUploadTarget;
                        const isScreen = "childId" in target;
                        target.thumb = dataUrl;
                        if (isScreen) {
                            const w = target.w || 220;
                            const ratio = img.naturalHeight / img.naturalWidth;
                            target.w = w;
                            target.h = Math.round(w * ratio) + NODE_CHROME_H;
                            target.versions = target.versions || [];
                            target.versions.push({
                                label: target.version || "v1",
                                thumb: dataUrl,
                            });
                        } else {
                            const ratio = img.naturalHeight / img.naturalWidth;
                            const longSide = 220,
                                pad = 1;
                            let dispW, dispH;
                            if (ratio <= 1) {
                                dispW = longSide;
                                dispH = longSide * ratio;
                            } else {
                                dispH = longSide;
                                dispW = longSide / ratio;
                            }
                            target.w = Math.max(
                                120,
                                Math.min(420, Math.round(dispW / pad)),
                            );
                            target.h =
                                Math.max(
                                    110,
                                    Math.min(420, Math.round(dispH / pad)),
                                ) + 20;
                        }
                        render();
                    };
                    img.src = dataUrl;
                };
                reader.readAsDataURL(file);
            });

            /* ============================================================ SELECT + DRAG ============================================================ */
            function attachDragSelect(el, dataObj) {
                el.addEventListener("click", (e) => {
                    if (e.metaKey || e.ctrlKey) {
                        e.stopPropagation();
                        zoomToFit(el, dataObj, { x: e.clientX, y: e.clientY });
                    }
                });
                el.addEventListener("pointerdown", (e) => {
                    if (e.metaKey || e.ctrlKey) return; // handled by the click listener above
                    if (e.shiftKey && currentTool === "select") return; // shift-drag → box select
                    if (["pen", "highlight", "arrow"].includes(currentTool))
                        return; // those tools draw on top instead
                    e.stopPropagation();
                    el.setPointerCapture && el.setPointerCapture(e.pointerId);
                    // Jump screens only move when dragged by their top bar
                    const canMove =
                        !el.classList.contains("node") ||
                        !!e.target.closest(".node-head");
                    const startClientX = e.clientX,
                        startClientY = e.clientY,
                        origX = dataObj.x,
                        origY = dataObj.y;
                    const preSnap = JSON.stringify(tree);
                    const isGroupDrag =
                        multiSelected.has(dataObj) && multiSelected.size > 1;
                    const groupOrigins = isGroupDrag
                        ? [...multiSelected].map((o) => ({
                              obj: o,
                              x: o.x,
                              y: o.y,
                          }))
                        : null;
                    let moved = false;
                    const onMove = (ev) => {
                        const dx = (ev.clientX - startClientX) / zoom,
                            dy = (ev.clientY - startClientY) / zoom;
                        if (!canMove) return;
                        if (Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
                        if (moved) {
                            if (groupOrigins) {
                                groupOrigins.forEach((go) => {
                                    go.obj.x = snapVal(go.x + dx);
                                    go.obj.y = snapVal(go.y + dy);
                                    const memberEl = domByObj.get(go.obj);
                                    if (memberEl) {
                                        if (memberEl.classList.contains("pin") && memberEl.parentElement) {
                                            memberEl.parentElement.style.left =
                                                go.obj.x + "px";
                                            memberEl.parentElement.style.top =
                                                go.obj.y + "px";
                                        } else {
                                            memberEl.style.left = go.obj.x + "px";
                                            memberEl.style.top = go.obj.y + "px";
                                        }
                                    }
                                });
                            } else {
                                dataObj.x = snapVal(origX + dx);
                                dataObj.y = snapVal(origY + dy);
                                el.style.left = dataObj.x + "px";
                                el.style.top = dataObj.y + "px";
                            }
                        }
                    };
                    const onUp = (ev) => {
                        el.removeEventListener("pointermove", onMove);
                        el.removeEventListener("pointerup", onUp);
                        el.removeEventListener("pointercancel", onUp);
                        if (!moved) {
                            if (!isGroupDrag) selectNode(el, dataObj);
                        } else {
                            commitUndo(preSnap);
                            render();
                        }
                    };
                    el.addEventListener("pointermove", onMove);
                    el.addEventListener("pointerup", onUp);
                    el.addEventListener("pointercancel", onUp);
                });
            }
            function selectNode(el, dataObj) {
                if (selectedEl) selectedEl.classList.remove("selected");
                selectedEl = el;
                selectedData = dataObj || null;
                el.classList.add("selected");
            }
            // Drag a pen / highlight / arrow stroke to move it.
            function attachDrawingDrag(hit, dr, cv) {
                hit.addEventListener("pointerdown", (e) => {
                    if (["pen", "highlight", "arrow"].includes(currentTool))
                        return; // those tools draw on top instead
                    if (e.shiftKey && currentTool === "select") return; // shift-drag → box select
                    e.stopPropagation();
                    hit.setPointerCapture && hit.setPointerCapture(e.pointerId);
                    const startX = e.clientX,
                        startY = e.clientY;
                    const preSnap = JSON.stringify(tree);
                    const related = drawlayer.querySelectorAll(
                        `[data-drid="${dr.id}"]`,
                    );
                    const handles = nodesLayer.querySelectorAll(
                        `.arrow-handle[data-drid="${dr.id}"]`,
                    );
                    const origPoints =
                        dr.type === "arrow"
                            ? null
                            : dr.points.map((p) => ({ x: p.x, y: p.y }));
                    const orig =
                        dr.type === "arrow"
                            ? resolveArrowEndpoints(dr, cv)
                            : null;
                    let moved = false,
                        dx = 0,
                        dy = 0;
                    const onMove = (ev) => {
                        dx = (ev.clientX - startX) / zoom;
                        dy = (ev.clientY - startY) / zoom;
                        if (!moved && Math.abs(dx) < 3 && Math.abs(dy) < 3)
                            return;
                        moved = true;
                        related.forEach((el) =>
                            el.setAttribute("transform", `translate(${dx} ${dy})`),
                        );
                        handles.forEach(
                            (h) =>
                                (h.style.transform = `translate(${dx}px,${dy}px)`),
                        );
                    };
                    const onUp = () => {
                        hit.removeEventListener("pointermove", onMove);
                        hit.removeEventListener("pointerup", onUp);
                        hit.removeEventListener("pointercancel", onUp);
                        if (!moved) return; // plain click: the click handler selects it
                        if (origPoints) {
                            dr.points = origPoints.map((p) => ({
                                x: p.x + dx,
                                y: p.y + dy,
                            }));
                        } else {
                            dr.x1 = orig.p1.x + dx;
                            dr.y1 = orig.p1.y + dy;
                            dr.x2 = orig.p2.x + dx;
                            dr.y2 = orig.p2.y + dy;
                            dr.startRef = null;
                            dr.endRef = null;
                        }
                        commitUndo(preSnap);
                        selectedDrawing = dr;
                        selectedDrawingCv = cv;
                        render();
                    };
                    hit.addEventListener("pointermove", onMove);
                    hit.addEventListener("pointerup", onUp);
                    hit.addEventListener("pointercancel", onUp);
                });
            }

            function attachArrowHandleDrag(h, dr, which) {
                h.addEventListener("pointerdown", (e) => {
                    e.stopPropagation();
                    h.setPointerCapture && h.setPointerCapture(e.pointerId);
                    const preSnap = JSON.stringify(tree);
                    const related = drawlayer.querySelectorAll(
                        `[data-drid="${dr.id}"]`,
                    );
                    const onMove = (ev) => {
                        const pt = screenToCanvas(ev.clientX, ev.clientY);
                        h.style.left = pt.x - 7 + "px";
                        h.style.top = pt.y - 7 + "px";
                        related.forEach((el) => {
                            if (which === "start") {
                                el.setAttribute("x1", dm(pt.x));
                                el.setAttribute("y1", dm(pt.y));
                            } else {
                                el.setAttribute("x2", dm(pt.x));
                                el.setAttribute("y2", dm(pt.y));
                            }
                        });
                    };
                    const onUp = (ev) => {
                        h.removeEventListener("pointermove", onMove);
                        h.removeEventListener("pointerup", onUp);
                        h.removeEventListener("pointercancel", onUp);
                        const pt = screenToCanvas(ev.clientX, ev.clientY);
                        const snap = findSnapTarget(selectedDrawingCv, pt);
                        if (which === "start") {
                            dr.x1 = pt.x;
                            dr.y1 = pt.y;
                            dr.startRef = snap;

                            dr.x2 = pt.x;
                            dr.y2 = pt.y;

                    h.addEventListener("pointerup", onUp);
                    h.addEventListener("pointercancel", onUp);

            function diveInto(nodeEl, n) {
                const cv = getCanvas(path);
                const child = cv.children[n.childId];
                if (!child) return;
                const rect = nodeEl.getBoundingClientRect();
                const clone = document.getElementById("diveClone");
                const flash = document.getElementById("diveFlash");
                clone.innerHTML = nodeEl.innerHTML;
                clone.style.transition = "none";
                clone.style.left = rect.left + "px";
                clone.style.top = rect.top + "px";
                clone.style.width = rect.width + "px";
                clone.style.height = rect.height + "px";
                clone.style.opacity = "1";
                clone.style.boxShadow = "0 0 0 0 rgba(24,23,18,0)";
                requestAnimationFrame(() => {
                    clone.style.transition =
                        "transform .55s cubic-bezier(.65,0,.35,1), opacity .55s ease, box-shadow .55s ease";
                    const scale =
                        Math.max(
                            window.innerWidth / rect.width,
                            window.innerHeight / rect.height,
                        ) * 1.15;
                    const cx = rect.left + rect.width / 2,
                        cy = rect.top + rect.height / 2;
                    const tx = window.innerWidth / 2 - cx,
                        ty = window.innerHeight / 2 - cy;
                    clone.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
                    clone.style.boxShadow =
                        "0 0 80px 20px rgba(47,109,79,0.18)";
                });
                setTimeout(() => {
                    flash.style.opacity = "1";
                }, 380);
                setTimeout(() => {
                    path = [...path, n.childId];
                    zoom = 1;
                    panX = 0;
                    panY = 0;
                    render();
                    flash.style.opacity = "0";
                    clone.style.transition = "none";
                    clone.style.opacity = "0";
                    clone.style.transform = "translate(0,0) scale(1)";
                }, 560);
            }

            // Escapes text and turns URLs into truncated links that open in a new tab
            function linkifyText(text) {
                return String(text)
                    .split(/(https?:\/\/[^\s<>"]+)/g)
                    .map((part, i) => {
                        if (i % 2 === 0) return escHtml(part);
                        const m = part.match(/^(.*?)([.,;:!?)\]}'"]*)$/);
                        const url = m[1];
                        const tail = m[2];
                        let label = url.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, "");
                        if (label.length > 36) label = label.slice(0, 35) + "…";
                        return `<a class="pcc-link" href="${escHtml(url)}" target="_blank" rel="noopener noreferrer" title="${escHtml(url)}">${escHtml(label)}</a>${escHtml(tail)}`;
                    })
                    .join("");
            }
            function renderThread(p, keepScroll) {
                const threadEl = document.getElementById("pcThread");
                const prevScroll = threadEl.scrollTop;
                if (!p || !p.comments || !p.comments.length) {
                    threadEl.innerHTML = "";
                    return;
                }
                threadEl.innerHTML = p.comments
                    .map(
                        (c, i) =>
                            `<div class="pc-comment" data-ci="${i}"><div class="pcc-actions"><button type="button" class="pcc-edit-btn" title="Edit comment">${PCC_EDIT_ICON}</button><button type="button" class="pcc-del pcc-del-btn" title="Delete comment">${PCC_DEL_ICON}</button></div><div class="pcc-meta">${escHtml(c.time)}</div><div class="pcc-text">${linkifyText(c.text)}</div></div>`,
                    )
                    .join("");
                threadEl.scrollTop = keepScroll
                    ? prevScroll
                    : threadEl.scrollHeight;
            }
            // Pin note mirrors the newest comment (used by search, chip and tooltips)
            function syncPinNote(p) {
                const last = p.comments && p.comments[p.comments.length - 1];
                p.note = last ? last.text : "Untitled " + p.type;
            }
            function startEditComment(p, idx, row) {
                const c = p.comments[idx];
                const body = row.querySelector(".pcc-text");
                row.querySelector(".pcc-actions").style.display = "none";
                body.innerHTML = `<textarea class="pcc-edit"></textarea><div class="pcc-edit-row"><button type="button" class="pcc-cancel">Cancel</button><button type="button" class="pcc-save">Save</button></div>`;
                body.style.paddingRight = "0";
                const ta = body.querySelector("textarea");
                ta.value = c.text;
                ta.focus();
                const commit = () => {
                    const text = ta.value.trim();
                    if (!text) return;
                    if (text !== c.text) {
                        pushUndo();
                        c.text = text;
                        syncPinNote(p);
                        render();
                    }
                    renderThread(p, true);
                };
                body.querySelector(".pcc-save").onclick = commit;
                body.querySelector(".pcc-cancel").onclick = () =>
                    renderThread(p, true);
                ta.addEventListener("keydown", (e) => {
                    if (e.key === "Escape") {
                        e.stopPropagation();
                        renderThread(p, true);
                    } else if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
                        e.preventDefault();
                        commit();
                    }
                });
            }
            document.getElementById("pcThread").addEventListener("click", (e) => {
                if (!pendingPin || !pendingPin.existing) return;
                const p = pendingPin.existing;
                const row = e.target.closest(".pc-comment");
                if (!row || !p.comments) return;
                const idx = +row.dataset.ci;
                if (e.target.closest(".pcc-edit-btn")) {
                    startEditComment(p, idx, row);
                } else if (e.target.closest(".pcc-del-btn")) {
                    pushUndo();
                    p.comments.splice(idx, 1);
                    syncPinNote(p);
                    renderThread(p, true);
                    render();
                }
            });
            function refreshAdoBlock(ado) {
                const adoBlock = document.getElementById("pcAdoBlock");
                const adoBtn = document.getElementById("pcAdoLinkBtn");
                if (ado) {
                    adoBlock.style.display = "block";
                    adoBtn.style.display = "none";
                    const link = document.getElementById("pcAdoId");
                    link.textContent = "#" + ado.id.replace("#", "");
                    link.href = ado.url || "#";
                    document.getElementById("pcAdoStatus").textContent =
                        ado.status;
                } else {
                    adoBlock.style.display = "none";
                    adoBtn.style.display = "flex";
                }
            }
            function openPinCard(clientX, clientY, p) {
                pendingPin = { existing: p, mode: "view" };
                document.getElementById("pcDeletePin").style.display =
                    "inline-flex";
                document.getElementById("pcType").value = p.type;
                populateSprintSelect(p.sprint);
                document.getElementById("pcNoteLabel").textContent = "Comments";
                document.getElementById("pcNote").value = "";
                document.getElementById("pcNote").placeholder =
                    "Add a comment to this thread…";
                document.getElementById("pcAddCommentRow").style.display =
                    "flex";
                renderThread(p);
                refreshAdoBlock(p.ado);
                openCardAt(clientX, clientY);
            }
            function openCardAt(clientX, clientY) {
                pinCard.style.left =
                    Math.min(clientX + 10, window.innerWidth - 300) + "px";
                pinCard.style.top =
                    Math.min(clientY + 10, window.innerHeight - 260) + "px";
                pinCard.classList.add("open");
                clampPinCard();
            }
            function clampPinCard() {
                const r = pinCard.getBoundingClientRect();
                const m = 8;
                const x = Math.max(
                    m,
                    Math.min(r.left, window.innerWidth - r.width - m),
                );
                const y = Math.max(
                    m,
                    Math.min(r.top, window.innerHeight - r.height - m),
                );
                pinCard.style.left = x + "px";
                pinCard.style.top = y + "px";
            }
            window.addEventListener("resize", () => {
                if (pinCard.classList.contains("open")) clampPinCard();
            });
            new ResizeObserver(() => {
                if (pinCard.classList.contains("open")) clampPinCard();
            }).observe(pinCard);
            (() => {
                const h = document.getElementById("pcDrag");
                let off = null;
                h.addEventListener("pointerdown", (e) => {
                    const r = pinCard.getBoundingClientRect();
                    off = { x: e.clientX - r.left, y: e.clientY - r.top };
                    h.setPointerCapture(e.pointerId);
                    pinCard.classList.add("dragging");
                    e.preventDefault();
                });
                h.addEventListener("pointermove", (e) => {
                    if (!off) return;
                    pinCard.style.left = e.clientX - off.x + "px";
                    pinCard.style.top = e.clientY - off.y + "px";
                    clampPinCard();
                });
                const end = () => {
                    off = null;
                    pinCard.classList.remove("dragging");
                };
                h.addEventListener("pointerup", end);
                h.addEventListener("pointercancel", end);
            })();
            document.getElementById("pcCancel").onclick = () => {

            const pcClose = document.getElementById("pcClose");

            document.getElementById("pcDeletePin").onclick = () => {
                if (!pendingPin || !pendingPin.existing) return;
                if (

            document.getElementById("pcAdoLinkBtn").onclick = () => {

            function promptForAdoLink(existing) {
                const url = prompt(
                    "Paste the Azure DevOps work item URL:",
                    (existing && existing.url) ||
                        "https://dev.azure.com/org/project/_workitems/edit/4471",
                );
                if (!url) return null;
                const match = url.match(/(\d+)\s*$/);
                const idNum = match
                    ? match[1]
                    : prompt(
                          "Could not detect an ID from that URL — enter it manually:",
                          existing ? existing.id.replace(/^AB#?/i, "") : "0000",
                      );
                if (!idNum) return null;
                const status =
                    prompt(
                        "Status (e.g. New, Active, Resolved, Closed):",

                    ) || "New";
                return { id: "AB" + idNum, status, url };

            document.getElementById("pcAdoEdit").onclick = () => {

            /* ============================================================ TOOLBAR ============================================================ */

                    .getElementById("optPen")
                    .classList.toggle("active", showPen);

            function selectToolByName(name) {

                    .querySelectorAll(".tool[data-tool]")
                    .forEach((b) => b.classList.remove("active"));

            document.addEventListener("keydown", (e) => {

                    ["INPUT", "TEXTAREA"].includes(

                    ) || document.activeElement.isContentEditable;
                if (typing) return;
                if (
                    (e.metaKey || e.ctrlKey) &&
                    e.key.toLowerCase() === "z" &&
                    !e.shiftKey
                ) {
                    e.preventDefault();
                    doUndo();
                    return;
                }
                if (
                    (e.metaKey || e.ctrlKey) &&
                    (e.key.toLowerCase() === "y" ||
                        (e.key.toLowerCase() === "z" && e.shiftKey))
                ) {
                    e.preventDefault();

                    deleteSelection();
                    return;
                }
                if (e.metaKey || e.ctrlKey || e.altKey) return;

                    selectToolByName(TOOL_SHORTCUTS[e.key]);

            function isTypingTarget(t) {
