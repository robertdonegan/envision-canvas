<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <title>Envision — Nested Canvas Prototype</title>
        <style>
            :root {
                /* Jacobs brand foundations: neutrals, blue-800 primary, IBM Plex Sans */
                --bg: #ffffff;
                --bg-canvas: #f3f3f3;
                --dot: #cfcfcf;
                --legend-w-base: 232px;
                --legend-w: var(--legend-w-base);
                --map-w: 0px;
                --surface: #ffffff;
                --border: #e6e6e6;
                --border-strong: #c8c8c8;
                --ink: #333333;
                --ink-dim: #666666;
                --ink-faint: #999999;
                --terminal: #3b6de6;
                --p2-blue: #0a7dff;
                --green: #0a9f5c;
                --green-soft: #e4f6ec;
                --red: #cc334f;
                --red-soft: #fde9ec;
                --amber: #c98400;
                --amber-soft: #fff3d6;
                --blue: #3b6de6;
                --blue-soft: #eef4fe;
                --purple: #7a35e0;
                --purple-soft: #f1e8fd;
                --teal: #0a8a9c;
                --teal-soft: #e0f3f6;
                --risk: #ff6100;
                --risk-soft: #ffecd8;
                /* Brand bright colours for pins */
                --pin-bug: #ff465f;
                --pin-feature: #0a7dff;
                --pin-question: #d97500;
                --pin-observation: #231edc;
                --pin-idea: #8a3ffc;
                --pin-risk: #ff6100;
                --pin-done: #12b76a;
                --mono: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
                --sans: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
                --radius: 3px;
            }
            * {
                box-sizing: border-box;
                -webkit-font-smoothing: antialiased;
            }
            html,
            body {
                margin: 0;
                padding: 0;
                height: 100%;
                background: var(--bg);
                overflow: hidden;
                font-family: var(--sans);
                color: var(--ink);
            }
            #app {
                position: relative;
                width: 100%;
                height: 100vh;
            }

            /* ---------- TOP BAR ---------- */
            #topbar {
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                height: 56px;
                display: flex;
                align-items: center;
                gap: 16px;
                padding: 0 18px;
                z-index: 50;
                background: var(--bg);
                border-bottom: 1px solid var(--border);
            }
            #breadcrumb {
                display: flex;
                align-items: center;
                gap: 4px;
                font-family: var(--mono);
                font-size: 12.5px;
                color: var(--ink-dim);
                flex-wrap: wrap;
            }
            #logoSlot {
                width: 30px;
                height: 30px;
                display: flex;
                align-items: center;
                justify-content: center;
                color: var(--ink);
                flex-shrink: 0;
            }
            #logoSlot svg {
                width: 22px;
                height: 22px;
            }
            #breadcrumb .crumb {
                cursor: pointer;
                padding: 4px 9px;
                border-radius: 7px;
                color: var(--ink-dim);
                transition:
                    background 0.15s,
                    color 0.15s;
                white-space: nowrap;
            }
            #breadcrumb .crumb:hover {
                background: var(--bg-canvas);
                color: var(--ink);
            }
            #breadcrumb .crumb.current {
                color: var(--ink);
                font-weight: 600;
                cursor: text;
            }
            #breadcrumb .crumb.current[contenteditable="true"] {
                background: #fff;
                outline: 1px solid var(--terminal);
                border-radius: 6px;
            }
            #breadcrumb .crumb.current:hover {
                background: none;
            }
            #breadcrumb .sep {
                color: var(--ink-faint);
                font-size: 11px;
            }


            #zoomctl button svg,
            .seg button svg,
            #presentBar button svg,
            .pc-btn svg,
            .ado-link-btn svg {
                width: 14px;
                height: 14px;
                display: block;
                flex-shrink: 0;
            }
            .seg button {
                display: flex;
                align-items: center;
                justify-content: center;
            }
            #presentBar button,
            .pc-btn[data-ui-icon],
            .ado-link-btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 5px;
            }
            .ado-link-btn {
                display: flex;
            }
            .ado-mini-btn svg {
                width: 12px;
                height: 12px;
            }
            .node-diff svg {
                width: calc(12px * var(--ts, 1));
                height: calc(12px * var(--ts, 1));
            }
            .frame-label .fc svg {
                width: 14px;
                height: 14px;
            }
            .frame-collapsed-card .fc {
                display: inline-flex;
            }
            .frame-collapsed-card .fc svg {
                width: calc(14px * var(--ts, 1));
                height: calc(14px * var(--ts, 1));
            }
            .link-card .lk-row svg {
                width: 12px;
                height: 12px;
                margin-right: -2px;
            }
            #breadcrumb .sep {
                display: inline-flex;
                align-items: center;
            }
            #breadcrumb .sep svg {
                width: 12px;
                height: 12px;
            }

            .topbtn {
                font-family: var(--mono);
                font-size: 11.5px;
                letter-spacing: 0.02em;
                background: var(--surface);
                border: 1px solid var(--border-strong);
                color: var(--ink);
                padding: 8px 13px;
                border-radius: 20px;
                cursor: pointer;
                display: flex;
                align-items: center;
                gap: 6px;
                transition:
                    background 0.15s,
                    border-color 0.15s;
            }
            .topbtn:hover {
                background: var(--terminal);
                color: #fff;
                border-color: var(--terminal);
            }
            .topbtn.icon-only {
                width: 36px;
                height: 36px;
                padding: 0;
                align-items: center;
                justify-content: center;
                font-size: 18px;
                line-height: 1;
                border-radius: 50%;
            }
            .topbtn.icon-only svg {
                display: block;
            }
            .topbtn.icon-only.active {
                background: var(--terminal);
                color: #fff;
                border-color: var(--terminal);
            }
            .topbtn.ghost {
                background: transparent;
                border-color: transparent;
                color: var(--ink-dim);
            }
            .topbtn.ghost:hover,
            .topbtn.ghost.active {
                background: var(--bg-canvas);
                border-color: transparent;
                color: var(--ink);
            }
            #topright {
                display: flex;
                gap: 8px;
            }
            #tableView {
                position: absolute;
                top: 56px;
                left: 0;
                right: 0;
                bottom: 0;
                z-index: 70;
                display: flex;
                flex-direction: column;
                background: var(--surface);
                font-family: var(--sans);
            }
            body.table-open #toolbar,
            body.table-open #zoomctl,
            body.table-open #hintToastWrap {
                display: none;
            }
            #tableView[hidden] {
                display: none;
            }
            .tv-head {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 16px 24px 8px 24px;
            }
            .tv-head h2 {
                margin: 0;
                font-size: 15px;
                font-weight: 700;
                color: var(--ink);
            }
            .tv-count {
                color: var(--ink-faint);
                font-size: 12px;
            }
            #tvFilter {
                margin-left: auto;
                width: 240px;
            }
            .tv-chips {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
                padding: 4px 24px 12px 24px;
            }
            .tv-chip {
                padding: 4px 10px;
                border: 1px solid var(--border-strong);
                border-radius: 12px;
                background: var(--surface);
                color: var(--ink-dim);
                font: inherit;
                font-size: 12px;
                cursor: pointer;
            }
            .tv-chip:hover {
                background: var(--bg-canvas);
            }
            .tv-chip.on {
                background: var(--p2-blue);
                border-color: var(--p2-blue);
                color: #fff;
            }
            .tv-scroll {
                flex: 1;
                overflow: auto;
                padding: 0 24px 24px 24px;
            }
            .tv-table {
                width: 100%;
                border-collapse: collapse;
                font-size: 12.5px;
                color: var(--ink);
            }
            .tv-table th {
                position: sticky;
                top: 0;
                z-index: 1;
                padding: 8px 10px;
                background: var(--surface);
                border-bottom: 1px solid var(--border-strong);
                color: var(--ink-faint);
                font-size: 11px;
                font-weight: 600;
                letter-spacing: 0.05em;
                text-align: left;
                text-transform: uppercase;
                white-space: nowrap;
                cursor: pointer;
                user-select: none;
            }
            .tv-table th:hover {
                color: var(--ink);
            }
            .tv-table th.sorted::after {
                content: " ↑";
            }
            .tv-table th.sorted.desc::after {
                content: " ↓";
            }
            .tv-table td {
                padding: 9px 10px;
                border-bottom: 1px solid var(--border);
                vertical-align: middle;
            }
            .tv-table tbody tr {
                cursor: pointer;
            }
            .tv-table tbody tr:hover {
                background: var(--bg-canvas);
            }
            .tv-type {
                display: flex;
                align-items: center;
                gap: 8px;
                white-space: nowrap;
                color: var(--ink-dim);
            }
            .tv-type svg {
                width: 16px;
                height: 16px;
                flex: none;
            }
            .tv-type .pin.legend-pin {
                cursor: pointer;
            }
            .tv-name {
                max-width: 460px;
                font-weight: 500;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .tv-dim {
                color: var(--ink-dim);
                white-space: nowrap;
            }
            .tv-dim a {
                color: var(--p2-blue);
            }
            .tv-empty {
                padding: 40px;
                text-align: center;
                color: var(--ink-faint);
            }
            #moreMenu {
                position: fixed;
                z-index: 400;
                min-width: 208px;
                padding: 4px;
                background: var(--surface);
                border: 1px solid var(--border-strong);
                border-radius: 4px;
                box-shadow: 0 6px 20px rgba(20, 18, 12, 0.14);
                font-family: var(--sans);
                font-size: 12.5px;
            }
            #moreMenu[hidden] {
                display: none;
            }
            #moreMenu button {
                display: flex;
                align-items: center;
                gap: 10px;
                width: 100%;
                padding: 8px 10px;
                border: none;
                border-radius: 3px;
                background: none;
                color: var(--ink);
                font: inherit;
                text-align: left;
                cursor: pointer;
            }
            #moreMenu button:hover,
            #moreMenu button:focus-visible {
                background: var(--bg-canvas);
                outline: none;
            }
            #moreMenu .mi-ico {
                display: flex;
                color: var(--ink-dim);
            }
            #moreMenu .mi-ico svg {
                width: 16px;
                height: 16px;
            }
            .mm-sep {
                height: 1px;
                margin: 4px 0;
                background: var(--border);
            }
            #actionToast {
                position: fixed;
                left: 50%;
                bottom: 72px;
                z-index: 500;
                transform: translate(-50%, 8px);
                padding: 8px 14px;
                border-radius: 4px;
                background: var(--ink);
                color: #fff;
                font-size: 12px;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.2s, transform 0.2s;
            }
            #actionToast.show {
                opacity: 1;
                transform: translate(-50%, 0);
            }

            #presence {
                display: flex;
            }
            .avatar {
                width: 26px;
                height: 26px;
                border-radius: 50%;
                border: 2px solid var(--bg);
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: var(--mono);
                font-size: 10px;
                font-weight: 700;
                color: #fff;
                margin-left: -8px;
                position: relative;
            }
            .avatar:first-child {
                margin-left: 0;
            }
            .avatar .dot {
                position: absolute;
                bottom: -1px;
                right: -1px;
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: #52d69a;
                border: 1.5px solid var(--bg);
            }

            #searchWrap {
                position: relative;
                width: 260px;
                margin-left: auto;
            }
            #searchInput {
                width: 100%;
            }
            #searchResults {
                position: absolute;
                top: 36px;
                left: 0;
                width: 320px;
                background: var(--surface);
                border: 1px solid var(--border-strong);
                border-radius: 10px;
                box-shadow: 0 14px 30px -10px rgba(20, 18, 12, 0.25);
                display: none;
                max-height: 340px;
                overflow: auto;
                z-index: 80;
            }
            #searchResults.open {
                display: block;
            }
            .sr-item {
                padding: 9px 12px;
                cursor: pointer;
                border-bottom: 1px solid var(--border);
                font-size: 12px;
            }
            .sr-item:last-child {
                border-bottom: none;
            }
            .sr-item:hover {
                background: var(--bg-canvas);
            }
            .sr-item .sr-path {
                font-family: var(--mono);
                font-size: 9.5px;
                color: var(--ink-faint);
                margin-bottom: 2px;
            }
            .sr-item .sr-text {
                color: var(--ink);
            }
            .sr-empty {
                padding: 14px;
                font-family: var(--mono);
                font-size: 11px;
                color: var(--ink-faint);
                text-align: center;
            }

            #overlayPanel {
                position: absolute;
                top: 56px;
                bottom: 0;
                right: var(--map-w);
                width: var(--legend-w);
                z-index: 55;
                background: var(--bg);
                border-left: 1px solid var(--border-strong);
                padding: 16px 14px;
                overflow-y: auto;
                font-family: var(--mono);
                font-size: 10.5px;
            }
            body.legend-hidden {
                --legend-w: 0px;
            }
            body.map-open {
                --map-w: var(--legend-w-base);
            }
            body.legend-hidden #overlayPanel {
                display: none;
            }
            #overlayPanel h2 {
                font-family: var(--mono);
                font-size: 12px;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                color: var(--ink-faint);
                font-weight: 500;
                margin: 0 0 14px;
            }
            .legend-section + .legend-section {
                margin-top: 16px;
                padding-top: 14px;
                border-top: 1px solid var(--border);
            }
            .legend-title {
                display: flex;
                align-items: center;
                gap: 6px;
                margin-bottom: 8px;
                color: var(--ink-faint);
                text-transform: uppercase;
                letter-spacing: 0.05em;
                cursor: pointer;
                user-select: none;
            }
            .legend-title::before {
                content: "";
                width: 7px;
                height: 7px;
                border-radius: 50%;
                border: 1.5px solid var(--ink-faint);
                box-sizing: border-box;
            }
            .legend-section.active .legend-title {
                color: var(--ink);
            }
            .legend-section.active .legend-title::before {
                background: var(--ink);
                border-color: var(--ink);
            }
            .pin.legend-pin {
                border: none;
                width: 16px;
                height: 16px;
                font-size: 9px;
                box-shadow: none;
                cursor: default;
                flex-shrink: 0;
            }
            .pin.legend-pin svg {
                width: 12px;
                height: 12px;
            }
            .pin.legend-pin:hover {
                transform: none;
            }
            .legend-row {
                display: flex;
                align-items: center;
                gap: 7px;
                padding: 3px 6px;
                margin: 0 -6px;
                border-radius: 5px;
                cursor: pointer;
                user-select: none;
            }
            .legend-count {
                margin-left: auto;
                color: var(--ink-faint);
                font-variant-numeric: tabular-nums;
            }
            .legend-row:hover {
                background: var(--bg-canvas);
            }
            .legend-row.focused {
                background: var(--bg-canvas);
                color: var(--ink);
                font-weight: 600;
            }
            .legend-section.has-focus .legend-row:not(.focused) {
                opacity: 0.45;
            }
            .pin-group {
                transition: opacity 0.15s;
            }
            .pin-group.pin-dim {
                opacity: 0.18;
            }
            .legend-swatch {
                width: 10px;
                height: 10px;
                border-radius: 50%;
                margin: 0 3px;
                flex-shrink: 0;
            }

            /* ---------- CANVAS ---------- */
            #viewport {
                position: absolute;
                inset: 0;
                top: 56px;
                right: calc(var(--legend-w) + var(--map-w));
                background: var(--bg-canvas);
                overflow: hidden;
                touch-action: none;
            }
            body.space-pan #viewport,
            body.space-pan #viewport * {
                cursor: grab;
            }
            body.space-pan #viewport.panning,
            body.space-pan #viewport.panning * {
                cursor: grabbing;
            }
            #dotgrid {
                position: absolute;
                inset: 0;
                background-image: radial-gradient(
                    var(--dot) var(--dot-r, 1.4px),
                    transparent var(--dot-r, 1.4px)
                );
                background-size: 26px 26px;
                pointer-events: none;
            }
            #dotgrid.zoom-anim {
                transition:
                    background-size 0.45s cubic-bezier(0.65, 0, 0.35, 1),
                    background-position 0.45s cubic-bezier(0.65, 0, 0.35, 1);
            }
            #canvasLayer {
                position: absolute;
                inset: 0;
                transform-origin: 0 0;
            }
            #canvasLayer.zoom-anim {
                transition: transform 0.45s cubic-bezier(0.65, 0, 0.35, 1);
            }

            /* ---------- TOOLBAR ---------- */
            #toolbar {
                position: absolute;
                top: 50%;
                left: 18px;
                transform: translateY(-50%);
                z-index: 60;
                background: var(--surface);
                border: 1px solid var(--border-strong);
                border-radius: 6px;
                padding: 6px;
                display: flex;
                flex-direction: column;
                gap: 3px;
                box-shadow: 0 10px 24px -10px rgba(20, 18, 12, 0.18);
            }
            #toolOptions {
                position: absolute;
                top: 50%;
                left: 86px;
                transform: translateY(-50%);
                z-index: 60;
            }
            .opt-panel {
                display: none;
                background: var(--surface);
                border: 1px solid var(--border-strong);
                border-radius: 12px;
                padding: 12px;
                box-shadow: 0 10px 24px -10px rgba(20, 18, 12, 0.18);
                width: 172px;
            }
            .opt-panel.flush {
                width: auto;
                padding: 8px 7px;
            }
            .opt-panel.active {
                display: block;
            }
            #toolOptions label {
                font-family: var(--mono);
                font-size: 9.5px;
                color: var(--ink-faint);
                text-transform: uppercase;
                letter-spacing: 0.05em;
                display: block;
                margin: 0 0 6px;
            }
            #toolOptions label:not(:first-of-type) {
                margin-top: 12px;
            }
            .swatches {
                display: flex;
                flex-direction: column;
                gap: 7px;
            }
            .swatch {
                width: 24px;
                height: 24px;
                border-radius: 50%;
                border: 2px solid transparent;
                cursor: pointer;
                padding: 0;
            }
            .swatch.active {
                border-color: var(--terminal);
                box-shadow: 0 0 0 2px var(--bg);
            }
            .tool {
                width: 42px;
                height: 40px;
                border-radius: 4px;
                border: none;
                background: transparent;
                color: var(--ink-dim);
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                transition:
                    background 0.12s,
                    color 0.12s;
                touch-action: manipulation;
                position: relative;
            }
            .tool svg {
                width: 16px;
                height: 16px;
                display: block;
            }
            .tool .kbd {
                position: absolute;
                bottom: 2px;
                right: 3px;
                font-family: var(--mono);
                font-size: 8px;
                line-height: 1;
                color: var(--ink-faint);
                opacity: 0.8;
            }
            .tool.active .kbd {
                color: rgba(255, 255, 255, 0.6);
            }
            .tool:hover {
                background: var(--bg-canvas);
                color: var(--ink);
            }
            .tool.active {
                background: var(--terminal);
                color: #fff;
            }
            .tool-divider {
                height: 1px;
                background: var(--border);
                margin: 3px 4px;
            }

            /* ---------- SAVE STATUS ---------- */
            #saveStatus {
                position: absolute;
                bottom: 18px;
                right: calc(var(--legend-w) + var(--map-w) + 18px);
                z-index: 60;
                display: flex;
                align-items: center;
                gap: 7px;
                height: 36px;
                padding: 0 12px;
                background: var(--surface);
                border: 1px solid var(--border-strong);
                border-radius: 20px;
                box-shadow: 0 10px 24px -10px rgba(20, 18, 12, 0.18);
                font-size: 12px;
                color: var(--ink-dim);
                user-select: none;
            }
            #saveStatus[hidden] {
                display: none;
            }
            #saveStatus .ss-dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: var(--green);
                flex: none;
            }
            #saveStatus[data-state="saving"] .ss-dot {
                background: var(--p2-blue);
                animation: ssPulse 1s ease-in-out infinite;
            }
            #saveStatus[data-state="error"] {
                color: #cc334f;
                border-color: #cc334f;
            }
            #saveStatus[data-state="error"] .ss-dot {
                background: #cc334f;
            }
            #saveStatus[data-state="local"] .ss-dot {
                background: var(--ink-faint);
            }
            @keyframes ssPulse {
                50% {
                    opacity: 0.25;
                }
            }

            /* ---------- ZOOM CONTROL ---------- */
            #zoomctl {
                position: absolute;
                bottom: 18px;
                left: 18px;
                z-index: 60;
                background: var(--surface);
                border: 1px solid var(--border-strong);
                border-radius: 20px;
                display: flex;
                align-items: center;
                gap: 2px;
                padding: 4px;
                box-shadow: 0 10px 24px -10px rgba(20, 18, 12, 0.18);
            }
            #zoomctl button {
                width: 28px;
                height: 28px;
                border-radius: 50%;
                border: none;
                background: transparent;
                color: var(--ink-dim);
                font-size: 15px;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                touch-action: manipulation;
            }
            #zoomctl button:hover {
                background: var(--bg-canvas);
                color: var(--ink);
            }
            #zoomlabel {
                font-family: var(--mono);
                font-size: 11px;
                color: var(--ink-dim);
                width: 46px;
                text-align: center;
            }
            #zoomctl button svg {
                width: 16px;
                height: 16px;
                display: block;
            }
            #zoomctl button.active,
            #zoomctl button.active:hover {
                background: var(--terminal);
                color: #fff;
            }
            #zoomReset {
                font-family: var(--mono);
                font-size: 10px;
                color: var(--ink-dim);
                padding: 0 10px;
                cursor: pointer;
            }
            #zoomReset:hover {
                color: var(--ink);
            }

            /* ---------- NODES ---------- */
            .node {
                position: absolute;
                background: var(--surface);
                border: none;
                border-radius: var(--radius);
                overflow: hidden;
                cursor: pointer;
                box-shadow:
                    0 0 0 1.5px var(--p2-blue),
                    0 0 0 4px var(--bg-canvas),
                    0 0 0 5.5px rgba(10, 125, 255, 0.5),
                    0 0 0 8px var(--bg-canvas),
                    0 0 0 9.5px rgba(10, 125, 255, 0.18),
                    0 6px 18px -8px rgba(20, 18, 12, 0.16);
                transition: box-shadow 0.15s;
                user-select: none;
                touch-action: none;
            }
            .node.selected {
                outline: 2px solid var(--p2-blue);
                outline-offset: 11px;
            }
            .node-head {
                height: 28px;
                cursor: grab;
                container-type: inline-size;
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 8px;
                background: #f7f7f7;
                border-bottom: 1px solid var(--border);
            }
            /* Pill and title scale inversely with zoom but are capped so they
               never outgrow the header/footer at small sizes */
            .node {
                --ts-pill: min(var(--ts, 1), 1.15);
                --ts-title: min(var(--ts, 1), 1.4);
                --ts-ctl: min(var(--ts, 1), 1.15);
            }
            .badge-live {
                display: flex;
                align-items: center;
                gap: calc(5px * var(--ts-pill));
                background: var(--terminal);
                color: #fff;
                font-family: var(--mono);
                font-size: calc(10.5px * var(--ts-pill));
                font-weight: 600;
                letter-spacing: 0.02em;
                padding: calc(3px * var(--ts-pill)) calc(8px * var(--ts-pill));
                border-radius: calc(9px * var(--ts-pill));
            }
            .badge-live .dot {
                width: calc(7px * var(--ts-pill));
                height: calc(7px * var(--ts-pill));
                border-radius: 50%;
                background: #52d69a;
                box-shadow: 0 0 0 0 rgba(82, 214, 154, 0.7);
                animation: pulse 1.8s infinite;
            }
            @keyframes pulse {
                0% {
                    box-shadow: 0 0 0 0 rgba(82, 214, 154, 0.55);
                }
                70% {
                    box-shadow: 0 0 0 5px rgba(82, 214, 154, 0);
                }
                100% {
                    box-shadow: 0 0 0 0 rgba(82, 214, 154, 0);
                }
            }
            .badge-static {
                font-family: var(--mono);
                font-size: calc(10.5px * var(--ts-pill));
                font-weight: 600;
                letter-spacing: 0.02em;
                color: var(--ink-dim);
                background: var(--bg-canvas);
                padding: calc(3px * var(--ts-pill)) calc(8px * var(--ts-pill));
                border-radius: calc(9px * var(--ts-pill));
                border: 1px solid var(--border);
            }
            .node-thumb {
                position: relative;
                width: 100%;
                height: calc(100% - 28px);
                background: #ffffff;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
            }
            .badge-live,
            .badge-static {
                cursor: pointer;
                white-space: nowrap;
                flex-shrink: 1;
                min-width: 0;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .node-head {
                gap: calc(2px * var(--ts-ctl));
                overflow: hidden;
            }
            .node-label {
                cursor: text;
                border-radius: 3px;
                padding: 1px 3px;
                margin: -1px -3px;
                font-size: calc(13px * var(--ts-title));
                font-weight: 700;
                color: var(--ink);
                flex: 1 1 0;
                margin-left: calc(4px * var(--ts-ctl));
                min-width: 0;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .node-label[contenteditable="true"] {
                background: #fff;
                outline: 1px solid var(--terminal);
                color: var(--ink);
            }
            /* Flood Component Library secondary button (small): 2px radius,
               1px border-primary, surface-1 fill, text-secondary, 500 weight */
            .node-dive,
            .node-upload,
            .image-card .img-upload,
            .node-delete,
            .node-diff {
                display: flex;
                align-items: center;
                justify-content: center;
                flex-shrink: 0;
                gap: calc(4px * var(--ts-ctl));
                height: calc(22px * var(--ts-ctl));
                padding: 0 calc(7px * var(--ts-ctl)) 0 calc(5px * var(--ts-ctl));
                --btn-stroke: var(--border);
                border: none;
                box-shadow: inset 0 0 0 calc(1px / var(--zoom, 1))
                    var(--btn-stroke);
                border-radius: calc(2px / var(--zoom, 1));
                background: var(--surface);
                color: var(--ink-dim);
                line-height: 1;
                cursor: pointer;
                transition:
                    background 0.12s,
                    box-shadow 0.12s,
                    color 0.12s;
            }
            .node-dive:hover,
            .node-delete:hover,
            .node-upload:hover,
            .image-card .img-upload:hover,
            .node-diff:hover {
                background: var(--bg-canvas);
                --btn-stroke: var(--border-strong);
                color: var(--ink);
            }
            .node-head .node-dive,
            .node-head .node-upload,
            .node-head .node-delete,
            .node-head .node-diff {
                margin-left: 0;
            }
            /* Dive-in button hidden for now (double-click still dives in) */
            .node-head .node-dive {
                display: none;
            }
            .node-diff,
            .node-upload,
            .node-delete {
                width: calc(22px * var(--ts-ctl));
                padding: 0;
            }
            .node-dive svg,
            .node-upload svg,
            .node-delete svg,
            .node-diff svg,
            .image-card .img-upload svg,
            .ado-mini-btn svg,
            .asset-delete svg,
            .frame-label .fc svg,
            .frame-collapsed-card .fc svg {
                flex: none;
            }
            .node-dive svg,
            .node-upload svg,
            .node-delete svg {
                width: calc(14px * var(--ts-ctl));
                height: calc(14px * var(--ts-ctl));
            }
            /* Compact jump-screen header/footer controls */
            .node .node-dive,
            .node .node-upload,
            .node .node-delete,
            .node .node-diff {
                height: calc(18px * var(--ts-ctl));
            }
            .node .node-upload,
            .node .node-delete,
            .node .node-diff {
                width: calc(18px * var(--ts-ctl));
            }
            .node .node-dive svg,
            .node .node-upload svg,
            .node .node-delete svg,
            .node .node-diff svg {
                width: calc(12px * var(--ts-ctl));
                height: calc(12px * var(--ts-ctl));
            }
            .node .node-btn-label {
                font-size: calc(9.5px * var(--ts-ctl));
            }
            /* Reflow the top bar as the screen narrows: Dive in drops its
               label, then the status pill drops its version text */
            @container (max-width: 270px) {
                .node-head .node-btn-label {
                    display: none;
                }
                .node-head .node-dive {
                    width: calc(18px * var(--ts-ctl));
                    padding: 0;
                }
            }
            @container (max-width: 190px) {
                .node-head .badge-live,
                .node-head .badge-static {
                    max-width: 38%;
                }
            }
            .node-diff svg {
                width: calc(14px * var(--ts-ctl));
                height: calc(14px * var(--ts-ctl));
            }
            .node-btn-label {
                font-family: var(--sans);
                font-size: calc(10px * var(--ts-ctl));
                font-weight: 500;
                white-space: nowrap;
            }
            .image-card .img-upload,
            .ado-mini-btn {
                padding: 0;
            }

            #diffModal {
                position: fixed;
                inset: 0;
                z-index: 300;
                background: rgba(20, 18, 12, 0.55);
                display: none;
                align-items: center;
                justify-content: center;
            }
            #diffModal.open {
                display: flex;
            }
            #diffInner {
                width: min(720px, 90vw);
                background: var(--surface);
                border-radius: 14px;
                padding: 18px;
                box-shadow: 0 30px 60px -10px rgba(0, 0, 0, 0.4);
            }
            #diffStage {
                position: relative;
                width: 100%;
                aspect-ratio: 16/10;
                background: #ffffff;
                border: 1px solid var(--border);
                border-radius: 10px;
                overflow: hidden;
                margin-bottom: 14px;
            }
            #diffStage img {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                object-fit: contain;
            }
            #diffOld {
                opacity: 1;
            }
            #diffNew {
                opacity: 0;
            }
            #diffSlider {
                width: 100%;
            }
            .diff-labels {
                display: flex;
                justify-content: space-between;
                font-family: var(--mono);
                font-size: 10.5px;
                color: var(--ink-faint);
                margin-top: 6px;
            }
            .diff-close {
                margin-top: 14px;
                text-align: right;
            }
            #confirmModal {
                position: fixed;
                inset: 0;
                z-index: 320;
                background: rgba(20, 18, 12, 0.55);
                display: none;
                align-items: center;
                justify-content: center;
            }
            #confirmModal.open {
                display: flex;
            }
            #confirmInner {
                width: min(460px, 90vw);
                background: var(--surface);
                border-radius: 14px;
                padding: 20px;
                box-shadow: 0 30px 60px -10px rgba(0, 0, 0, 0.4);
            }
            #confirmTitle {
                font-family: var(--sans);
                font-size: 16px;
                font-weight: 600;
                color: var(--red);
                margin-bottom: 8px;
            }
            #confirmBody {
                font-size: 13px;
                line-height: 1.5;
                color: var(--ink-dim);
                margin-bottom: 18px;
            }
            #confirmBody strong {
                color: var(--ink);
            }
            .confirm-actions {
                display: flex;
                justify-content: flex-end;
                gap: 8px;
            }
            .node-thumb img {
                width: 100%;
                height: 100%;
                object-fit: contain;
                display: block;
            }

            .thumb-ui {
                position: absolute;
                inset: 8px;
                border-radius: 4px;
                background: #ffffff;
                border: 1px solid var(--border);
            }
            .thumb-bar {
                height: 9px;
                background: #ececec;
                border-radius: 2px;
                margin: 7px 7px 0;
            }
            .thumb-row {
                display: flex;
                gap: 5px;
                margin: 6px 7px 0;
            }
            .thumb-block {
                background: #f3f3f3;
                border-radius: 2px;
                flex: 1;
            }
            .thumb-block.accent {
                background: var(--green-soft);
                border: 1px solid #b5e3cb;
            }

            /* generic asset card (image / link / text) */
            .asset-card {
                position: absolute;
                background: var(--surface);
                border: 1px solid var(--border-strong);
                border-radius: var(--radius);
                overflow: hidden;
                box-shadow: 0 6px 18px -8px rgba(20, 18, 12, 0.16);
                cursor: pointer;
                user-select: none;
                touch-action: none;
            }
            .asset-card.selected {
                outline: 2px solid var(--terminal);
                outline-offset: 2px;
            }
            .image-card {
                display: flex;
                flex-direction: column;
                /* capped so the 30px footer never overflows at small zoom */
                --ts-img: min(var(--ts, 1), 1.15);
                --ts-ctl: var(--ts-img);
                --ts-title: min(var(--ts, 1), 1.4);
            }
            .image-card .img-body {
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                color: var(--ink-faint);
                font-family: var(--mono);
                font-size: 10px;
                background: repeating-linear-gradient(
                    45deg,
                    #f3f3f3 0 8px,
                    #ffffff 8px 16px
                );
                overflow: hidden;
            }
            .image-card .img-body img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }
            .image-card .img-foot {
                height: 30px;
                font-family: var(--mono);
                font-size: 9px;
                color: var(--ink-faint);
                display: flex;
                align-items: center;
                padding: 0 8px;
                border-top: 1px solid var(--border);
            }
            .link-card {
                width: 200px;
                padding: 10px 12px;
            }
            .link-card .lk-row {
                display: flex;
                align-items: center;
                gap: 7px;
                font-family: var(--mono);
                font-size: 9px;
                color: var(--green);
                text-transform: uppercase;
                letter-spacing: 0.04em;
                margin-bottom: 4px;
            }
            .link-card .lk-title {
                font-size: calc(12.5px * var(--ts, 1));
                color: var(--ink);
                font-weight: 600;
                margin-bottom: 2px;
            }
            .link-card .lk-url {
                font-size: 10.5px;
                color: var(--ink-faint);
                word-break: break-all;
                cursor: pointer;
            }
            .asset-label {
                cursor: text;
                border-radius: 3px;
                padding: 1px 3px;
                margin: -1px -3px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .image-card .asset-label {
                font-size: calc(14.5px * var(--ts-title));
                font-weight: 700;
                color: var(--ink);
                min-width: 0;
                flex: 1 1 auto;
            }
            .image-card .img-upload {
                width: calc(22px * var(--ts-img));
                height: calc(22px * var(--ts-img));
                padding: 0;
                margin-left: calc(5px * var(--ts-img));
            }
            .image-card .img-upload svg {
                width: calc(14px * var(--ts-img));
                height: calc(14px * var(--ts-img));
            }
            .image-card .img-empty {
                color: var(--ink-faint);
                font-family: var(--mono);
                font-size: calc(10px * var(--ts-img));
                opacity: 0.6;
            }
            .asset-label[contenteditable="true"] {
                background: #fff;
                outline: 1px solid var(--terminal);
                color: var(--ink);
            }
            .text-card {
                min-width: 90px;
                max-width: 280px;
                padding: 6px 8px;
                background: transparent;
                border: 1px dashed transparent;
                border-radius: 6px;
                font-size: 13.5px;
                line-height: 1.45;
                color: var(--ink);
                overflow: visible;
            }
.text-card:hover,
.text-card.selected {
                border-color: var(--border-strong);
                background: rgba(255, 255, 255, 0.6);
            }
            .text-card.selected {
                outline: 2px solid var(--terminal);
                outline-offset: 2px;
            }
            .asset-delete {
                position: absolute;
                top: -8px;
                right: -8px;
                width: 18px;
                height: 18px;
                border-radius: 50%;
                background: var(--red);
                color: #fff;
                display: none;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                border: 1px solid #fff;
                box-shadow: 0 2px 6px rgba(20, 18, 12, 0.25);
                z-index: 5;
            }
            .asset-delete svg {
                width: 14px;
                height: 14px;
            }
            .text-card:hover .asset-delete,
            .text-card.selected .asset-delete {
                display: flex;
            }
            .text-card[contenteditable="true"]:focus {
                outline: none;
                border-color: var(--terminal);
                background: #fff;
            }

            /* pins */
            .pin-group {
                position: absolute;
                display: flex;
                align-items: flex-start;
                transform-origin: 12.5px 12.5px;
                /* cancel the canvas zoom so pins stay a constant on-screen size */
                transform: scale(calc(1 / var(--zoom, 1)));
                z-index: 5;
            }
            .pin {
                width: 25px;
                height: 25px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: var(--mono);
                font-size: 12px;
                font-weight: 700;
                color: #fff;
                cursor: pointer;
                border: 2px solid #fff;
                box-shadow: 0 1px 2px #0000001a, 0 2px 4px #0000001a;
                transform: scale(1);
                transition: transform 0.12s;
                touch-action: none;
                user-select: none;
            }
            .pin:hover {
                transform: scale(1.25);
            }
            .pin svg {
                width: 16px;
                height: 16px;
                pointer-events: none;
            }
            .pin.bug {
                background: var(--pin-bug);
            }
            .pin.feature {
                background: var(--pin-feature);
            }
            .pin.observation {
                background: var(--pin-observation);
            }
            .pin.idea {
                background: var(--pin-idea);
            }
            .pin.question {
                background: var(--pin-question);
            }
            .pin.risk {
                background: var(--pin-risk);
            }
            .pin.done {
                background: var(--pin-done);
            }

            .sticky {
                position: absolute;
                width: 170px;
                padding: 10px 11px;
                border-radius: 6px;
                background: #fcf3d6;
                border: 1px solid #e6d49b;
                color: #5c4a1b;
                font-size: 11.5px;
                line-height: 1.4;
                box-shadow: 0 6px 16px -8px rgba(20, 18, 12, 0.2);
            }
            .sticky .sticky-tag {
                font-family: var(--mono);
                font-size: 9px;
                color: var(--amber);
                letter-spacing: 0.05em;
                text-transform: uppercase;
                margin-bottom: 5px;
                display: block;
            }

            .frame-box {
                position: absolute;
                border: 1.5px dashed var(--border-strong);
                border-radius: 10px;
                background: rgba(255, 255, 255, 0.18);
                pointer-events: none;
            }
            .lasso-box {
                position: absolute;
                border: 1.5px dashed var(--terminal);
                border-radius: 4px;
                background: rgba(24, 23, 18, 0.06);
                pointer-events: none;
            }
            .pin.multi-selected {
                outline: 2px solid var(--terminal);
                outline-offset: 3px;
            }
            .frame-label {
                position: absolute;
                top: -26px;
                left: 0;
                display: flex;
                align-items: center;
                gap: 6px;
                pointer-events: auto;
            }
            .frame-label .ft {
                font-family: var(--mono);
                font-size: calc(10px * var(--ts, 1));
                color: var(--ink-dim);
                background: var(--surface);
                border: 1px solid var(--border-strong);
                border-radius: calc(6px * var(--ts, 1));
                padding: calc(3px * var(--ts, 1)) calc(8px * var(--ts, 1));
                cursor: text;
            }
            .frame-label .fc {
                font-family: var(--mono);
                font-size: 10px;
                color: var(--ink-faint);
                background: var(--surface);
                border: 1px solid var(--border-strong);
                border-radius: 6px;
                width: 20px;
                height: 20px;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
            }
            .frame-label .fc:hover {
                background: var(--terminal);
                color: #fff;
            }
            .frame-box.collapsed {
                border: none;
                background: none;
            }
            .frame-collapsed-card {
                display: inline-flex;
                align-items: center;
                gap: 7px;
                background: var(--surface);
                border: 1px solid var(--border-strong);
                border-radius: 9px;
                padding: 7px 11px;
                box-shadow: 0 8px 18px -8px rgba(20, 18, 12, 0.22);
                pointer-events: auto;
            }
            .frame-collapsed-card .ft {
                font-family: var(--mono);
                font-size: calc(11px * var(--ts, 1));
                color: var(--ink);
                cursor: text;
            }
            .frame-collapsed-card .fc {
                font-family: var(--mono);
                font-size: calc(10px * var(--ts, 1));
                color: var(--ink-faint);
                cursor: pointer;
            }
            .frame-collapsed-card .fc:hover {
                color: var(--ink);
            }
            .frame-box.selected {
                outline: 2px solid var(--terminal);
                outline-offset: 3px;
                border-radius: 12px;
            }
            .frame-box.collapsed.selected {
                outline: none;
            }
            .frame-box.collapsed.selected .frame-collapsed-card {
                outline: 2px solid var(--terminal);
                outline-offset: 3px;
                border-radius: 12px;
            }

            #presentBar {
                position: fixed;
                bottom: 24px;
                left: 50%;
                transform: translateX(-50%);
                z-index: 250;
                background: var(--terminal);
                color: #fff;
                border-radius: 24px;
                padding: 10px 16px;
                display: none;
                align-items: center;
                gap: 14px;
                font-family: var(--mono);
                font-size: 12px;
                box-shadow: 0 14px 30px -8px rgba(0, 0, 0, 0.5);
            }
            #presentBar.open {
                display: flex;
            }
            #presentBar button {
                background: rgba(255, 255, 255, 0.12);
                border: none;
                color: #fff;
                border-radius: 14px;
                padding: 6px 12px;
                cursor: pointer;
                font-family: var(--mono);
                font-size: 12px;
            }
            #presentBar button:hover {
                background: rgba(255, 255, 255, 0.22);
            }

            .sprintchip {
                position: relative;
                margin-left: 4px;
                align-self: center;
                font-family: var(--mono);
                font-size: 9px;
                letter-spacing: 0.03em;
                color: var(--ink-dim);
                background: var(--surface);
                border: 1px solid var(--border);
                padding: 3px 7px;
                border-radius: 10px;
                white-space: nowrap;
                z-index: 4;
            }
            body.hide-pin-labels .sprintchip {
                display: none;
            }
            .legend-toggle {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 8px;
                margin: 0 0 14px;
                padding-bottom: 14px;
                border-bottom: 1px solid var(--border);
                color: var(--ink);
                cursor: pointer;
                user-select: none;
            }
            .legend-switch {
                position: relative;
                width: 28px;
                height: 16px;
                border-radius: 8px;
                background: var(--border-strong);
                flex: none;
                transition: background 0.15s;
            }
            .legend-switch::after {
                content: "";
                position: absolute;
                top: 2px;
                left: 2px;
                width: 12px;
                height: 12px;
                border-radius: 50%;
                background: #fff;
                transition: transform 0.15s;
            }
            .legend-toggle[aria-checked="true"] .legend-switch {
                background: var(--p2-blue);
            }
            .legend-toggle[aria-checked="true"] .legend-switch::after {
                transform: translateX(12px);
            }
            .chip-ado-link {
                color: var(--green);
                text-decoration: underline;
                text-decoration-color: #b5e3cb;
                cursor: pointer;
            }
            .chip-ado-link:hover {
                color: var(--ink);
            }

            svg.drawlayer {
                position: absolute;
                left: -4000px;
                top: -4000px;
                width: 10000px;
                height: 10000px;
            }
            svg.drawlayer path.pen-stroke {
                fill: none;
                stroke: var(--ink);
                stroke-width: 2.4;
                stroke-linecap: round;
                stroke-linejoin: round;
            }
            svg.drawlayer path.hl-stroke {
                fill: none;
                stroke: #ffb41e;
                stroke-width: 14;
                stroke-linecap: round;
                stroke-linejoin: round;
                opacity: 0.3;
                mix-blend-mode: multiply;
            }
            svg.drawlayer line.arrow-line {
                stroke: var(--ink);
                stroke-width: 2;
            }
            .arrow-handle {
                position: absolute;
                width: 14px;
                height: 14px;
                border-radius: 50%;
                background: var(--terminal);
                border: 2px solid #fff;
                box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
                cursor: grab;
                z-index: 6;
                touch-action: none;
            }
            .arrow-handle:active {
                cursor: grabbing;
            }
            .connector-anchor {
                position: absolute;
                width: 12px;
                height: 12px;
                border-radius: 50%;
                background: #fff;
                border: 2px solid var(--terminal);
                z-index: 7;
                cursor: crosshair;
                touch-action: none;
                transition: transform 0.1s;
            }
            .connector-anchor:hover {
                transform: scale(1.3);
                background: var(--terminal);
            }

            /* ---------- DIVE TRANSITION ---------- */
            #diveLayer {
                position: fixed;
                inset: 0;
                z-index: 200;
                pointer-events: none;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            #diveClone {
                position: absolute;
                background: var(--surface);
                border: 1px solid var(--terminal);
                border-radius: 12px;
                box-shadow: 0 0 0 0 rgba(24, 23, 18, 0);
                transition:
                    transform 0.55s cubic-bezier(0.65, 0, 0.35, 1),
                    opacity 0.55s ease,
                    box-shadow 0.55s ease;
            }
            #diveFlash {
                position: absolute;
                inset: 0;
                background: var(--bg-canvas);
                opacity: 0;
                transition: opacity 0.35s ease;
            }

            /* ---------- SITEMAP ---------- */
            #sitemap {
                position: absolute;
                top: 56px;
                right: 0;
                bottom: 0;
                width: var(--map-w);
                background: var(--bg);
                border-left: 1px solid var(--border-strong);
                z-index: 55;
                padding: 16px 14px;
                overflow-y: auto;
                display: none;
            }
            body.map-open #sitemap {
                display: block;
            }
            #sitemap h2 {
                font-family: var(--mono);
                font-size: 12px;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                color: var(--ink-faint);
                font-weight: 500;
                margin: 0 0 14px;
            }
            .smap-item {
                position: relative;
            }
            .smap-children {
                margin-left: 15px;
                padding-left: 12px;
            }
            .smap-children > .smap-item::before {
                content: "";
                position: absolute;
                left: -12px;
                top: 0;
                bottom: 0;
                border-left: 1px solid var(--border-strong);
            }
            .smap-children > .smap-item:last-child::before {
                bottom: auto;
                height: 17px;
            }
            .smap-children > .smap-item::after {
                content: "";
                position: absolute;
                left: -12px;
                top: 17px;
                width: 10px;
                border-top: 1px solid var(--border-strong);
            }
            .smap-node {
                display: flex;
                align-items: center;
                gap: 10px;
                height: 34px;
                box-sizing: border-box;
                padding: 0 12px;
                border-radius: 8px;
                cursor: pointer;
                font-family: var(--mono);
                font-size: 12.5px;
                color: var(--ink-dim);
                border: 1px solid transparent;
                transition:
                    background 0.15s,
                    border-color 0.15s;
            }
            .smap-node:hover {
                background: var(--surface);
                border-color: var(--border);
            }
            .smap-node.dragging {
                opacity: 0.4;
            }
            .smap-node.drop-target {
                background: #e8f2ff;
                border-color: var(--p2-blue);
                color: var(--ink);
            }
            .smap-node.drop-target .smap-dot {
                background: var(--p2-blue);
            }
            .smap-node.active {
                color: var(--ink);
                background: var(--green-soft);
                border-color: #b5e3cb;
            }
            .smap-node .smap-dot {
                width: 7px;
                height: 7px;
                border-radius: 50%;
                background: var(--ink-faint);
                flex-shrink: 0;
            }
            .smap-node.active .smap-dot {
                background: var(--green);
            }
            .smap-title {
                min-width: 0;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .smap-meta {
                margin-left: auto;
                flex-shrink: 0;
                white-space: nowrap;
                color: var(--ink-faint);
                font-size: 10px;
            }

            #pinCard .pc-close {
                position: absolute;

                right: 6px;

                height: 16px;
                padding: 0;
                border: none;
                border-radius: 2px;

                display: flex;
                align-items: center;

                background: var(--bg-canvas);

            #pinCard .pc-drag::before {

            #pinCard .pc-row {

            #pinCard textarea {

            #pinCard label {

            #pinCard .pc-actions {

            /* Flood Component Library buttons: 32px, 2px radius, 500 weight.
               Secondary = surface-1 + border-primary; primary = brand; danger = red */
            .pc-btn {

            .pc-btn.danger:hover {

            #pcThread {

            .pc-comment .pcc-actions {

                width: 20px;
                height: 20px;
                padding: 0;
                border: none;
                border-radius: 4px;
                background: transparent;
                color: var(--ink-faint);
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .pcc-actions button svg {
                width: 13px;
                height: 13px;
            }
            .pcc-actions button:hover {
                background: var(--bg-canvas);
                color: var(--ink);
            }
            .pcc-actions button.pcc-del:hover {
                background: var(--red);

            }
            .pc-comment .pcc-text {

            .pcc-link {
                color: var(--p2-blue);

                text-underline-offset: 2px;
                word-break: break-all;

            .pcc-link:hover {
                color: #0a6cdc;
            }
            .pc-comment textarea.pcc-edit {
                width: 100%;
                min-height: 52px;
                resize: vertical;
            }
            .pcc-edit-row {
                display: flex;
                justify-content: flex-end;
                gap: 6px;
                margin-top: 6px;
            }
            .pcc-edit-row button {
                font: inherit;
                font-size: 11px;
                padding: 3px 10px;
                border-radius: 4px;
                border: 1px solid var(--border-strong);
                background: #fff;
                color: var(--ink-dim);
                cursor: pointer;
            }
            .pcc-edit-row button.pcc-save {
                background: var(--terminal);
                border-color: var(--terminal);

            }
            .pc-comment .pcc-meta {

            .ado-block {

                border-radius: 2px;

                color: var(--ink-dim);

                display: flex;
                align-items: center;
                justify-content: center;
                flex-shrink: 0;

                border-radius: 2px;

                background: var(--surface);

                    white-space: normal;
                    text-align: center;
                    max-width: 92vw;
                }
            }
            #hintToast b {
                color: var(--ink);
            }
        
            /* Flood Component Library — Input Field (Standard):
               default surface-2 / 1px border-primary / text-secondary, 2px radius;
               hover = blue 1px border; focus = white fill, 2px black border;
               disabled = surface-4 / border-secondary */

</style>

        <script>
            /* ============================================================
   CLOUD SYNC (Supabase) — fill this in to make the board shared
   & persistent across browsers.

   1. In your Supabase org (supabase.com/dashboard/org/ahjcfcnjjkdpduiucavd),
      open or create a PROJECT — the org page just lists projects,
      you need to be inside one to get API credentials.
   2. In that project: Project Settings (gear icon) → API.
      Copy "Project URL" and the "anon public" key into the two
      constants below.
   3. Open the SQL Editor (left sidebar) → New query → paste and run:

        create table boards (
          id text primary key,
          data jsonb,
          updated_at timestamptz default now()
        );
        alter table boards enable row level security;
        create policy "Public read"   on boards for select using (true);
        create policy "Public insert" on boards for insert with check (true);
        create policy "Public update" on boards for update using (true);
        alter publication supabase_realtime add table boards;

      The three policies are what make "anyone with the URL can
      edit" work with no login — same tradeoff as before: this
      table is wide open to anyone who has your anon key (which is
      visible in this file's source), but it's scoped to ONLY this
      one table, not your whole database. Fine for sharing with
      testers; add real auth before this goes further than that.
   4. Re-upload this file wherever you're hosting it.

   If you leave the values below empty, the app runs exactly as
   before: local-only, resets to the sample board on refresh.
   ============================================================ */

                if (!el) return;

                const wait =

                    if (state === "saving") savingSince = Date.now();

                        .from("boards")
                        .select("data")
                        .eq("id", "envision-board")
                        .maybeSingle();
                    if (error) throw error;
                    if (data && data.data) {
                        tree = data.data;
                        if (!pathValid(path)) path = ["root"];
                    } else {
                        rememberSaved(canon(tree));

                            .from("boards")
                            .upsert({
                                id: "envision-board",
                                data: tree,
                                updated_at: new Date().toISOString(),
                            });

                    console.warn(
                        "Cloud sync failed to connect, falling back to local-only:",
                        e,

                return snapEnabled ? Math.round(v / GRID_SIZE) * GRID_SIZE : v;
            }
            let currentArrowHead = "end"; // 'end' | 'both' | 'none'
            let currentArrowDash = false;
            let selectedEl = null,
                selectedData = null;
            let multiSelected = new Set();
            let domByObj = new WeakMap();
            let selectedDrawing = null,
                selectedDrawingCv = null;
            function deleteSelectedDrawing() {
                if (!selectedDrawing || !selectedDrawingCv) return;
                pushUndo();
                const idx = selectedDrawingCv.drawings.indexOf(selectedDrawing);
                if (idx > -1) selectedDrawingCv.drawings.splice(idx, 1);
                selectedDrawing = null;
                selectedDrawingCv = null;
                render();
            }
            function removeItemFromCanvas(cv, o) {
                const ni = cv.nodes.indexOf(o);
                if (ni > -1) {
                    cv.nodes.splice(ni, 1);
                    if (o.childId && cv.children && cv.children[o.childId])
                        delete cv.children[o.childId];
                }
                const ai = (cv.assets || []).indexOf(o);
                if (ai > -1) cv.assets.splice(ai, 1);
                const pi = (cv.pins || []).indexOf(o);
                if (pi > -1) cv.pins.splice(pi, 1);
                const fi = (cv.frames || []).indexOf(o);
                if (fi > -1) cv.frames.splice(fi, 1);
            }
            async function deleteSelection() {
                const cv = getCanvas(path);
                const items = [];
                if (multiSelected.size > 0) {
                    items.push(...multiSelected);
                } else if (
                    selectedData &&
                    (cv.nodes.includes(selectedData) ||
                        (cv.assets || []).includes(selectedData) ||
                        (cv.pins || []).includes(selectedData) ||
                        (cv.frames || []).includes(selectedData))
                ) {
                    items.push(selectedData);
                }
                if (items.length === 0) {
                    deleteSelectedDrawing();
                    return;
                }
                const screens = items.filter(
                    (o) =>
                        cv.nodes.includes(o) &&
                        o.childId &&
                        cv.children &&
                        cv.children[o.childId],
                );
                if (screens.length) {
                    const plural = screens.length > 1 ? "s" : "";
                    const ok = await showConfirm({
                        title: `Delete screen${plural}?`,
                        bodyHtml:
                            screenWarningHtml(screens, cv) +
                            " You can Undo afterwards.",
                        confirmLabel: "Delete",
                    });
                    if (!ok) return;
                }
                pushUndo();
                items.forEach((o) => removeItemFromCanvas(cv, o));
                multiSelected.clear();

            function getCanvas(p) {
                let node = tree;

                layerEl.style.setProperty(
